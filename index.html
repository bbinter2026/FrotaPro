var SQLTXT="-- =====================================================================\n-- FROTA PRO · Controlo de Licenças (Painel do Programador)\n-- Cole tudo no Supabase > SQL Editor > New query > Run.\n-- Pode ser executado mais de uma vez sem problema.\n--\n-- ANTES DE EXECUTAR: troque COLOQUE_AQUI_A_SUA_SENHA (mais abaixo)\n-- pela sua palavra-passe MASTER. Enquanto ficar o texto original,\n-- o painel recusa-se a abrir (de propósito).\n--\n-- Como protege os dados:\n--  * As tabelas ficam FECHADAS ao acesso directo (anon/authenticated).\n--  * O app só fala com funções. A palavra-passe master é validada aqui\n--    no Postgres (guardada com hash bcrypt) e NÃO existe no HTML.\n--  * 8 tentativas erradas bloqueiam o painel durante 10 minutos.\n-- =====================================================================\n\ncreate extension if not exists pgcrypto with schema extensions;\n\n-- ---------- tabelas ----------\ncreate table if not exists public.frota_licencas (\n  id               uuid primary key default gen_random_uuid(),\n  codigo           text not null unique,\n  empresa          text not null,\n  contacto         text,\n  notas            text,\n  expira           date not null,\n  max_dispositivos int  not null default 3 check (max_dispositivos >= 0),\n  estado           text not null default 'ativa' check (estado in ('ativa','bloqueada')),\n  created_at       timestamptz not null default now(),\n  updated_at       timestamptz not null default now()\n);\n\ncreate table if not exists public.frota_licenca_dispositivos (\n  licenca_id uuid not null references public.frota_licencas(id) on delete cascade,\n  device_id  text not null,\n  info       jsonb not null default '{}'::jsonb,\n  first_seen timestamptz not null default now(),\n  last_seen  timestamptz not null default now(),\n  primary key (licenca_id, device_id)\n);\n\ncreate table if not exists public.frota_dev_config (\n  id            int primary key default 1 check (id = 1),\n  pass_hash     text not null,\n  falhas        int not null default 0,\n  bloqueado_ate timestamptz\n);\n\nalter table public.frota_licencas             enable row level security;\nalter table public.frota_licenca_dispositivos enable row level security;\nalter table public.frota_dev_config           enable row level security;\nrevoke all on table public.frota_licencas             from anon, authenticated;\nrevoke all on table public.frota_licenca_dispositivos from anon, authenticated;\nrevoke all on table public.frota_dev_config           from anon, authenticated;\n\n-- ---------- palavra-passe master (só cria se ainda não existir) ----------\n-- >>> TROQUE o texto entre aspas pela sua palavra-passe (mín. 8 caracteres) <<<\ninsert into public.frota_dev_config (id, pass_hash)\nselect 1, extensions.crypt('COLOQUE_AQUI_A_SUA_SENHA', extensions.gen_salt('bf'))\nwhere not exists (select 1 from public.frota_dev_config);\n\n-- Para mudar a palavra-passe mais tarde (também pode ser feito no painel):\n--   update public.frota_dev_config\n--      set pass_hash = extensions.crypt('NOVA_SENHA', extensions.gen_salt('bf')), falhas = 0, bloqueado_ate = null;\n\n-- ---------- validação interna da palavra-passe (não exposta) ----------\ncreate or replace function public.frota_dev_auth(p_pass text)\nreturns text\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare c public.frota_dev_config%rowtype;\nbegin\n  select * into c from public.frota_dev_config where id = 1;\n  if not found then return 'setup'; end if;\n  if c.bloqueado_ate is not null and c.bloqueado_ate > now() then return 'locked'; end if;\n  if p_pass is not null and length(p_pass) >= 8\n     and p_pass <> 'COLOQUE_AQUI_A_SUA_SENHA'\n     and c.pass_hash = crypt(p_pass, c.pass_hash) then\n    if c.falhas > 0 or c.bloqueado_ate is not null then\n      update public.frota_dev_config set falhas = 0, bloqueado_ate = null where id = 1;\n    end if;\n    return 'ok';\n  end if;\n  update public.frota_dev_config\n     set falhas        = case when falhas + 1 >= 8 then 0 else falhas + 1 end,\n         bloqueado_ate = case when falhas + 1 >= 8 then now() + interval '10 minutes' else null end\n   where id = 1;\n  return 'auth';\nend;\n$$;\n\n-- ---------- app do cliente: validar / registar aparelho ----------\ncreate or replace function public.frota_check_license(p_code text, p_device text, p_info jsonb default '{}'::jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare\n  l    public.frota_licencas%rowtype;\n  code text := upper(trim(coalesce(p_code, '')));\n  hoje date := (now() at time zone 'Africa/Maputo')::date;\n  n    int;\n  v_info jsonb := '{}'::jsonb;\nbegin\n  if code = '' or length(code) > 40 or p_device is null or length(p_device) < 8 or length(p_device) > 80 then\n    return jsonb_build_object('ok', false, 'reason', 'not_found');\n  end if;\n  select * into l from public.frota_licencas where codigo = code;\n  if not found then return jsonb_build_object('ok', false, 'reason', 'not_found'); end if;\n  if l.estado = 'bloqueada' then return jsonb_build_object('ok', false, 'reason', 'blocked'); end if;\n  if l.expira < hoje then\n    return jsonb_build_object('ok', false, 'reason', 'expired', 'exp', l.expira);\n  end if;\n\n  if p_info is not null and jsonb_typeof(p_info) = 'object' and length(p_info::text) < 600 then\n    v_info := p_info;\n  end if;\n\n  if exists (select 1 from public.frota_licenca_dispositivos where licenca_id = l.id and device_id = p_device) then\n    update public.frota_licenca_dispositivos\n       set last_seen = now(), info = case when v_info = '{}'::jsonb then public.frota_licenca_dispositivos.info else v_info end\n     where licenca_id = l.id and device_id = p_device;\n  else\n    select count(*) into n from public.frota_licenca_dispositivos where licenca_id = l.id;\n    if n >= l.max_dispositivos then\n      return jsonb_build_object('ok', false, 'reason', 'device');\n    end if;\n    insert into public.frota_licenca_dispositivos (licenca_id, device_id, info) values (l.id, p_device, v_info);\n  end if;\n\n  return jsonb_build_object('ok', true, 'empresa', l.empresa, 'exp', l.expira,\n                            'dias', l.expira - hoje, 'max', l.max_dispositivos);\nend;\n$$;\n\n-- ---------- painel do programador (todas devolvem {ok:true,data:..} ou {ok:false,error:..}) ----------\ncreate or replace function public.frota_dev_verify(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_list(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  select coalesce(jsonb_agg(to_jsonb(x) order by x.created_at desc), '[]'::jsonb) into r\n  from (\n    select l.id, l.codigo, l.empresa, l.contacto, l.notas, l.expira, l.max_dispositivos, l.estado, l.created_at,\n           (select count(*) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as n_disp,\n           (select max(d.last_seen) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as ultimo_acesso,\n           coalesce((select jsonb_agg(jsonb_build_object('device_id', d.device_id, 'info', d.info,\n                                                         'first_seen', d.first_seen, 'last_seen', d.last_seen)\n                                      order by d.last_seen desc)\n                       from public.frota_licenca_dispositivos d where d.licenca_id = l.id), '[]'::jsonb) as dispositivos\n      from public.frota_licencas l\n  ) x;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_add(p_pass text, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); new_id uuid;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    insert into public.frota_licencas (codigo, empresa, contacto, notas, expira, max_dispositivos)\n    values (upper(trim(p_data->>'codigo')),\n            trim(p_data->>'empresa'),\n            nullif(trim(coalesce(p_data->>'contacto', '')), ''),\n            nullif(trim(coalesce(p_data->>'notas', '')), ''),\n            (p_data->>'expira')::date,\n            coalesce((p_data->>'max_dispositivos')::int, 3))\n    returning id into new_id;\n  exception\n    when unique_violation then return jsonb_build_object('ok', false, 'error', 'dup');\n    when others then return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true, 'data', new_id);\nend;\n$$;\n\ncreate or replace function public.frota_dev_update(p_pass text, p_id uuid, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    update public.frota_licencas set\n      empresa          = case when p_data ? 'empresa'          then trim(p_data->>'empresa') else empresa end,\n      contacto         = case when p_data ? 'contacto'         then nullif(trim(coalesce(p_data->>'contacto', '')), '') else contacto end,\n      notas            = case when p_data ? 'notas'            then nullif(trim(coalesce(p_data->>'notas', '')), '') else notas end,\n      expira           = case when p_data ? 'expira'           then (p_data->>'expira')::date else expira end,\n      max_dispositivos = case when p_data ? 'max_dispositivos' then (p_data->>'max_dispositivos')::int else max_dispositivos end,\n      estado           = case when p_data ? 'estado'           then p_data->>'estado' else estado end,\n      updated_at       = now()\n    where id = p_id;\n    if not found then return jsonb_build_object('ok', false, 'error', 'notfound'); end if;\n  exception when others then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_delete(p_pass text, p_id uuid)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  delete from public.frota_licencas where id = p_id;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_remove_device(p_pass text, p_id uuid, p_device text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  delete from public.frota_licenca_dispositivos where licenca_id = p_id and device_id = p_device;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_set_pass(p_pass text, p_new text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  if p_new is null or length(p_new) < 8 or p_new = 'COLOQUE_AQUI_A_SUA_SENHA' then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end if;\n  update public.frota_dev_config set pass_hash = crypt(p_new, gen_salt('bf')), falhas = 0, bloqueado_ate = null where id = 1;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\n-- ---------- permissões ----------\nrevoke all on function public.frota_dev_auth(text) from public, anon, authenticated;\nrevoke all on function public.frota_check_license(text, text, jsonb) from public;\nrevoke all on function public.frota_dev_verify(text) from public;\nrevoke all on function public.frota_dev_list(text) from public;\nrevoke all on function public.frota_dev_add(text, jsonb) from public;\nrevoke all on function public.frota_dev_update(text, uuid, jsonb) from public;\nrevoke all on function public.frota_dev_delete(text, uuid) from public;\nrevoke all on function public.frota_dev_remove_device(text, uuid, text) from public;\nrevoke all on function public.frota_dev_set_pass(text, text) from public;\n\ngrant execute on function public.frota_check_license(text, text, jsonb) to anon, authenticated;\ngrant execute on function public.frota_dev_verify(text) to anon, authenticated;\ngrant execute on function public.frota_dev_list(text) to anon, authenticated;\ngrant execute on function public.frota_dev_add(text, jsonb) to anon, authenticated;\ngrant execute on function public.frota_dev_update(text, uuid, jsonb) to anon, authenticated;\ngrant execute on function public.frota_dev_delete(text, uuid) to anon, authenticated;\ngrant execute on function public.frota_dev_remove_device(text, uuid, text) to anon, authenticated;\ngrant execute on function public.frota_dev_set_pass(text, text) to anon, authenticated;\n\n-- actualiza a cache da API para ver as funções novas\nnotify pgrst, 'reload schema';\n\n-- =====================================================================\n-- FROTA PRO · Planos por licença + Chat de suporte\n-- Cole tudo no Supabase > SQL Editor > New query > Run.\n-- Execute DEPOIS do SQL das licenças (já executado). Pode ser executado\n-- mais de uma vez sem problema. NÃO altera a palavra-passe master.\n--\n--  1) Cada licença passa a ter a lista de módulos incluídos\n--     (coluna \"funcoes\": NULL = todos os módulos = plano Completo).\n--  2) Chat de suporte: o cliente escreve no botão 💬 Suporte (separador\n--     Admin) e a mensagem chega ao Painel de Licenças, onde responde.\n--     As tabelas ficam fechadas; só as funções abaixo lhes acedem.\n-- =====================================================================\n\n-- ---------- 1) módulos por licença ----------\nalter table public.frota_licencas add column if not exists funcoes jsonb;\n\ncreate or replace function public.frota_check_license(p_code text, p_device text, p_info jsonb default '{}'::jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare\n  l    public.frota_licencas%rowtype;\n  code text := upper(trim(coalesce(p_code, '')));\n  hoje date := (now() at time zone 'Africa/Maputo')::date;\n  n    int;\n  v_info jsonb := '{}'::jsonb;\nbegin\n  if code = '' or length(code) > 40 or p_device is null or length(p_device) < 8 or length(p_device) > 80 then\n    return jsonb_build_object('ok', false, 'reason', 'not_found');\n  end if;\n  select * into l from public.frota_licencas where codigo = code;\n  if not found then return jsonb_build_object('ok', false, 'reason', 'not_found'); end if;\n  if l.estado = 'bloqueada' then return jsonb_build_object('ok', false, 'reason', 'blocked'); end if;\n  if l.expira < hoje then\n    return jsonb_build_object('ok', false, 'reason', 'expired', 'exp', l.expira);\n  end if;\n\n  if p_info is not null and jsonb_typeof(p_info) = 'object' and length(p_info::text) < 600 then\n    v_info := p_info;\n  end if;\n\n  if exists (select 1 from public.frota_licenca_dispositivos where licenca_id = l.id and device_id = p_device) then\n    update public.frota_licenca_dispositivos\n       set last_seen = now(), info = case when v_info = '{}'::jsonb then public.frota_licenca_dispositivos.info else v_info end\n     where licenca_id = l.id and device_id = p_device;\n  else\n    select count(*) into n from public.frota_licenca_dispositivos where licenca_id = l.id;\n    if n >= l.max_dispositivos then\n      return jsonb_build_object('ok', false, 'reason', 'device');\n    end if;\n    insert into public.frota_licenca_dispositivos (licenca_id, device_id, info) values (l.id, p_device, v_info);\n  end if;\n\n  return jsonb_build_object('ok', true, 'empresa', l.empresa, 'exp', l.expira,\n                            'dias', l.expira - hoje, 'max', l.max_dispositivos,\n                            'features', l.funcoes);\nend;\n$$;\n\ncreate or replace function public.frota_dev_list(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  select coalesce(jsonb_agg(to_jsonb(x) order by x.created_at desc), '[]'::jsonb) into r\n  from (\n    select l.id, l.codigo, l.empresa, l.contacto, l.notas, l.expira, l.max_dispositivos, l.estado, l.created_at, l.funcoes,\n           (select count(*) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as n_disp,\n           (select max(d.last_seen) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as ultimo_acesso,\n           coalesce((select jsonb_agg(jsonb_build_object('device_id', d.device_id, 'info', d.info,\n                                                         'first_seen', d.first_seen, 'last_seen', d.last_seen)\n                                      order by d.last_seen desc)\n                       from public.frota_licenca_dispositivos d where d.licenca_id = l.id), '[]'::jsonb) as dispositivos\n      from public.frota_licencas l\n  ) x;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_add(p_pass text, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); new_id uuid;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    insert into public.frota_licencas (codigo, empresa, contacto, notas, expira, max_dispositivos, funcoes)\n    values (upper(trim(p_data->>'codigo')),\n            trim(p_data->>'empresa'),\n            nullif(trim(coalesce(p_data->>'contacto', '')), ''),\n            nullif(trim(coalesce(p_data->>'notas', '')), ''),\n            (p_data->>'expira')::date,\n            coalesce((p_data->>'max_dispositivos')::int, 3),\n            case when jsonb_typeof(p_data->'funcoes') = 'array' then p_data->'funcoes' else null end)\n    returning id into new_id;\n  exception\n    when unique_violation then return jsonb_build_object('ok', false, 'error', 'dup');\n    when others then return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true, 'data', new_id);\nend;\n$$;\n\ncreate or replace function public.frota_dev_update(p_pass text, p_id uuid, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    update public.frota_licencas set\n      empresa          = case when p_data ? 'empresa'          then trim(p_data->>'empresa') else empresa end,\n      contacto         = case when p_data ? 'contacto'         then nullif(trim(coalesce(p_data->>'contacto', '')), '') else contacto end,\n      notas            = case when p_data ? 'notas'            then nullif(trim(coalesce(p_data->>'notas', '')), '') else notas end,\n      expira           = case when p_data ? 'expira'           then (p_data->>'expira')::date else expira end,\n      max_dispositivos = case when p_data ? 'max_dispositivos' then (p_data->>'max_dispositivos')::int else max_dispositivos end,\n      estado           = case when p_data ? 'estado'           then p_data->>'estado' else estado end,\n      funcoes          = case when p_data ? 'funcoes'\n                              then (case when jsonb_typeof(p_data->'funcoes') = 'array' then p_data->'funcoes' else null end)\n                              else funcoes end,\n      updated_at       = now()\n    where id = p_id;\n    if not found then return jsonb_build_object('ok', false, 'error', 'notfound'); end if;\n  exception when others then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\n-- ---------- 2) chat de suporte ----------\ncreate table if not exists public.frota_sup_msgs (\n  id      bigserial primary key,\n  cid     text not null,                                   -- id da conversa (gerado no aparelho do cliente)\n  de      text not null check (de in ('user', 'admin')),\n  nome    text,\n  empresa text,\n  licenca text,\n  texto   text not null,\n  lido    boolean not null default false,                  -- mensagem do cliente já lida pelo admin\n  ts      timestamptz not null default now()\n);\ncreate index if not exists frota_sup_msgs_cid_idx on public.frota_sup_msgs (cid, id);\ncreate index if not exists frota_sup_msgs_ts_idx  on public.frota_sup_msgs (ts);\n\nalter table public.frota_sup_msgs enable row level security;\nrevoke all on table public.frota_sup_msgs from anon, authenticated;\nrevoke all on sequence public.frota_sup_msgs_id_seq from anon, authenticated;\n\n-- cliente -> admin (limite: 500 caracteres, 10 mensagens/minuto por conversa)\ncreate or replace function public.frota_sup_send(p_cid text, p_nome text, p_empresa text, p_licenca text, p_texto text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare t text := left(trim(coalesce(p_texto, '')), 500); new_id bigint;\nbegin\n  if p_cid is null or length(p_cid) < 12 or length(p_cid) > 80 or t = '' then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end if;\n  if (select count(*) from public.frota_sup_msgs where cid = p_cid and de = 'user' and ts > now() - interval '1 minute') >= 10\n     or (select count(*) from public.frota_sup_msgs where de = 'user' and ts > now() - interval '1 minute') >= 150 then\n    return jsonb_build_object('ok', false, 'error', 'rate');\n  end if;\n  if random() < 0.02 then\n    delete from public.frota_sup_msgs where ts < now() - interval '120 days';   -- limpeza automática\n  end if;\n  insert into public.frota_sup_msgs (cid, de, nome, empresa, licenca, texto)\n  values (p_cid, 'user', left(trim(coalesce(p_nome, '')), 80), left(trim(coalesce(p_empresa, '')), 120),\n          left(trim(coalesce(p_licenca, '')), 60), t)\n  returning id into new_id;\n  return jsonb_build_object('ok', true, 'id', new_id);\nend;\n$$;\n\n-- admin -> cliente: o aparelho pergunta pelas respostas da sua conversa\ncreate or replace function public.frota_sup_poll(p_cid text, p_after bigint default 0)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\nbegin\n  if p_cid is null or length(p_cid) < 12 or length(p_cid) > 80 then return '[]'::jsonb; end if;\n  return coalesce((select jsonb_agg(jsonb_build_object('id', m.id, 'text', m.texto,\n                                                       'ts', (extract(epoch from m.ts) * 1000)::bigint) order by m.id)\n                     from public.frota_sup_msgs m\n                    where m.cid = p_cid and m.de = 'admin' and m.id > coalesce(p_after, 0)), '[]'::jsonb);\nend;\n$$;\n\n-- nº de mensagens de clientes por ler (só devolve um número; usado para avisar o admin)\ncreate or replace function public.frota_sup_unread()\nreturns int\nlanguage sql security definer\nset search_path = public, extensions\nas $$\n  select count(*)::int from public.frota_sup_msgs where de = 'user' and not lido;\n$$;\n\n-- ---------- painel do programador: conversas ----------\ncreate or replace function public.frota_dev_sup_threads(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  select coalesce(jsonb_agg(to_jsonb(x) order by x.last_id desc), '[]'::jsonb) into r\n  from (\n    select m.cid,\n           max(m.id) as last_id,\n           (array_agg(m.nome    order by m.id desc) filter (where m.de = 'user' and coalesce(m.nome, '')    <> ''))[1] as nome,\n           (array_agg(m.empresa order by m.id desc) filter (where m.de = 'user' and coalesce(m.empresa, '') <> ''))[1] as empresa,\n           (array_agg(m.licenca order by m.id desc) filter (where m.de = 'user' and coalesce(m.licenca, '') <> ''))[1] as licenca,\n           (array_agg(m.texto   order by m.id desc))[1] as last_text,\n           (array_agg(m.de      order by m.id desc))[1] as last_from,\n           (extract(epoch from max(m.ts)) * 1000)::bigint as ts,\n           (count(*) filter (where m.de = 'user' and not m.lido))::int as unread\n      from public.frota_sup_msgs m\n     group by m.cid\n     order by max(m.id) desc\n     limit 100\n  ) x;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_sup_messages(p_pass text, p_cid text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  update public.frota_sup_msgs set lido = true where cid = p_cid and de = 'user' and not lido;\n  select coalesce(jsonb_agg(jsonb_build_object('id', m.id, 'de', m.de, 'text', m.texto,\n                                               'ts', (extract(epoch from m.ts) * 1000)::bigint) order by m.id), '[]'::jsonb) into r\n    from (select * from public.frota_sup_msgs where cid = p_cid order by id desc limit 300) m;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_sup_reply(p_pass text, p_cid text, p_texto text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); t text := left(trim(coalesce(p_texto, '')), 500); u record;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  if t = '' or p_cid is null then return jsonb_build_object('ok', false, 'error', 'invalid'); end if;\n  select nome, empresa, licenca into u from public.frota_sup_msgs where cid = p_cid and de = 'user' order by id desc limit 1;\n  if not found then return jsonb_build_object('ok', false, 'error', 'notfound'); end if;\n  insert into public.frota_sup_msgs (cid, de, nome, empresa, licenca, texto, lido)\n  values (p_cid, 'admin', u.nome, u.empresa, u.licenca, t, true);\n  update public.frota_sup_msgs set lido = true where cid = p_cid and de = 'user' and not lido;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_sup_delete(p_pass text, p_cid text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  delete from public.frota_sup_msgs where cid = p_cid;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\n-- ---------- permissões ----------\nrevoke all on function public.frota_sup_send(text, text, text, text, text)  from public;\nrevoke all on function public.frota_sup_poll(text, bigint)                  from public;\nrevoke all on function public.frota_sup_unread()                            from public;\nrevoke all on function public.frota_dev_sup_threads(text)                   from public;\nrevoke all on function public.frota_dev_sup_messages(text, text)            from public;\nrevoke all on function public.frota_dev_sup_reply(text, text, text)         from public;\nrevoke all on function public.frota_dev_sup_delete(text, text)              from public;\n\ngrant execute on function public.frota_sup_send(text, text, text, text, text)  to anon, authenticated;\ngrant execute on function public.frota_sup_poll(text, bigint)                  to anon, authenticated;\ngrant execute on function public.frota_sup_unread()                            to anon, authenticated;\ngrant execute on function public.frota_dev_sup_threads(text)                   to anon, authenticated;\ngrant execute on function public.frota_dev_sup_messages(text, text)            to anon, authenticated;\ngrant execute on function public.frota_dev_sup_reply(text, text, text)         to anon, authenticated;\ngrant execute on function public.frota_dev_sup_delete(text, text)              to anon, authenticated;\n\n-- actualiza a cache da API para ver as funções novas\nnotify pgrst, 'reload schema';\n";

function g(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function store(){try{return JSON.parse(ls(SKEY))||{}}catch(e){return {}}}
function hoje(){return today()}
function devId(){var d=ls(DKEY);if(!d||d.length<8){d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);ls(DKEY,d)}return d}
function devInfo(){var u=navigator.userAgent||'',o={},m=u.match(/Android [\d.]+; ([^;)]+?)(?: Build[^;)]*)?[;)]/);
 o.sistema=/Android/.test(u)?'Android '+((u.match(/Android ([\d.]+)/)||[])[1]||''):/iPhone|iPad/.test(u)?'iOS':/Windows/.test(u)?'Windows':/Mac OS X/.test(u)?'macOS':/Linux/.test(u)?'Linux':'';
 o.modelo=m?m[1].trim():/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':'';
 o.navegador=/Edg\//.test(u)?'Edge':/OPR\/|Opera/.test(u)?'Opera':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'';
 o.ecra=screen.width+'x'+screen.height;return o}
function fmtDT(v){if(!v)return '—';try{return new Date(v).toLocaleString(window.LANG=='en'?'en-GB':'pt-PT',{dateStyle:'short',timeStyle:'short'})}catch(e){return String(v)}}

/* ---------- chamada RPC ---------- */
function rpc(fn,args){var c=new AbortController(),t=setTimeout(function(){c.abort()},12000);
 return fetch(URL0+'/rest/v1/rpc/'+fn,{method:'POST',signal:c.signal,headers:{apikey:KEY0,Authorization:'Bearer '+KEY0,'Content-Type':'application/json'},body:JSON.stringify(args||{})})
 .then(function(r){clearTimeout(t);return r.text().then(function(x){var j=null;try{j=JSON.parse(x)}catch(e){}
   if(!r.ok){var er=new Error((j&&(j.message||j.hint))||x.slice(0,160)||('HTTP '+r.status));er.code=(j&&j.code)||('HTTP'+r.status);er.status=r.status;throw er}
   return j})},function(e){clearTimeout(t);e.net=true;throw e})}

/* ---------- licença do cliente ---------- */
var MSG={
 not_found:['Código de licença inválido.','Invalid license code.'],
 blocked:['Licença bloqueada. Contacte o suporte.','License blocked. Contact support.'],
 expired:['Licença expirada. Renove para continuar.','License expired. Renew to continue.'],
 device:['Limite de aparelhos desta licença atingido. Contacte o suporte para adicionar mais.','Device limit for this license reached. Contact support to add more.'],
 network:['Sem ligação à internet e sem validação recente da licença.','No internet connection and no recent license validation.'],
 setup:['O sistema de licenças ainda não está instalado no servidor (falta executar o ficheiro frota_licencas.sql no Supabase).','The license system is not installed on the server yet (run frota_licencas.sql in Supabase).']
};
var msgOf=function(k){var m=MSG[k]||MSG.not_found;return L(m[0],m[1])};
function check(code){return rpc('frota_check_license',{p_code:code,p_device:devId(),p_info:devInfo()}).then(function(d){return d||{ok:false,reason:'not_found'}})
 .catch(function(e){return {ok:false,reason:(e&&(e.code=='PGRST202'||e.status==404))?'setup':'network'}})}

function overlay(id,z){var o=g(id);if(!o){o=document.createElement('div');o.id=id;o.className='mo';if(z)o.style.zIndex=z;document.body.appendChild(o)}return o}
function gate(msg,busy){
 var o=overlay('licgate'),lg=(typeof LOGOFULL!=='undefined')?LOGOFULL:'';
 o.innerHTML='<div class="md" style="max-width:440px"><div class="mh"><span>🔑 '+L('Ativar licença','Activate license')+'</span></div>'+
 '<div class="mb" style="grid-template-columns:1fr"><div style="text-align:center">'+(lg?'<img class="lg-logo" src="'+lg+'" alt="FrotaPro">':'<div style="font-weight:800;font-size:1.2rem">FrotaPro</div>')+'</div>'+
 '<div><label>'+L('Código de licença','License code')+'</label><input class="fc" id="lgc" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="FROTA-XXXX-XXXX-XXXX" style="text-transform:uppercase;text-align:center;letter-spacing:1px"'+(busy?' disabled':'')+'></div>'+
 '<div id="lgm" style="font-size:.85rem;min-height:1.2em;text-align:center;'+(busy?'color:var(--muted)':'color:#ff8a8a;font-weight:600')+'">'+esc(busy||msg||'')+'</div>'+
 '<button class="btn btn-p" id="lgb" style="justify-content:center"'+(busy?' disabled':'')+'>'+L('Ativar licença','Activate license')+'</button>'+
 '<div style="font-size:.78rem;color:var(--muted);text-align:center">'+L('Cada licença tem um limite de aparelhos e uma data de validade.','Each license has a device limit and an expiry date.')+'</div>'+
 '<button type="button" class="btn btn-s" id="lgchat" style="justify-content:center;margin-top:.6rem">💬 '+L('Falar com o Admin (chat)','Chat with the Admin')+'</button>'+
 (window.FP_TRIAL?FP_TRIAL.gateHtml():'')+'<a class="lsup" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent(L('Olá! Quero adquirir/renovar a licença do FrotaPro.','Hello! I would like to buy/renew a FrotaPro license.'))+'">💬 '+L('Ainda não tem licença? Fale connosco no WhatsApp','No license yet? Chat with us on WhatsApp')+'</a>'+(typeof DEVLOGO!=='undefined'?'<div class="devby"><img src="'+DEVLOGO+'" alt="BBS Internet Cafe"><span>'+L('Desenvolvido por','Developed by')+'<b>BBS Internet Cafe</b></span></div>':'')+'</div></div>';
 o.classList.add('on');document.body.classList.add('gate-on');fitGate();
 var i=g('lgc'),b=g('lgb');
 i.onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();activate()}};
 b.onclick=activate;
 if(window.FP_TRIAL)FP_TRIAL.bind();var ch=g('lgchat');if(ch)ch.onclick=function(){if(window.supOpen)window.supOpen('admin',L('Olá! Quero adquirir uma licença do FrotaPro.','Hello! I would like to buy a FrotaPro license.'))};
 if(!busy)setTimeout(function(){try{i.focus()}catch(e){}},60)}
function hideGate(){var o=g('licgate');if(o)o.classList.remove('on');document.body.classList.remove('gate-on')}
function activate(){var code=String((g('lgc')||{}).value||'').trim().toUpperCase().replace(/\s+/g,'');
 if(!code){var m=g('lgm');if(m)m.textContent=L('Introduza o código de licença.','Enter the license code.');return}
 gate('',L('A validar…','Validating…'));
 check(code).then(function(r){apply(code,r)})}
function apply(code,r){
 if(r.ok){saveLic(code,r);hideGate();pill();return true}
 if(r.reason=='network'){var st=store();
  if(st.code==code&&st.checked&&Date.now()-st.checked<CACHE_DIAS*864e5&&!(st.exp&&st.exp<hoje())){hideGate();pill();return true}
  gate(msgOf('network'));return false}

  ni.onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();supReply()}};g('ds-send').onclick=supReply;g('ds-del').onclick=supDel;
  var lb=g('ds-lic');if(lb)lb.onclick=function(){FILT.q=t.licenca;FILT.s='all';var q=g('dv_q');if(q)q.value=t.licenca;var sl=g('dv_s');if(sl)sl.value='all';devRender();var tw=g('dvtab');if(tw)tw.scrollIntoView({behavior:'smooth',block:'start'})};

 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

<script id="cambio-auto">
/* Câmbio automático: atualiza D.co.usd e D.co.zar (moeda da empresa por 1 USD / 1 ZAR) a cada 24h.
   Fontes gratuitas, sem chave: open.er-api.com → jsDelivr (fawazahmed0) → currency-api.pages.dev */
(function(){
var DAY=24*3600*1000,CHECK=30*60*1000,busy=false;
var L=function(p,e){return window.LANG=='en'?e:p};
var SRC=[
 {n:'open.er-api.com',u:'https://open.er-api.com/v6/latest/USD',f:function(j){if(!j||j.result!=='success'||!j.rates)throw 0;return j.rates}},
 {n:'fawazahmed0/currency-api (jsDelivr)',u:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',f:function(j){return up(j&&j.usd)}},
 {n:'currency-api.pages.dev',u:'https://latest.currency-api.pages.dev/v1/currencies/usd.json',f:function(j){return up(j&&j.usd)}}
];
function up(o){if(!o)throw 0;var r={USD:1};Object.keys(o).forEach(function(k){r[k.toUpperCase()]=+o[k]});return r}
function co(){try{return(typeof D!=='undefined'&&D&&D.co)?D.co:null}catch(e){return null}}
function base(){var c=co();return(c&&c.moeda)||'MZN'}
function round(n){return Math.round(n*10000)/10000}
function pick(rates){var b=base(),rb=+rates[b],ru=+rates.USD||1,rz=+rates.ZAR;
 if(!(rb>0))throw new Error('moeda '+b+' indisponível');
 var out={};
 out.usd=b=='USD'?1:round(rb/ru);
 if(rz>0)out.zar=b=='ZAR'?1:round(rb/rz);
 if(!(out.usd>0)||(out.zar!==undefined&&!(out.zar>0)))throw new Error('taxa inválida');
 return out}
function get(i){
 if(i>=SRC.length)return Promise.reject(new Error('sem ligação às fontes de câmbio'));
 var s=SRC[i],ctl=window.AbortController?new AbortController():null,t=ctl&&setTimeout(function(){ctl.abort()},12000);
 return fetch(s.u,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(j){clearTimeout(t);var v=pick(s.f(j));v.src=s.n;return v})
  .catch(function(){clearTimeout(t);return get(i+1)})}
function enabled(){var c=co();return !!c&&c.cambioAuto!=='nao'}
function stale(){var c=co();return !c||!(+c.cambioTs>0)||Date.now()-c.cambioTs>=DAY||c.cambioMoeda!==base()}
function fdt(ts){try{return new Date(ts).toLocaleString(window.LANG=='en'?'en-GB':'pt-PT',{dateStyle:'short',timeStyle:'short'})}catch(e){return''}}
function status(msg){var e=document.getElementById('fx-status');if(!e)return;
 var c=co();if(!c)return;var b=base(),h='';
 if(msg)h+='<b>'+msg+'</b><br>';
 if(+c.cambioTs>0){h+=L('Última atualização: ','Last update: ')+fdt(c.cambioTs)+' · '+(c.cambioSrc||'')+'<br>';
  h+='1 USD = '+(+c.usd||'—')+' '+b+(+c.zar?' · 1 ZAR = '+c.zar+' '+b:'');
  if(enabled())h+='<br>'+L('Próxima atualização automática: ','Next automatic update: ')+fdt(+c.cambioTs+DAY)}
 else h+=L('Ainda não foi atualizado automaticamente.','Not updated automatically yet.');
 e.innerHTML=h}
function fillInputs(){var c=co();if(!c)return;[['usd','c_usd'],['zar','c_zar']].forEach(function(x){var i=document.getElementById(x[1]);if(i&&document.activeElement!==i&&c[x[0]]!==undefined&&c[x[0]]!=='')i.value=c[x[0]]})}
function run(force){
 var c=co();if(!c||busy)return Promise.resolve(false);
 if(!force&&(!enabled()||!stale()))return Promise.resolve(false);
 if(navigator.onLine===false){status(L('Sem internet — tentarei mais tarde.','Offline — will retry later.'));return Promise.resolve(false)}
 busy=true;status(L('A atualizar câmbio…','Updating exchange rates…'));
 return get(0).then(function(v){
  c=co();if(!c)return false;
  c.usd=v.usd;if(v.zar!==undefined)c.zar=v.zar;
  c.cambioTs=Date.now();c.cambioSrc=v.src;c.cambioMoeda=base();
  try{save()}catch(e){}
  fillInputs();status(L('✅ Câmbio atualizado.','✅ Exchange rates updated.'));return true})
 .catch(function(e){status(L('⚠️ Não foi possível atualizar agora: ','⚠️ Could not update now: ')+(e&&e.message||'erro'));return false})
 .then(function(r){busy=false;return r})}
window.FXRUN=function(force){return run(!!force)};
window.FXUI=function(){return '<div style="grid-column:1/-1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);padding:.7rem .9rem;font-size:.82rem;color:var(--muted);display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap">'+
  '<span id="fx-status">'+L('A carregar…','Loading…')+'</span>'+
  '<button class="btn btn-s sm" type="button" onclick="FXRUN(true)">🔄 '+L('Atualizar agora','Update now')+'</button></div>'};
/* mostra o estado sempre que a página Empresa é desenhada */
new MutationObserver(function(){if(document.getElementById('fx-status')&&!document.getElementById('fx-status').dataset.on){document.getElementById('fx-status').dataset.on=1;status()}}).observe(document.body,{childList:true,subtree:true});
function tick(){run(false)}
setTimeout(tick,4000);setInterval(tick,CHECK);
window.addEventListener('online',tick);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
})();
</script>

<script id="pedidos-online">
/* ===== PEDIDOS ONLINE (orçamentos e serviços) — equivalente ao "Pedidos online" do BBS POS =====
   Cliente: abre ?p=TOKEN (link público aleatório, sem código da empresa) -> pede orçamento/serviço, acompanha e conversa.
   Gestor: aba "Pedidos online" -> recebe com alerta, conversa, aceita (cria cliente + cotação) ou recusa. SQL: frota_pedidos_online.sql */
(function(){

var U0='https://znhkbqxhpugfgygtjmyb.supabase.co',K0='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuaGticXhocHVnZmd5Z3RqbXliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjYwNDQsImV4cCI6MjEwNzY0MjA0NH0.kXr2-UksePMcRW2aR61o4W0EvDF1r_VN4jWaKlXGWfc',SQL="-- =====================================================================\n-- FROTA · Pedidos online (orçamentos e serviços)\n-- Cole tudo no Supabase > SQL Editor > New query > Run. Pode repetir.\n--\n-- Segurança (mesmo modelo do frota_get/frota_put):\n--  * Tabelas FECHADAS: o acesso directo pela chave pública (anon) é bloqueado.\n--  * Clientes usam um TOKEN público aleatório (link ?p=TOKEN), que só dá acesso\n--    ao catálogo publicado e aos seus próprios pedidos. Nunca expõe o código\n--    da empresa nem os dados da frota.\n--  * A empresa usa o CÓDIGO DA EMPRESA (o mesmo da sincronização) para tratar pedidos.\n-- =====================================================================\n\ncreate table if not exists public.frota_pub (\n  code text primary key,\n  token text not null unique,\n  catalogo jsonb not null default '{}'::jsonb,\n  updated_at timestamptz not null default now()\n);\ncreate table if not exists public.frota_pedidos (\n  id text primary key default gen_random_uuid()::text,\n  code text not null,\n  tipo text not null default 'orcamento',\n  nome text not null,\n  contacto text, nuit text, email text,\n  dados jsonb not null default '{}'::jsonb,\n  itens jsonb not null default '[]'::jsonb,\n  estado text not null default 'novo',\n  tratado_por text,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists frota_pedidos_code_idx on public.frota_pedidos (code, created_at desc);\ncreate table if not exists public.frota_pedidos_msgs (\n  id bigserial primary key,\n  pedido_id text not null references public.frota_pedidos(id) on delete cascade,\n  autor text not null,\n  autor_nome text,\n  texto text not null,\n  created_at timestamptz not null default now()\ earch_path = public as $$\ndeclare n int;\nbegin\n  perform public.frota_ck(p_code);\n  if p_estado not in ('aceite', 'recusado') then raise exception 'estado invalido'; end if;\n  update public.frota_pedidos set estado = p_estado, tratado_por = left(p_por, 60)\n   where id = p_id and code = p_code and estado = 'novo';\n  get diagnostics n = row_count;\n  return json_build_object('ok', n > 0);\nend $$;\n\ncreate or replace function public.frota_ped_msgs(p_code text, p_ids text[])\nreturns json language plpgsql security definer set search_path = public as $$\nbegin\n  perform public.frota_ck(p_code);\n  return (select coalesce(json_agg(t), '[]'::json) from (\n    select m.pedido_id, m.autor, m.autor_nome, m.texto, m.created_at\n      from public.frota_pedidos_msgs m join public.frota_pedidos p on p.id = m.pedido_id\n     where p.code = p_code and m.pedido_id = any(p_ids) order by m.created_at limit 1000) t);\nend $$;\n\ncreate or replace function public.frota_ped_responder(p_code text, p_id text, p_texto text, p_nome text)\nreturns json language plpgsql security definer set search_path = public as $$\nbegin\n  perform public.frota_ck(p_code);\n  if coalesce(trim(p_texto), '') = '' then return json_build_object('ok', false); end if;\n  insert into public.frota_pedidos_msgs(pedido_id, autor, autor_nome, texto)\n  select id, 'empresa', left(p_nome, 60), left(p_texto, 500) from public.frota_pedidos where id = p_id and code = p_code;\n  return json_build_object('ok', found);\nend $$;\n\ncreate or replace function public.frota_ped_apagar(p_code text, p_ids text[])\nreturns json language plpgsql security definer set search_path = public as $$\nbegin\n  perform public.frota_ck(p_code);\n  delete from public.frota_pedidos where code = p_code and id = any(p_ids);\n  return json_build_object('ok', true);\nend $$;\n\n-- ===================== CLIENTE (usa só o token público) =====================\ncreate or replace function public.frota_pub_get(p_token text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare c jsonb;\nbegin\n  select catalogo into c from public.frota_pub where token = p_token;\n  if c is null then return json_build_object('ok', false); end if;\n  return json_build_object('ok', true, 'catalogo', c);\nend $$;\n\ncreate or replace function public.frota_pub_enviar(p_token text, p_nome text, p_contacto text, p_nuit text,\n  p_email text, p_tipo text, p_dados jsonb, p_itens jsonb)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare v_code text; v_id text;\nbegin\n  select code into v_code from public.frota_pub where token = p_token;\n  if v_code is null then return json_build_object('ok', false, 'erro', 'link'); end if;\n  if length(trim(coalesce(p_nome, ''))) < 2 or length(regexp_replace(coalesce(p_contacto, ''), '\\D', '', 'g')) < 9\n     or p_tipo not in ('orcamento', 'servico') then\n    return json_build_object('ok', false, 'erro', 'dados');\n  end if;\n  if octet_length(p_dados::text) > 4000 or octet_length(p_itens::text) > 8000 then\n    return json_build_object('ok', false, 'erro', 'tamanho');\n  end if;\n  if (select count(*) from public.frota_pedidos where code = v_code and contacto = p_contacto\n        and created_at > now() - interval '10 minutes') >= 5\n     or (select count(*) from public.frota_pedidos where code = v_code\n        and created_at > now() - interval '10 minutes') >= 60 then\n    return json_build_object('ok', false, 'erro', 'limite');\n  end if;\n  insert into public.frota_pedidos(code, tipo, nome, contacto, nuit, email, dados, itens)\n  values (v_code, p_tipo, left(trim(p_nome), 80), left(p_contacto, 30), left(coalesce(p_nuit, ''), 20),\n          left(coalesce(p_email, ''), 80), p_dados, p_itens)\n  returning id into v_id;\n  return json_build_object('ok', true, 'id', v_id);\nend $$;\n\ncreate or replace function public.frota_pub_estado(p_token text, p_ids text[])\nreturns json language plpgsql security definer set search_path = public as $$\nbegin\n  return (select coalesce(json_agg(json_build_object('id', p.id, 'estado', p.estado)), '[]'::json)\n    from public.frota_pedidos p join public.frota_pub b on b.code = p.code\n   where b.token = p_token and p.id = any(p_ids));\nend $$;\n\ncreate or replace function public.frota_pub_msgs(p_token text, p_ids text[])\nreturns json language plpgsql security definer set search_path = public as $$\nbegin\n  return (select coalesce(json_agg(t), '[]'::json) from (\n    select m.pedido_id, m.autor, m.autor_nome, m.texto, m.created_at\n      from public.frota_pedidos_msgs m\n      join public.frota_pedidos p on p.id = m.pedido_id\n      join public.frota_pub b on b.code = p.code\n     where b.token = p_token and m.pedido_id = any(p_ids) order by m.created_at limit 1000) t);\nend $$;\n\ncreate or replace function public.frota_pub_msg(p_token text, p_id text, p_texto text, p_nome text)\nreturns json language plpgsql security definer set search_path = public as $$\nbegin\n  if coalesce(trim(p_texto), '') = '' then return json_build_object('ok', false); end if;\n  insert into public.frota_pedidos_msgs(pedido_id, autor, autor_nome, texto)\n  select p.id, 'cliente', left(p_nome, 60), left(p_texto, 500)\n    from public.frota_pedidos p join public.frota_pub b on b.code = p.code\n   where p.id = p_id and b.token = p_token;\n  return json_build_object('ok', found);\nend $$;\n\nnotify pgrst, 'reload schema';\n",TOK=new URLSearchParams(location.search).get('p');

<script id="gps-tracking">
/* ===== Rastreio GPS de motoristas e camiões =====
   Motorista: assim que tem uma viagem Planeada / Em curso, o telemóvel envia a posição.
   Administrador e Gestor: separador Operações > Rastreio GPS (mapa com cada camião).
   Posições guardadas à parte (frota_gps), nunca dentro dos dados principais (D). */
(function(){
'use strict';
var T=function(p,e){return window.LANG=='en'?e:p};
var Q_K='frota_gps_q',LOC_K='frota_gps_local';
var ACTIVE=['Planeada','Em curso'];   /* estados em que o motorista é rastreado */
var ONLINE=120000;                    /* até 2 min sem sinal = online */
var SEND=10000;                       /* intervalo entre envios (ms) */
var STALE_DAYS=45;                    /* viagem "Planeada" esquecida há mais de 45 dias não rastreia */
var SQLTXT="-- =====================================================================\n-- FROTA PRO · Rastreio GPS de motoristas / camiões\n-- Cole tudo no Supabase > SQL Editor > New query > Run.\n-- Pode ser executado mais de uma vez sem problema.\n--\n-- Mesmo modelo de segurança da sincronização:\n--  * As tabelas ficam FECHADAS (sem acesso directo pela chave anon).\n--  * O app só fala com funções que exigem o \"código da empresa\".\n--  * frota_gps: última posição de cada motorista.\n--  * frota_gps_trail: histórico de pontos (percurso). Apaga-se sozinho\n--    ao fim de 30 dias.\n-- =====================================================================\n\ncreate table if not exists public.frota_gps (\n  code       text not null,\n  motorista  text not null,\n  viagem     text,\n  veiculo    text,\n  matricula  text,\n  nome       text,\n  lat        double precision not null,\n  lon        double precision not null,\n  vel        real,\n  rumo       real,\n  prec       real,\n  bat        real,\n  ativo      boolean not null default true,\n  updated_at timestamptz not null default now(),\n  primary key (code, motorista)\n);\n\ncreate table if not exists public.frota_gps_trail (\n  id        bigserial primary key,\n  code      text not null,\n  motorista text not null,\n  viagem    text,\n  lat       double precision not null,\n  lon       double precision not null,\n  vel       real,\n  t         timestamptz not null default now()\n);\ncreate index if not exists frota_gps_trail_i on public.frota_gps_trail (code, viagem, t);\n\nalter table public.frota_gps enable row level security;\nalter table public.frota_gps_trail enable row level security;\nrevoke all on table public.frota_gps from anon, authenticated;\nrevoke all on table public.frota_gps_trail from anon, authenticated;\nrevoke all on sequence public.frota_gps_trail_id_seq from anon, authenticated;\n\n-- gravar uma posição (telemóvel do motorista)\ncreate or replace function public.frota_gps_put(\n  p_code text, p_motorista text, p_viagem text, p_veiculo text, p_matricula text, p_nome text,\n  p_lat double precision, p_lon double precision,\n  p_vel real default null, p_rumo real default null, p_prec real default null, p_bat real default null,\n  p_ts timestamptz default null)\nreturns void\nlanguage plpgsql security definer\nset search_path = public\nas $$\ndeclare v_ts timestamptz;\nbegin\n  if p_code is null or p_code !~ '^[a-z0-9_-]{8,64}$' then\n    raise exception 'codigo invalido: use 8 a 64 caracteres (a-z, 0-9, _ e -)';\n  end if;\n  if p_motorista is null or length(p_motorista) > 64 then\n    raise exception 'motorista invalido';\n  end if;\n  if p_lat is null or p_lon is null or p_lat < -90 or p_lat > 90 or p_lon < -180 or p_lon > 180 then\n    raise exception 'coordenadas invalidas';\n  end if;\n\n  -- relógio do servidor para posições recentes; hora do aparelho só para pontos antigos (fila offline)\n  if p_ts is null or abs(extract(epoch from (now() - p_ts))) < 120 then\n    v_ts := now();\n  else\n    v_ts := least(p_ts, now());\n  end if;\n\n  insert into public.frota_gps as g\n    (code, motorista, viagem, veiculo, matricula, nome, lat, lon, vel, rumo, prec, bat, ativo, updated_at)\n  values\n    (p_code, p_motorista, p_viagem, p_veiculo, p_matricula, p_nome, p_lat, p_lon, p_vel, p_rumo, p_prec, p_bat, true, v_ts)\n  on conflict (code, motorista) do update\n    set viagem = excluded.viagem, veiculo = excluded.veiculo, matricula = excluded.matricula,\n        nome = excluded.nome, lat = excluded.lat, lon = excluded.lon, vel = excluded.vel,\n        rumo = excluded.rumo, prec = excluded.prec, bat = excluded.bat,\n        ativo = true, updated_at = excluded.updated_at\n    where g.updated_at <= excluded.updated_at;\n\n  insert into public.frota_gps_trail (code, motorista, viagem, lat, lon, vel, t)\n  values (p_code, p_motorista, p_viagem, p_lat, p_lon, p_vel, v_ts);\n\n  if random() < 0.01 then\n    delete from public.frota_gps_trail where t < now() - interval '30 days';\n  end if;\nend;\n$$;\n\n-- marcar o motorista como \"sem viagem\" (fim do rastreio)\ncreate or replace function public.frota_gps_stop(p_code text, p_motorista text)\nreturns void\nlanguage plpgsql security definer\nset search_path = public\nas $$\nbegin\n  if p_code is null or p_code !~ '^[a-z0-9_-]{8,64}$' then\n    raise exception 'codigo invalido: use 8 a 64 caracteres (a-z, 0-9, _ e -)';\n  end if;\n  update public.frota_gps set ativo = false where code = p_code and motorista = p_motorista;\nend;\n$$;\n\n-- ler as últimas posições (painel do administrador / gestor)\ncreate or replace function public.frota_gps_get(p_code text)\nreturns table (motorista text, viagem text, veiculo text, matricula text, nome text,\n               lat double precision, lon double precision, vel real, rumo real, prec real, bat real,\n               ativo boolean, updated_at timestamptz)\nlanguage plpgsql stable security definer\nset search_path = public\nas $$\n#variable_conflict use_column\nbegin\n  if p_code is null or p_code !~ '^[a-z0-9_-]{8,64}$' then\n    raise exception 'codigo invalido: use 8 a 64 caracteres (a-z, 0-9, _ e -)';\n  end if;\n  return query\n    select g.motorista, g.viagem, g.veiculo, g.matricula, g.nome, g.lat, g.lon, g.vel, g.rumo, g.prec, g.bat,\n           g.ativo, g.updated_at\n    from public.frota_gps g\n    where g.code = p_code and g.updated_at > now() - interval '3 days';\nend;\n$$;\n\n-- ler o percurso (pontos) de uma viagem\ncreate or replace function public.frota_gps_trail(p_code text, p_viagem text)\nreturns table (lat double precision, lon double precision, vel real, t timestamptz)\nlanguage plpgsql stable security definer\nset search_path = public\nas $$\n#variable_conflict use_column\nbegin\n  if p_code is null or p_code !~ '^[a-z0-9_-]{8,64}$' then\n    raise exception 'codigo invalido: use 8 a 64 caracteres (a-z, 0-9, _ e -)';\n  end if;\n  return query\n    select r.lat, r.lon, r.vel, r.t\n    from public.frota_gps_trail r\n    where r.code = p_code and r.viagem = p_viagem\n    order by r.t\n    limit 4000;\nend;\n$$;\n\nrevoke all on function public.frota_gps_put(text,text,text,text,text,text,double precision,double precision,real,real,real,real,timestamptz) from public;\nrevoke all on function public.frota_gps_stop(text,text) from public;\nrevoke all on function public.frota_gps_get(text) from public;\nrevoke all on function public.frota_gps_trail(text,text) from public;\ngrant execute on function public.frota_gps_put(text,text,text,text,text,text,double precision,double precision,real,real,real,real,timestamptz) to anon, authenticated;\ngrant execute on function public.frota_gps_stop(text,text) to anon, authenticated;\ngrant execute on function public.frota_gps_get(text) to anon, authenticated;\ngrant execute on function public.frota_gps_trail(text,text) to anon, authenticated;\n\nnotify pgrst, 'reload schema';\n";
var G={on:false,wid:null,trip:null,mid:null,nome:'',last:0,pos:null,err:'',denied:false,wl:null,q:[],busy:false,lastOk:0,
 rows:[],map:null,mk:{},sel:null,follow:false,tpts:[],tl:null,pl:null,dst:null,hm:null,timer:null,mt:0,view:null,pollErr:'',qs:'',f:''};
var BAT=null;try{if(navigator.getBattery)navigator.getBattery().then(function(b){BAT=b}).catch(function(){})}catch(e){}

function X(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){try{window.FROTA_TOAST&&window.FROTA_TOAST(m)}catch(e){}}
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function cfg(){try{var c=JSON.parse(localStorage.getItem('frota_sb')||'{}');return c&&c.url&&c.key&&c.code?c:null}catch(e){return null}}
function rpc(fn,body){var c=cfg();if(!c)return Promise.reject(new Error('local'));
 var ac=new AbortController(),t=setTimeout(function(){ac.abort()},15000);
 return fetch(c.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({p_code:c.code},body||{})),signal:ac.signal})
 .then(function(r){clearTimeout(t);if(!r.ok)return r.text().then(function(x){var e=new Error(x.slice(0,200));e.status=r.status;e.body=x;throw e});return r.status==204?null:r.json()},function(e){clearTimeout(t);throw e})}
function ago(ms){var s=Math.max(0,Math.round(ms/1000));if(s<60)return T('há '+s+' s',s+' s ago');var m=Math.round(s/60);if(m<60)return T('há '+m+' min',m+' min ago');var h=Math.round(m/60);if(h<24)return T('há '+h+' h',h+' h ago');var d=Math.round(h/24);return T('há '+d+' d',d+' d ago')}
function hav(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(s))}
function stale(t){if(t.estado!='Planeada'||!t.saida)return false;var d=Date.parse(t.saida);return !!d&&(Date.now()-d)/864e5>STALE_DAYS}

/* ---------- armazenamento local (quando não há Supabase: só neste aparelho) ---------- */
function locGet(){var s=jget(LOC_K,{});if(!s.p)s.p={};if(!s.t)s.t={};return s}
function locPut(p){var s=locGet();s.p[p.m]={motorista:p.m,viagem:p.v,veiculo:p.ve,matricula:p.mat,nome:p.nome,lat:p.lat,lon:p.lon,vel:p.vel,rumo:p.rumo,prec:p.prec,bat:p.bat,ativo:true,updated_at:new Date().toISOString()};
 var a=s.t[p.v]=s.t[p.v]||[];a.push([p.lat,p.lon,p.ts]);if(a.length>1500)a.splice(0,a.length-1500);jset(LOC_K,s)}
function locStop(m){var s=locGet();if(s.p[m])s.p[m].ativo=false;jset(LOC_K,s)}

/* ---------- consentimento · permissões · segundo plano nativo · fila ---------- */
var CV=1,OPT={enableHighAccuracy:true,maximumAge:5000,timeout:30000};
function nat(){try{var P=window.Capacitor&&window.Capacitor.Plugins;return(P&&P.BackgroundGeolocation)||null}catch(e){return null}}
function ckey(){return'frota_gps_consent_'+((typeof ME!=='undefined'&&ME&&ME.motorista)||'')}
function saveQ(){if(!jset(Q_K,G.q)){G.q=G.q.filter(function(x,i){return i%2==0||i==G.q.length-1});jset(Q_K,G.q)}}
function rewatch(){if(G.wid==null||!navigator.geolocation)return;try{navigator.geolocation.clearWatch(G.wid)}catch(e){}G.wid=navigator.geolocation.watchPosition(onPos,onErr,OPT)}
function listen(r){if(G.pl2)return;G.pl2=1;r.onchange=function(){if(r.state=='denied'){G.denied=true;stopWatch();G.err=T('Permissão de localização retirada.','Location permission was withdrawn.')}else if(G.denied){G.denied=false;G.err=''}bar();tick()}}
function permGate(go){
 if(nat()){go();return}
 G.starting=true;
 var fin=function(s){G.starting=false;if(s=='denied'){G.denied=true;G.err=T('Localização bloqueada para este site. Ative-a nas definições do navegador e toque em «Tentar de novo».','Location is blocked for this site. Enable it in the browser settings and tap “Try again”.');bar()}else go()};
 try{navigator.permissions.query({name:'geolocation'}).then(function(r){listen(r);fin(r.state)},function(){fin('')})}catch(e){fin('')}}
function closeAsk(){var o=document.getElementById('gpsconsent');if(o)o.remove();G.ask=false}
function answer(ok){jset(ckey(),{v:CV,ok:ok,ts:new Date().toISOString()});closeAsk();G.declined=!ok;bar();tick()}
function askConsent(){
 if(G.ask||document.getElementById('gpsconsent'))return;G.ask=true;
 var o=document.createElement('div');o.id='gpsconsent';
 o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(2,8,60,.82);display:flex;align-items:center;justify-content:center;padding:1rem;overflow-y:auto';
 o.innerHTML='<div style="background:#10228a;border:1px solid var(--border-hi);border-radius:22px;max-width:460px;width:100%;padding:1.3rem;box-shadow:var(--shadow)">'
 +'<div style="font-size:1.1rem;font-weight:800;margin-bottom:.7rem">📡 '+T('Rastreio GPS da viagem','Trip GPS tracking')+'</div>'
 +'<div style="font-size:.86rem;line-height:1.5;color:var(--muted)">'
 +'<p><b>'+T('O que é recolhido:','What is collected:')+'</b> '+T('posição, velocidade, direção e nível de bateria do telemóvel.','position, speed, heading and phone battery level.')+'</p>'
 +'<p style="margin-top:.4rem"><b>'+T('Quando:','When:')+'</b> '+T('só enquanto tiver uma viagem Planeada ou Em curso.','only while you have a Planned or In-progress trip.')+'</p>'
 +'<p style="margin-top:.4rem"><b>'+T('Quem vê:','Who sees it:')+'</b> '+T('a sua empresa (administração e gestão de frota).','your company (administration and fleet management).')+'</p>'
 +'<p style="margin-top:.4rem"><b>'+T('Conservação:','Retention:')+'</b> '+T('o percurso é apagado ao fim de 30 dias.','the route is deleted after 30 days.')+'</p>'
 +'<p style="margin-top:.4rem"><b>'+T('Controlo:','Control:')+'</b> '+T('pode desligar a qualquer momento no aviso no topo. A seguir, o navegador pedirá a permissão de localização.','you can turn it off at any time from the banner at the top. The browser will then ask for location permission.')+'</p>'
 +'<p style="margin-top:.4rem;font-size:.78rem">'+(nat()?T('Esta app rastreia também com o ecrã bloqueado.','This app also tracks with the screen locked.'):T('No navegador o rastreio pode pausar com o ecrã bloqueado ou a app em segundo plano; mantenha a app aberta.','In the browser, tracking may pause with the screen locked or the app in the background; keep the app open.'))+'</p></div>'
 +'<div style="display:flex;gap:.5rem;margin-top:1rem;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-s" id="gpsno">'+T('Agora não','Not now')+'</button><button class="btn btn-p" id="gpsyes">'+T('Aceitar e continuar','Accept and continue')+'</button></div></div>';
 document.body.appendChild(o);
 document.getElementById('gpsyes').onclick=function(){answer(true)};
 document.getElementById('gpsno').onclick=function(){answer(false)}}

/* ======================= LADO DO MOTORISTA ======================= */
function myTrip(){
 if(typeof ME==='undefined'||!ME||role(ME)!='Motorista'||!ME.motorista)return null;
 var ts=D.trips.filter(function(t){return t.motorista==ME.motorista&&ACTIVE.indexOf(t.estado)>=0&&!stale(t)});
 if(!ts.length)return null;
 ts.sort(function(a,b){return (a.estado=='Em curso'?0:1)-(b.estado=='Em curso'?0:1)||String(a.saida||'').localeCompare(String(b.saida||''))});
 return ts[0]}
function wake(){try{if('wakeLock' in navigator&&!G.wl)navigator.wakeLock.request('screen').then(function(l){G.wl=l;l.addEventListener('release',function(){G.wl=null})}).catch(function(){})}catch(e){}}
function relWake(){try{if(G.wl)G.wl.release()}catch(e){}G.wl=null}
function start(t){
 if(G.ask||G.starting)return;
 var c=jget(ckey(),null);
 if(c&&c.ok===false){G.declined=true;return}
 if(!(c&&c.ok&&c.v>=CV)){askConsent();return}
 G.declined=false;permGate(function(){start2(t)})}
function start2(t){
 if(!navigator.geolocation&&!nat()){G.denied=true;G.err=T('Este aparelho não suporta GPS.','This device does not support GPS.');return}
 if(!nat()&&!window.isSecureContext&&location.hostname!='localhost'){G.denied=true;G.err=T('O GPS só funciona numa ligação segura (https).','GPS only works over a secure connection (https).');return}
 G.on=true;G.trip=t.id;G.mid=ME.motorista;G.err='';
 var d=D.drivers.find(function(x){return x.id==ME.motorista});G.nome=(d&&d.nome)||ME.nome||'';
 var nb=nat();
 if(nb){nb.addWatcher({backgroundTitle:'FrotaPro',backgroundMessage:T('Rastreio da viagem ativo','Trip tracking active'),requestPermissions:true,stale:false,distanceFilter:15},function(l,e){
   if(e){onErr({code:e.code=='NOT_AUTHORIZED'?1:2});return}
   onPos({coords:{latitude:l.latitude,longitude:l.longitude,accuracy:l.accuracy,speed:l.speed,heading:l.bearing}})}).then(function(id){G.nid=id}).catch(function(){onErr({code:2})})}
 else{G.wid=navigator.geolocation.watchPosition(onPos,onErr,OPT);wake()}}
function stopWatch(){G.prev=null;if(G.nid!=null){try{nat().removeWatcher({id:G.nid})}catch(e){}G.nid=null}if(G.wid!=null){try{navigator.geolocation.clearWatch(G.wid)}catch(e){}G.wid=null}G.on=false;relWake()}
function stop(final){var m=G.mid;stopWatch();G.pos=null;G.trip=null;G.err='';
 if(final&&m){(G.q.length?flush():Promise.resolve()).then(function(){if(cfg())return rpc('frota_gps_stop',{p_motorista:m});locStop(m)}).catch(function(){})}}
function onPos(p){var c=p.coords;if(!c)return;
 G.err='';
 G.pos={lat:c.latitude,lon:c.longitude,vel:(c.speed!=null&&!isNaN(c.speed))?Math.round(c.speed*3.6):null,rumo:(c.heading!=null&&!isNaN(c.heading))?Math.round(c.heading):null,prec:c.accuracy!=null?Math.round(c.accuracy):null,t:Date.now()};
 if(c.accuracy>1500)return;
 if(Date.now()-G.last>=SEND)push()}
function onErr(e){
 if(e.code==1){G.denied=true;stopWatch();G.err=T('Permissão de localização negada. Ative a localização para este site nas definições do navegador e toque em «Tentar de novo».','Location permission denied. Enable location for this site in the browser settings and tap “Try again”.')}
 else if(e.code==2)G.err=T('Sem sinal GPS. Verifique se a localização do telemóvel está ligada.','No GPS signal. Check that location is turned on.');
 else G.err=T('A aguardar sinal GPS…','Waiting for GPS signal…');
 bar()}
function push(){var p=G.pos;if(!p||!G.trip)return;G.last=Date.now();
 var vel=p.vel,pv=G.prev;
 if(vel==null&&pv&&p.t-pv.t<120000&&p.t>pv.t){var dk=hav(pv.lat,pv.lon,p.lat,p.lon);vel=dk*1000<Math.max(15,p.prec||0)?0:Math.round(dk/((p.t-pv.t)/3600000));if(vel>180)vel=null}
 G.prev={lat:p.lat,lon:p.lon,t:p.t};
 var t=D.trips.find(function(x){return x.id==G.trip})||{},v=D.vehicles.find(function(x){return x.id==t.veiculo})||{};
 G.q.push({m:G.mid,v:G.trip,ve:t.veiculo||'',mat:v.matricula||'',nome:G.nome,lat:+p.lat.toFixed(6),lon:+p.lon.toFixed(6),vel:vel,rumo:p.rumo,prec:p.prec,bat:BAT?Math.round(BAT.level*100):null,ts:new Date(p.t).toISOString()});
 if(G.q.length>3000){var k=0;G.q=G.q.filter(function(x,i){return i==G.q.length-1||(k++%2==0)})}
 saveQ();flush()}
function send(p){
 if(!cfg()){locPut(p);return Promise.resolve()}
 return rpc('frota_gps_put',{p_motorista:p.m,p_viagem:p.v,p_veiculo:p.ve,p_matricula:p.mat,p_nome:p.nome,p_lat:p.lat,p_lon:p.lon,p_vel:p.vel,p_rumo:p.rumo,p_prec:p.prec,p_bat:p.bat,p_ts:p.ts})}
function flush(){
 if(G.busy||!G.q.length||navigator.onLine===false)return Promise.resolve();G.busy=true;
 return (function nx(){
  if(!G.q.length)return Promise.resolve();
  return send(G.q[0]).then(function(){G.q.shift();G.lastOk=Date.now();G.err=G.denied?G.err:'';return nx()})})()
 .catch(function(e){if(e&&e.status>=400&&e.status<500&&[401,403,404,408,429].indexOf(e.status)<0){G.q.shift();return}
 if(e&&(e.status==404||/PGRST202/.test(e.body||''))){G.err=T('O servidor ainda não tem o SQL do rastreio. Peça ao administrador para o executar.','The server does not have the tracking SQL yet. Ask the administrator to run it.')}else{G.err=T('Sem ligação — as posições ficam guardadas e são enviadas quando houver rede.','Offline — positions are kept and sent when the network returns.')}})
 .then(function(){G.busy=false;saveQ();bar()})}
function tick(){
 var t=null;try{t=myTrip()}catch(e){}
 if(t){if(!G.on&&!G.denied&&!G.declined)start(t);else if(G.on)G.trip=t.id}
 else if(G.on)stop(typeof ME!=='undefined'&&!!ME);
 else if(typeof ME==='undefined'||!ME)G.denied=false;
 if(G.on&&G.pos&&Date.now()-G.pos.t<30000&&Date.now()-G.last>=SEND)push();
 if(G.q.length&&!G.busy)flush();
 bar()}
function bar(){
 var el=document.getElementById('gpsbar');if(!el)return;
 var t=null;try{t=myTrip()}catch(e){}
 if(!t&&!G.on){el.style.display='none';return}
 var cls='ok',h;
 var tr=t?'<b>'+X(t.origem)+' → '+X(t.destino)+'</b>':'';
 if(G.declined){cls='warn';h='📡 '+T('Rastreio GPS desligado por si','GPS tracking turned off by you')+' · '+tr+' <button class="gpsb" onclick="GPS.consent()">'+T('Ativar','Turn on')+'</button>'}
 else if(G.denied){cls='bad';h='📡 '+T('Rastreio GPS desligado','GPS tracking is off')+' · '+tr+'<br><small>'+X(G.err)+'</small> <button class="gpsb" onclick="GPS.retry()">'+T('Tentar de novo','Try again')+'</button>'}
 else if(G.err&&!G.lastOk||(G.err&&Date.now()-G.lastOk>60000)){cls='warn';h='📡 '+T('Rastreio GPS ativo','GPS tracking on')+' · '+tr+'<br><small>'+X(G.err)+'</small>'}
 else{h='📡 '+T('Rastreio GPS ativo','GPS tracking on')+' · '+tr+' · <small>'+(G.lastOk?T('posição enviada ','position sent ')+ago(Date.now()-G.lastOk):T('a obter sinal GPS…','acquiring GPS signal…'))+'</small>'+(nat()?'':' · <small>'+T('mantenha a app aberta','keep the app open')+'</small>')+' <button class="gpsb" style="background:transparent;color:inherit;border:1px solid currentColor" onclick="GPS.revoke()">'+T('Desligar','Turn off')+'</button>'}
 el.className='gps-'+cls;el.innerHTML=h;el.style.display='block'}

/* ======================= PAINEL ADMIN / GESTOR ======================= */
function fetchRows(){
 if(!cfg()){var s=locGet();return Promise.resolve(Object.keys(s.p).map(function(k){return s.p[k]}))}
 return rpc('frota_gps_get',{})}

/* Bloqueia o "puxar para baixo" / efeito elástico em todas as abas, janelas e listas */
(function(){var sy=0,sx=0;
function sc(el){while(el&&el!==document.body&&el!==document.documentElement){var st=getComputedStyle(el);if(/(auto|scroll)/.test(st.overflowY)&&el.scrollHeight>el.clientHeight+1)return el;el=el.parentElement}return null}
document.addEventListener('touchstart',function(e){var t=e.touches[0];if(t){sy=t.clientY;sx=t.clientX}},{passive:true});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)return;var t=e.touches[0],dy=t.clientY-sy,dx=t.clientX-sx;if(Math.abs(dx)>Math.abs(dy))return;
 if(e.target.closest&&e.target.closest('.leaflet-container'))return;
 var el=sc(e.target);if(!el){if(e.cancelable)e.preventDefault();return}
 var top=el.scrollTop<=0,bot=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
 if((dy>0&&top)||(dy<0&&bot)){if(e.cancelable)e.preventDefault()}},{passive:false});
})();

<script>
(function(){
const $=id=>document.getElementById(id);
// ---- Anúncios Adsterra: coluna à direita, cada anúncio isolado numa iframe ----

const ADS_SAME_ORIGIN = true;   // true = os anuncios Adsterra carregam (precisam de cookies/armazenamento do iframe). false = isolamento total, mas o Adsterra costuma ficar em branco
const AD_SANDBOX = 'allow-scripts allow-popups allow-popups-to-escape-sandbox' + (ADS_SAME_ORIGIN ? ' allow-same-origin' : '');
const ADS = { mounted: false, closed: false, rt: null };
const adDoc = inner => '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style></head><body>' + inner + '</body></html>';
const adBan = (key, w, h) => `<script>atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};<\/script><script src="https://www.highrevenueformat.com/${key}/invoke.js"><\/script>`;
const AD_SKY = { w: 160, h: 600, html: adBan('564e7adc0ff1990d56cdd393faeeec06', 160, 600) };
const AD_320 = { w: 320, h: 50, html: adBan('ddcbd0d50628c33713525ea2badce6ff', 320, 50) };
const AD_300 = { w: 300, h: 250, html: adBan('be2d947b712bcc91c50359d1854bbb67', 300, 250) + '<script src="https://pl30778021.profitableratecpmnetwork.com/78/fa/00/78fa00cf4dcda3dedf40132f76226af6.js"><\/script>' };
const AD_NAT = { w: 320, h: 260, html: '<script async="async" data-cfasync="false" src="https://pl30778022.profitableratecpmnetwork.com/edbac03e0788a019f72e8767b9dc91d4/invoke.js"><\/script><div id="container-edbac03e0788a019f72e8767b9dc91d4"></div>' };
function adsMount() {
  const W = innerWidth, H = innerHeight - 60 - 26, wide = W >= 1600;
  if (W < 1200) return false;
  const slots = $('ad-slots'); slots.innerHTML = ''; let used = 0;
  (wide ? [AD_300, AD_320, AD_NAT, AD_SKY] : [AD_SKY]).forEach(u => {   // só o que cabe no ecrã, nunca anúncios escondidos
    if (used && used + u.h > H + 40) return;
    used += u.h + 10;
    const f = document.createElement('iframe');
    f.width = u.w; f.height = u.h; f.scrolling = 'no'; f.title = 'Publicidade'; f.setAttribute('sandbox', AD_SANDBOX); f.srcdoc = adDoc(u.html);
    slots.appendChild(f);
  });
  if (!slots.children.length) return false;
  $('ad-rail').classList.add('on'); $('ad-rail').classList.toggle('wide', wide);
  document.body.classList.add('ads-on'); document.body.classList.toggle('ads-wide', wide);
  return true;
}
function adsUnmount() { $('ad-slots').innerHTML = ''; $('ad-rail').classList.remove('on', 'wide'); document.body.classList.remove('ads-on', 'ads-wide'); }
function adsSync() {
  const want = !ADS.closed && typeof ME !== 'undefined' && !!ME && innerWidth >= 1200;
  if (want && !ADS.mounted) ADS.mounted = adsMount();
  else if (!want && ADS.mounted) { adsUnmount(); ADS.mounted = false; }
}
function adsClose() { ADS.closed = true; adsSync(); }
setInterval(adsSync, 1500);
addEventListener('resize', () => { clearTimeout(ADS.rt); ADS.rt = setTimeout(() => { if (ADS.mounted) { adsUnmount(); ADS.mounted = false; } adsSync(); }, 600); });
// Recarrega os anúncios do ad-rail a cada 1 minuto (60.000 ms)
setInterval(() => {
    const adRail = document.getElementById('ad-rail');
    if (adRail) {
        const iframes = adRail.querySelectorAll('iframe');
        iframes.forEach(iframe => {
            if (iframe.srcdoc) {
                // Anúncios criados com srcdoc: reatribuir força o recarregamento
                iframe.srcdoc = iframe.srcdoc;
            } else if (iframe.src) {
                // Atualiza o src para forçar a atualização do iframe
                iframe.src = iframe.src;
            }
        });
    }
}, 60000);
window.adsClose=adsClose;
})();
</script>

<script>
(function(){

 document.body.appendChild(bk);document.body.appendChild(more);document.body.appendChild(bar);
 bk.onclick=close;
 bar.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.m=='more'){toggle();return}close();go(b.dataset.g)};
 more.onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;close();

 bar.innerHTML=slots.map(btn).join('')+'<button data-m="more" class="'+(more.classList.contains('on')?'on':'')+'"><b>☰</b><span>'+T('Mais','More')+'</span></button>';
 var bell=g('bell'),me=g('me');

<script>

(function(){

var TIPS={

fuelp:['Mantenha o preço do combustível atualizado: é usado nas estimativas de custo.','Keep the fuel price up to date: it is used in cost estimates.'],
sim:['Use o simulador antes de aceitar um frete para ver custos e margem.','Use the simulator before accepting a job to check costs and margin.'],
docs:['Emita contratos, cotações, facturas e recibos. Uma cotação pode ser convertida em factura; use 🖨️ para imprimir ou partilhar por WhatsApp.','Issue contracts, quotes, invoices and receipts. A quote can be turned into an invoice; use 🖨️ to print or share via WhatsApp.'],

 var v=document.getElementById('view');if(!v||typeof ME==='undefined'||!ME||typeof tab==='undefined')return;
 var old=document.getElementById('tabtip');if(old)old.remove();
 var t=TIPS[tab],o=st();if(!t||o.all||(o.t||{})[tab])return;

 v.insertBefore(d,v.firstChild)}catch(e){}}
