 dev('frota_dev_sup_reply',{p_cid:CUR,p_texto:t}).then(function(){i.value='';SIG='';return supLoad(true)}).catch(function(e){dmsg(supErr(e))})}
function supDel(){if(!CUR)return;ask('Apagar esta conversa?').then(function(ok){if(!ok)return;
 dev('frota_dev_sup_delete',{p_cid:CUR}).then(function(){CUR=null;SIG='';var c=g('ds-chat');if(c)c.innerHTML='<div class="ds-empty">Selecione uma conversa para ler e responder.</div>';return supLoad(true)}).catch(function(e){dmsg(supErr(e))})})}

/* ---------- avisos de novas mensagens (som + selo no ⚙) neste aparelho ---------- */
function notifyOn(){return ls(NKEY)==='1'}
function syncNt(){var b=g('dvsupnt');if(b)b.textContent=notifyOn()?'🔔 Avisos neste aparelho: ligados':'🔕 Avisos neste aparelho: desligados'}
function toggleNotify(){ls(NKEY,notifyOn()?'0':'1');syncNt();
 if(notifyOn()&&'Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}unreadCheck()}
function badge(n){var f=g('devfab');if(!f)return;var b=f.querySelector('.dvbadge');if(!b){b=document.createElement('i');b.className='dvbadge';f.appendChild(b)}
 b.textContent=n>99?'99+':n;b.style.display=n?'':'none';f.classList.toggle('has-msg',n>0)}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext;if(C){var a=new C();[[880,0],[1175,.2],[880,.4]].forEach(function(p){var o=a.createOscillator(),gn=a.createGain(),t0=a.currentTime+p[1];o.type='sine';o.frequency.value=p[0];o.connect(gn);gn.connect(a.destination);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(.4,t0+.02);gn.gain.exponentialRampToValueAtTime(.0001,t0+.3);o.start(t0);o.stop(t0+.33)});setTimeout(function(){try{a.close()}catch(e){}},1500)}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function unreadCheck(){if(!notifyOn()&&!DP)return;
 rpc('frota_sup_unread').then(function(n){n=Number(n)||0;
  if(n>LAST&&(LAST!==-1||n>0)){beep();if(window.FROTA_TOAST)FROTA_TOAST('💬 '+(LAST===-1?n+' mensagem(ns) de suporte por ler':'Nova mensagem de suporte'));
   if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification('💬 Suporte FrotaPro',{body:n+' mensagem(ns) por ler',tag:'frota-support'})}catch(e){}}
   if(DP&&g('dvsup'))supLoad(false)}
  LAST=n;badge(n)}).catch(function(){})}

/* ---------- módulo bloqueado pelo plano ---------- */
window.lockMod=function(k){var o=overlay('licmod'),nm=modLbl(k),st=store();
 o.innerHTML='<div class="md" style="max-width:420px"><div class="mh"><span>🔒 '+L('Módulo não incluído no seu plano','Module not included in your plan')+'</span><button class="btn btn-s sm" id="lmx" type="button">✕</button></div>'+
  '<div class="mb" style="grid-template-columns:1fr;gap:.7rem"><div style="font-weight:800;font-size:1.05rem">'+esc(nm)+'</div>'+
  '<div style="color:var(--muted);font-size:.9rem">'+esc(L('A sua licença está no plano '+planName(window.LIC_FEATS)+'. Peça o upgrade ao Admin e este módulo fica disponível de imediato, sem reinstalar nada.','Your license is on the '+planName(window.LIC_FEATS)+' plan. Ask the Admin for an upgrade and this module becomes available right away, without reinstalling anything.'))+'</div>'+
  '<button class="btn btn-p" id="lmc" type="button" style="justify-content:center">💬 '+L('Pedir upgrade (chat com o Admin)','Request upgrade (chat with the Admin)')+'</button>'+
  '<a class="btn btn-s" style="justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent(L('Olá! Quero desbloquear o módulo '+nm+' na minha licença do FrotaPro ('+(st.empresa||'')+').','Hello! I want to unlock the '+nm+' module on my FrotaPro license ('+(st.empresa||'')+').'))+'">WhatsApp</a></div></div>';
 o.classList.add('on');g('lmx').onclick=function(){o.classList.remove('on')};
 g('lmc').onclick=function(){o.classList.remove('on');if(window.supOpen)window.supOpen('admin',L('Olá! Quero desbloquear o módulo '+nm+'.','Hello! I want to unlock the '+nm+' module.'))}};

/* ---------- arranque ---------- */
var fab=document.createElement('button');fab.id='devfab';fab.type='button';fab.title='Modo Programador';fab.textContent='⚙';fab.onclick=devOpen;document.body.appendChild(fab);
window.FROTA_LIC={open:devOpen,recheck:reval};window.FROTA_RPC=rpc;
setInterval(unreadCheck,20000);setTimeout(unreadCheck,4000);
boot();
setInterval(reval,10*60*1000);window.addEventListener('online',reval);
})();
</script>

<script id="noscroll-js">
(function(){
 function fit(box,root,classes,pad){
  classes.forEach(function(c){root.classList.remove(c)});box.style.transform='';
  var avail=function(){return window.innerHeight-pad};
  var h=function(){return box.getBoundingClientRect().height/(parseFloat((box.style.transform.match(/scale\(([\d.]+)\)/)||[0,1])[1])||1)};
  for(var i=0;i<=classes.length;i++){
   if(i>0)root.classList.add(classes[i-1]);
   if(h()<=avail())return;
  }
  var s=Math.max(.55,avail()/h());box.style.transform='scale('+s+')';
 }
 window.fitLogin=function(){
  var r=document.getElementById('login');if(!r||!r.classList.contains('on'))return;
  var b=r.querySelector('.auth-shell');if(!b)return;
  fit(b,r,['c1','c2','c3'],24);
 };
 window.fitGate=function(o){
  o=o||document.getElementById('licgate');if(!o)return;
  var b=o.querySelector('.md');if(!b)return;
  fit(b,o,['g1','g2'],24);
 };
 function all(){try{fitLogin();fitGate()}catch(e){}}
 window.addEventListener('resize',all);window.addEventListener('orientationchange',function(){setTimeout(all,200)});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(all);
 /* bloqueia o gesto de arrastar/rolar no login e na ativação de licença */
 document.addEventListener('touchmove',function(e){
  var t=e.target;if(t&&t.closest&&t.closest('#login,#licgate'))e.preventDefault();
 },{passive:false});
 document.addEventListener('scroll',function(e){var t=e.target;if(t&&t.id&&(t.id=='login'||t.id=='licgate')&&(t.scrollTop||t.scrollLeft)){t.scrollTop=0;t.scrollLeft=0}},true);
 document.addEventListener('wheel',function(e){
  var t=e.target;if(t&&t.closest&&t.closest('#login,#licgate'))e.preventDefault();
 },{passive:false});
})();
</script>
