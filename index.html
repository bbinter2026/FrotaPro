*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg-dark);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
header{background:var(--bg-surface);border-bottom:1px solid var(--border);min-height:60px;padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:.7rem;font-size:1.25rem;font-weight:800}
.logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--logo);border:1px solid var(--amber);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px var(--glow);font-size:1.3rem}
.brand small{display:block;font-size:.65rem;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
nav{display:flex;gap:.3rem;background:var(--bg-dark);padding:4px;border-radius:var(--r-md);border:1px solid var(--border);overflow-x:auto;max-width:100%}
nav button{background:none;border:none;color:var(--muted);padding:.5rem .9rem;border-radius:var(--r-sm);font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
nav button:hover{color:var(--text);background:var(--bg-hover)}
nav button.on{background:var(--amber);color:#000;box-shadow:0 0 8px var(--glow)}
.clock{font:600 .95rem monospace;color:var(--amber);background:var(--bg-card);border:1px solid var(--border);padding:.4rem .8rem;border-radius:20px}
main{flex:1;overflow-y:auto;padding:1.25rem}
.wrap{max-width:1200px;margin:0 auto}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.ct{font-size:1.1rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:.7rem;margin-bottom:1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.25rem}
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem;position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--amber)}
.kpi.r:after{background:var(--danger)}.kpi.g:after{background:var(--ok)}.kpi.i:after{background:var(--info)}
.kpi span{font-size:.75rem;color:var(--muted);text-transform:uppercase;font-weight:600}
.kpi b{display:block;font-size:1.7rem;font-weight:800;color:var(--amber);margin-top:.3rem}
.kpi.r b{color:var(--danger)}.kpi.g b{color:var(--ok)}.kpi.i b{color:var(--info)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem;min-width:620px}
th{background:var(--bg-dark);color:var(--muted);padding:.5rem .75rem;text-align:left;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.45rem .75rem;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg-hover)}
.pill{padding:3px 9px;border-radius:12px;font-size:.73rem;font-weight:700;display:inline-block;white-space:nowrap}
.s-ok{background:rgba(16,185,129,.2);color:var(--ok)}.s-warn{background:rgba(245,158,11,.2);color:var(--amber)}.s-bad{background:rgba(239,68,68,.2);color:var(--danger)}.s-info{background:rgba(99,102,241,.2);color:#818cf8}
.btn{padding:.6rem 1rem;border-radius:var(--r-md);border:none;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.btn-p{background:var(--amber);color:#000;box-shadow:0 4px 12px var(--glow)}.btn-p:hover{background:var(--amber-h)}
.btn-s{background:var(--bg-dark);color:var(--text);border:1px solid var(--border)}.btn-s:hover{background:var(--bg-hover)}
.btn-d{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}.btn-d:hover{background:var(--danger);color:#fff}
.sm{padding:3px 8px;font-size:.78rem}
.fc{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);padding:.6rem .85rem;color:var(--text);font-size:.9rem;outline:none;width:100%}
.fc:focus{border-color:var(--amber)}
.bar{display:flex;align-items:center;gap:.6rem;margin:.55rem 0;font-size:.82rem}
.bar i{flex:1;height:10px;background:var(--bg-dark);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.bar i u{display:block;height:100%;background:var(--amber);border-radius:6px}
.bar span{width:78px;color:var(--muted)}.bar em{width:90px;text-align:right;font-style:normal;font-weight:700}
.al{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.55rem .7rem;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);margin-bottom:.5rem;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:1.5rem}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.mo.on{display:flex}
.md{background:var(--bg-surface);border:1px solid var(--border-hi);border-radius:var(--r-lg);width:100%;max-width:620px;max-height:90%;overflow-y:auto}
.mh{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-weight:700}
.mb{padding:1.3rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.mb label{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:.3rem}
.mf{padding:1rem 1.4rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.6rem;background:var(--bg-card)}
@media(max-width:640px){main{padding:.75rem}.clock{display:none}}
textarea.fc{min-height:90px;resize:vertical}
#doc{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;overflow:auto;padding:1rem}
#doc.on{display:block}
.dbar{max-width:800px;margin:0 auto .75rem;display:flex;gap:.5rem;justify-content:flex-end}
.paper{background:#fff;color:#111;max-width:800px;margin:0 auto;padding:2rem;border-radius:6px;font-size:.88rem;line-height:1.45}
.paper *{color:#111}.paper h1{font-size:1.4rem;letter-spacing:1px}.paper h3{margin:1rem 0 .3rem}
.paper table{min-width:0;margin:.6rem 0}.paper th{background:#eee}.paper td,.paper th{border:1px solid #ccc;padding:.35rem .55rem}.paper tr:hover td{background:none}
.ph{display:flex;justify-content:space-between;gap:1rem;border-bottom:3px solid #f59e0b;padding-bottom:.8rem;margin-bottom:1rem}.ph img{max-height:64px}
.tot{margin-left:auto;width:270px}.tot div{display:flex;justify-content:space-between;padding:.2rem 0}
.cl{background:#f5f5f5;padding:.6rem .8rem;border-radius:4px;margin-bottom:.6rem}
.sig{display:flex;gap:2rem;margin-top:3.5rem}.sig div{flex:1;border-top:1px solid #111;padding-top:.3rem;text-align:center}
@media print{body>*:not(#doc){display:none!important}#doc{position:static;background:none;padding:0;overflow:visible}.dbar{display:none}.paper{max-width:none;padding:0}html,body{height:auto;overflow:visible}}
@media(max-width:640px){.fc{font-size:16px}.md{max-height:96%}.mb{padding:1rem}}
.bd{margin-top:.3rem;font-size:.75rem}

/* ===== TEMA GLASS (login style) ===== */
html{background:#10228a}
body{background:var(--page);background-attachment:fixed;background-size:cover}
header,.card,.kpi,.md,nav,.cl2{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
header{background:linear-gradient(135deg,rgba(80,190,255,.16),rgba(30,20,130,.28));border-bottom:1.5px solid var(--border-hi);box-shadow:0 0 22px var(--glow),0 4px 24px rgba(2,8,60,.35)}
.card,.kpi{background:linear-gradient(135deg,rgba(120,210,255,.16),rgba(30,25,140,.22));border:1.5px solid var(--border-hi);box-shadow:var(--shadow),0 0 18px -6px var(--glow)}

.btn-p:hover{background:linear-gradient(90deg,rgba(20,180,240,.7),rgba(70,45,200,.95));color:#fff}
.btn{border:1.5px solid transparent}

.clock{background:rgba(255,255,255,.07);border:1.5px solid var(--border);color:var(--amber);text-shadow:0 0 10px var(--glow)}
.ct{border-bottom:1px solid var(--border)}
th{background:rgba(8,12,70,.35);backdrop-filter:blur(6px)}
td{border-bottom:1px solid rgba(125,230,255,.14)}
.s-warn{background:rgba(251,191,36,.18);color:var(--warn)}

.fc,select.fc{background:linear-gradient(90deg,rgba(0,140,210,.28),rgba(40,25,150,.55));border:1.5px solid var(--border-hi);border-radius:999px;padding:.65rem 1.1rem;color:var(--text);backdrop-filter:blur(8px)}
.fc::placeholder{color:var(--muted)}
.fc:focus{border-color:#8af0ff;box-shadow:0 0 0 3px rgba(56,213,255,.25),0 0 16px var(--glow)}

/* modais */
.mo{background:rgba(5,8,55,.55);backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%)}

/* ===== LOGIN ===== */
#login .md.lg{max-width:380px;padding:2rem 1.8rem 1.6rem;overflow:visible;position:relative}
.lg h2{font-size:2.1rem;font-weight:500;margin-bottom:1.5rem;letter-spacing:.5px}
.lg .fld{position:relative;margin-bottom:1rem}
.lg .fld .fc{padding:.85rem 3rem .85rem 1.3rem;font-size:1rem}
.lg .fld .ic{position:absolute;right:1.1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text);cursor:pointer;font-size:1.15rem;opacity:.9;line-height:1}
.lg .row{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;margin:.2rem .2rem 1.4rem}
.lg .row label{display:flex;align-items:center;gap:.45rem;cursor:pointer}

.lg .foot{text-align:center;font-size:.72rem;margin-top:1rem;color:var(--text)}
.lg .foot b{cursor:pointer}

/* ===== BOTÕES COLORIDOS POR AÇÃO ===== */
.btn[data-c]{color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.45);border:1.5px solid var(--cb);background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 14px var(--cg),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,filter .15s,box-shadow .15s}
.btn[data-c]:hover{filter:brightness(1.18) saturate(1.1);transform:translateY(-1px);box-shadow:0 0 22px var(--cg),inset 0 1px 0 rgba(255,255,255,.35)}
.btn[data-c]:active{transform:translateY(0) scale(.97)}
[data-c=new]{--c1:#12b76a;--c2:#047857;--cb:#6ee7b7;--cg:rgba(52,211,153,.55)}
[data-c=ok]{--c1:#22c55e;--c2:#15803d;--cb:#86efac;--cg:rgba(74,222,128,.55)}

[data-c=del]{--c1:#f43f5e;--c2:#9f1239;--cb:#fda4af;--cg:rgba(251,113,133,.55)}
[data-c=print]{--c1:#a855f7;--c2:#5b21b6;--cb:#d8b4fe;--cg:rgba(192,132,252,.55)}
[data-c=exp]{--c1:#0ea5e9;--c2:#0369a1;--cb:#7dd3fc;--cg:rgba(56,189,248,.55)}
[data-c=map]{--c1:#06b6d4;--c2:#0e7490;--cb:#67e8f9;--cg:rgba(34,211,238,.55)}
[data-c=inv]{--c1:#ec4899;--c2:#9d174d;--cb:#f9a8d4;--cg:rgba(244,114,182,.55)}
[data-c=quote]{--c1:#eab308;--c2:#a16207;--cb:#fde047;--cg:rgba(250,204,21,.5)}
[data-c=fix]{--c1:#fb923c;--c2:#b45309;--cb:#fdba74;--cg:rgba(251,146,60,.55)}
[data-c=fuel]{--c1:#84cc16;--c2:#3f6212;--cb:#bef264;--cg:rgba(163,230,53,.5)}
[data-c=pay]{--c1:#10b981;--c2:#0f766e;--cb:#5eead4;--cg:rgba(45,212,191,.55)}
[data-c=clean]{--c1:#64748b;--c2:#334155;--cb:#cbd5e1;--cg:rgba(148,163,184,.4)}
[data-c=bell]{--c1:#f59e0b;--c2:#92400e;--cb:#fde68a;--cg:rgba(251,191,36,.5)}
[data-c=back]{--c1:#6366f1;--c2:#3730a3;--cb:#a5b4fc;--cg:rgba(129,140,248,.55)}
[data-c=save]{--c1:#0ea5e9;--c2:#4338ca;--cb:#7dd3fc;--cg:rgba(56,189,248,.6)}

async function saveM(){
 const{c,id}=cur,C=CFG[c],o={};
 for(const[k,l,t]of C.f){let v=$('#f_'+k).value;if(t=='number'&&v!=='')v=+v;o[k]=v}
 if(c=='quotes'||c=='invoices'){const x=itemsCollect();if(!x)return alert('Adicione pelo menos um item com descrição.');Object.assign(o,x)}
 if(c=='trips')Object.assign(o,tripCollect());if(c=='expenses'||c=='fuel')o.foto=PH.cur||'';
 if(c=='vehicles'&&!o.matricula)return alert('Indique a matrícula.');
 if(c=='drivers'&&!o.nome)return alert('Indique o nome.');
 if(c=='clients'&&!o.nome)return alert('Indique o nome do cliente.');
 if(['contracts','quotes','invoices'].includes(c)&&!o.cliente)return alert('Registe primeiro um cliente.');
 if(c=='receipts'&&(!o.fatura||!(o.valor>0)))return alert('Escolha a factura e indique o valor.');
 if(['trips','maint','fuel'].includes(c)&&!o.veiculo)return alert('Registe primeiro um veículo.');
 if(c=='users'&&(!o.nome||!o.pin))return alert('Indique nome e PIN.');
 if(id&&CRIT.includes(c)&&!await ask('Operação crítica: confirma as alterações a este registo? Ficará registado no histórico.'))return;
 let r,b;if(id){r=D[c].find(x=>x.id==id);b={...r};Object.assign(r,o)}else{r={id:uid(),...o};D[c].push(r)}
 /* ligações do negócio: viagens e abastecimentos atualizam o veículo */
 const v=D.vehicles.find(x=>x.id==r.veiculo);
 if(v){
  if(c=='trips'){if(r.estado=='Em curso')v.estado='Em viagem';if(r.estado=='Concluída'){if(v.estado=='Em viagem')v.estado='Disponível';if(r.kmFim>v.km)v.km=r.kmFim}
   const m=D.drivers.find(x=>x.id==r.motorista);if(m&&m.estado!='Inativo')m.estado=r.estado=='Em curso'?'Em viagem':r.estado=='Concluída'?'Ativo':m.estado}
  if(c=='fuel'&&r.km>v.km)v.km=r.km;
  if(c=='maint'){if(r.estado=='Agendada'&&days(r.data)<=0)v.estado='Manutenção';if(r.estado=='Concluída'){if(v.estado=='Manutenção')v.estado='Disponível';if(r.km>v.km)v.km=r.km}}}
 audit(id?'editou':'criou',c,r,b);checkAprov(c,r);tab=home(c);save();closeM();render();
}
async function del(c,id){

 if(!CRIT.includes(c)){if(!await ask('Eliminar este registo?'))return;return doDel(c,id,'')}
 const m=await ask('Operação crítica. Indique o motivo da eliminação:',1);
 if(!m||m.trim().length<3)return alert('Motivo obrigatório. Operação cancelada.');
 if(isOwner()){if(await ask('Eliminar definitivamente? Ficará registado no histórico.'))doDel(c,id,m)}
 else{r.pedidoDel={u:ME.nome,m,t:now()};audit('pediu eliminação',c,r,null,m);save();render();alert('Pedido enviado ao proprietário para aprovação.')}}

function audit(a,c,r,b,m){
 let det='';if(a=='editou'&&b)det=Object.keys(r).filter(k=>JSON.stringify(r[k])!==JSON.stringify(b[k])&&!['aprov','pedidoDel','pin','foto','geomI','geomV','coordO','coordD','est','durI','durV','rotaCalcEm'].includes(k)).map(k=>k+': '+(b[k]??'—')+' → '+(r[k]??'—')).join('; ');
 const e={t:now(),u:ME?ME.nome:'—',p:ME?ME.papel:'—',a,c,id:r.id,reg:dsc(c,r),det:m?'Motivo: '+m:det};
 e.h=hsh((D.log.length?D.log[D.log.length-1].h:'0')+JSON.stringify(e));D.log.push(e)}
function verifyLog(){let p='0';for(const e of D.log){const{h,...r}=e;if(hsh(p+JSON.stringify(r))!==h)return false;p=h}return true}

const pendentes=()=>{const p=[];CRIT.forEach(c=>D[c].forEach(r=>{if(r.aprov=='Pendente'||r.pedidoDel)p.push([c,r])}));return p};
function aprovar(c,id,ok){if(!isOwner())return;const r=D[c].find(x=>x.id==id);
 if(r.pedidoDel){if(ok){audit('aprovou eliminação',c,r,null,r.pedidoDel.m);D[c]=D[c].filter(x=>x.id!=id)}else{audit('rejeitou eliminação',c,r);delete r.pedidoDel}}
 else if(ok){audit('aprovou',c,r);delete r.aprov}else{audit('rejeitou',c,r,null,'Valor rejeitado');r.aprov='Rejeitado'}
 save();render()}

 const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||15000);let r;
 try{r=await fetch(url,{signal:ac.signal})}catch(e){clearTimeout(tm);throw new Error(e.name=='AbortError'?'O serviço de mapas demorou demasiado a responder.':'Não foi possível contactar o serviço de mapas (rede, bloqueio do navegador ou servidor indisponível).')}
 clearTimeout(tm);
 if(r.status==429)throw new Error('Limite de pedidos do serviço gratuito atingido. Aguarde um minuto e tente de novo.');
 if(!r.ok)throw new Error('O serviço de mapas respondeu com erro (HTTP '+r.status+').');
 try{return await r.json()}catch(e){throw new Error('Resposta inválida do serviço de mapas.')}}

 const a=await jget(cfgUrl('nomUrl',FP.nom)+'/search?format=jsonv2&limit=1&accept-language=pt&q='+encodeURIComponent(q)+(pa?'&countrycodes='+pa:''));
 if(!Array.isArray(a)||!a.length)throw new Error('Local não encontrado: "'+q+'". Escreva cidade e país (ex.: "Beira, Moçambique") ou verifique a ortografia.');
 const g={lat:+a[0].lat,lon:+a[0].lon,nome:short(a[0].display_name)};

<script>
(function(){
const RULES=[
 [/＋|➕|Nova viagem|Novo /i,'new'],
 [/💾|^\s*OK\s*$|Entrar/,'save'],
 [/🗑|✖|Rejeitar|Repor/,'del'],
 [/✔|Aprovar/,'ok'],
 [/✏️|Registar regresso/,'edit'],
 [/🖨|Imprimir|PDF/,'print'],
 [/⬇|📥|CSV|Exportar|Exemplo/,'exp'],
 [/🗺/,'map'],[/📲/,'pay'],[/📎/,'exp'],
 [/🧾|factura/i,'inv'],
 [/📋|Cotar|cotação/i,'quote'],
 [/🔧|Manuten/,'fix'],
 [/⛽|Abastec/,'fuel'],

 [/🧹|Limpar/,'clean'],
 [/🔔/,'bell']

  if(b.id==='me'||/^\s*(✕|Cancelar|✕ Fechar)\s*$/.test(b.textContent)||b.textContent.trim()==='✕ Fechar')return;

  for(const [re,c] of RULES){if(re.test(t)){b.dataset.c=c;return}}
 });

<script>

function tripCost(t){const f=D.fuel.filter(x=>x.viagem==t.id),e=D.expenses.filter(x=>x.viagem==t.id),py=(D.payroll||[]).filter(x=>x.viagem==t.id&&PAYC.includes(x.tipo)),pv=sum(py,x=>x.valor);if(f.length||e.length)return{v:sum(f,x=>x.litros*x.preco)+sum(e,x=>x.valor)+pv,est:false};if(py.length){if(t.est){const aj=py.some(x=>x.tipo=='Diárias')?(+t.est.ajud||0):0;return{v:Math.max(0,(+t.est.custo||0)-aj)+pv,est:true}}return{v:pv,est:false}}return{v:t.est?+t.est.custo||0:0,est:!!t.est}}

 const open=D.invoices.filter(i=>tot(i)-pago(i)>.005),falta=sum(open,i=>tot(i)-pago(i)),venc=open.filter(i=>days(i.vencimento)<0),vv=sum(venc,i=>tot(i)-pago(i));

 <div class="card"><div class="ct">🔧 Manutenção por quilometragem e pneus</div>${planView()}</div>
 <div class="card"><div class="ct">💾 Cópia de segurança</div><p style="color:var(--muted);font-size:.85rem;margin-bottom:.8rem">Os dados ficam só neste dispositivo. No telemóvel, o botão abre a partilha (Google Drive, WhatsApp, email); no computador descarrega o ficheiro.</p><button class="btn btn-s" onclick="backupNow()">⬇ Exportar cópia agora</button></div>`}
function arView(open){
 const B=[['A vencer',0],['1–30 dias',0],['31–60 dias',0],['+60 dias',0]];
 open.forEach(i=>{const d=-days(i.vencimento),k=d<=0?0:d<=30?1:d<=60?2:3;B[k][1]+=tot(i)-pago(i)});
 const rows=D.clients.map(c=>{const inv=open.filter(i=>i.cliente==c.id);const venc=inv.filter(i=>days(i.vencimento)<0);return{c,f:sum(inv,i=>tot(i)-pago(i)),v:sum(venc,i=>tot(i)-pago(i)),d:venc.length?Math.max(...venc.map(i=>-days(i.vencimento))):0}}).filter(x=>x.f>0).sort((a,b)=>b.d-a.d||b.f-a.f);
 return`<div class="kpis">${B.map((b,i)=>kpi(b[0],MT(b[1]),i==0?'i':i==1?'':'r')).join('')}</div>`+(rows.length?`<div class="tw"><table><tr><th>Cliente</th><th>Em falta</th><th>Vencido</th><th>Atraso máx.</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.c.nome)}</td><td>${MT(x.f)}</td><td>${x.v?'<span class="pill s-bad">'+MT(x.v)+'</span>':'—'}</td><td>${x.d?x.d+' dias':'—'}</td><td><button class="btn btn-s sm" onclick="waCobr('${x.c.id}')">📲 Cobrar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Sem facturas por receber. ✅</div>')}

function rentView(){

 const col={veiculo:'vehicles',motorista:'drivers',cliente:'clients'}[PL.by];

 return R.length?`<div class="tw"><table><tr><th>${{veiculo:'Camião',motorista:'Motorista',cliente:'Cliente'}[PL.by]}</th><th>Viagens</th><th>Receita</th><th>Custos</th><th>Lucro</th><th>Margem</th></tr>${R.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.n}</td><td>${MT(x.r)}</td><td>${MT(x.c)}${x.e?' <span class="pill s-warn" title="'+x.e+' viagem(ns) sem despesas reais: usa o custo estimado">est.</span>':''}</td><td><span style="color:var(--${x.l>=0?'ok':'danger'})">${MT(x.l)}</span></td><td>${x.r?pill2(x.l/x.r*100,10):'—'}</td></tr>`).join('')}</table></div><div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">Custos = abastecimentos, despesas, diárias, comissões e bónus reais associados à viagem; "est." indica que, sem registos reais, se usou o custo estimado.</div>`:'<div class="empty">Ainda sem viagens.</div>'}
function priceView(){const P=PL.pr,vs=D.vehicles;if(!P.veic&&vs[0])P.veic=vs[0].id;
 const inp=(k,l,t)=>`<div><label>${l}</label><input class="fc" type="number" min="0" step="any" value="${P[k]}" oninput="PL.pr.${k}=this.value;prCalc()"></div>`;

function prCalc(){const o=$('#pr_out');if(!o)return;const P=PL.pr,km=(+P.km||0)*(P.vazio?2:1),cons=consOf(P.veic),pr=precoComb(),m=Math.min(90,+P.margem||0);

 const comb=km*cons/100*pr,dg=km*(+D.co.desg||0),c=comb+dg+(+P.port||0)+(+P.aj||0),preco=c/(1-m/100),iva=preco*(+D.co.iva||0)/100;
 o.innerHTML=`<div class="tw"><table><tr><td>⛽ Combustível (${Math.round(km*cons/100)} L)</td><td style="text-align:right">${MT(comb)}</td></tr><tr><td>Desgaste + portagens + ajudas</td><td style="text-align:right">${MT(dg+(+P.port||0)+(+P.aj||0))}</td></tr><tr><td><b>Custo estimado</b></td><td style="text-align:right"><b>${MT(c)}</b></td></tr><tr><td><b>Frete sugerido (margem ${m}%)</b></td><td style="text-align:right"><b style="color:var(--amber)">${MT(preco)}</b></td></tr><tr><td>Com IVA (${D.co.iva||0}%)</td><td style="text-align:right">${MT(preco+iva)}</td></tr></table></div>`}

 return`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:.9rem"><select class="fc" id="pl_v">${vs.map(v=>`<option value="${v.id}">${esc(v.matricula)} · ${(+v.km||0).toLocaleString('pt-PT')} km</option>`).join('')}</select><select class="fc" id="pl_i">${items.map(i=>`<option>${i}</option>`).join('')}</select><input class="fc" id="pl_d" placeholder="Detalhe (ex.: pneus dianteiros)"><input class="fc" id="pl_c" type="number" min="1" placeholder="Cada (km)"><input class="fc" id="pl_u" type="number" min="0" placeholder="Último feito aos (km)"><button class="btn btn-p" onclick="planAdd()">＋ Adicionar plano</button></div>`+(L.length?`<div class="tw"><table><tr><th>Camião</th><th>Item</th><th>Cada</th><th>Próximo aos</th><th>Falta</th><th></th></tr>${L.map(({pl,v,r})=>`<tr><td>${esc(v.matricula)}</td><td>${esc(pl.item)}${pl.det?' <span style="color:var(--muted)">· '+esc(pl.det)+'</span>':''}</td><td>${(+pl.cada).toLocaleString('pt-PT')} km</td><td>${((+pl.ultimo||0)+(+pl.cada)).toLocaleString('pt-PT')} km</td><td><span class="pill s-${r<0?'bad':r<=1000?'warn':'ok'}">${r<0?'atrasado '+(-r).toLocaleString('pt-PT')+' km':r.toLocaleString('pt-PT')+' km'}</span></td><td style="white-space:nowrap"><button class="btn btn-p sm" title="Marcar como feito ao km atual" onclick="planDone('${pl.id}')">✔ Feito</button> <button class="btn btn-d sm" onclick="planDel('${pl.id}')">🗑️</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Sem planos. Adicione acima: o app avisa nos Alertas 1000 km antes.</div>')}
function planAdd(){const v=$('#pl_v').value,cada=+$('#pl_c').value;if(!v||!(cada>0))return alert('Escolha o camião e indique o intervalo em km.');const ve=D.vehicles.find(x=>x.id==v);const u=$('#pl_u').value;D.plans.push({id:uid(),veiculo:v,item:$('#pl_i').value,det:$('#pl_d').value.trim(),cada,ultimo:u===''?(+ve.km||0):+u});save();render()}

async function planDel(id){if(!await ask('Remover este plano?'))return;D.plans=D.plans.filter(x=>x.id!=id);save();render()}

<script>

function itemsUI(){const e=$('#it_box');if(!e)return;const imp=D.co.impostoNome||'IVA';
 e.innerHTML=`<div class="tw it"><table style="min-width:620px"><tr><th>Descrição</th><th style="width:90px">Qtd</th><th style="width:140px">Preço unit. (MT${ITI?', c/ imposto':''})</th><th style="width:130px;text-align:right">Total</th><th style="width:44px"></th></tr>${IT.map((x,n)=>`<tr><td><input class="fc" value="${esc(x.d)}" placeholder="Serviço / descrição" oninput="itSet(${n},'d',this.value)"></td><td><input class="fc" type="number" min="0" step="any" value="${esc(x.q)}" oninput="itSet(${n},'q',this.value)"></td><td><input class="fc" type="number" min="0" step="any" value="${esc(x.p)}" oninput="itSet(${n},'p',this.value)"></td><td id="it_t${n}" style="text-align:right;white-space:nowrap">${MT2((+x.q||0)*(+x.p||0))}</td><td><button type="button" class="btn btn-d sm" title="Remover item" onclick="itDel(${n})">🗑️</button></td></tr>`).join('')}</table></div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-top:.6rem"><div><button type="button" class="btn btn-p sm" onclick="itAdd()">＋ Adicionar item</button><div style="font-size:.75rem;color:var(--muted);margin-top:.5rem">${imp} de ${String(ITR).replace('.',',')}%, definido em Empresa → Definições.<label style="display:flex;gap:.4rem;align-items:center;text-transform:none;margin-top:.3rem;font-size:.78rem"><input type="checkbox" ${ITI?'checked':''} onchange="ITI=this.checked;itemsUI()"> Os preços unitários já incluem o imposto</label>${ITR!=(+D.co.iva||0)?' <button type="button" class="btn btn-s sm" onclick="ITR=+D.co.iva||0;itemsUI()">Usar taxa atual ('+(+D.co.iva||0)+'%)</button>':''}</div></div><div id="it_sum" style="min-width:240px;font-size:.88rem"></div></div>`;itSum()}
function itSet(n,k,v){IT[n][k]=k=='d'?v:(v===''?'':+v);const t=$('#it_t'+n);if(t)t.textContent=MT2((+IT[n].q||0)*(+IT[n].p||0));itSum()}
function itSum(){const e=$('#it_sum');if(!e)return;const imp=D.co.impostoNome||'IVA',g=IT.reduce((s,x)=>s+(+x.q||0)*(+x.p||0),0),b=ITI?g/(1+ITR/100):g,v=ITI?g-b:g*ITR/100,row=(a,c,st)=>`<div style="display:flex;justify-content:space-between;${st||''}"><span>${a}</span><span>${c}</span></div>`;
 e.innerHTML=row('Subtotal',MT2(b))+row(imp+' ('+String(ITR).replace('.',',')+'%)',MT2(v))+row('TOTAL',MT2(b+v),'font-weight:800;font-size:1rem;color:var(--amber);border-top:1px solid var(--border);padding-top:.3rem;margin-top:.2rem')}
function itAdd(){IT.push({d:'',q:1,p:''});itemsUI();const r=document.querySelectorAll('#it_box tr');const l=r[r.length-1];if(l)l.querySelector('input').focus()}
function itDel(n){if(IT.length<=1)return alert('O documento precisa de pelo menos um item.');IT.splice(n,1);itemsUI()}
function itemsCollect(){const L=IT.filter(x=>String(x.d).trim()).map(x=>({d:String(x.d).trim(),q:+x.q||0,p:+x.p||0,i:ITR}));if(!L.length)return null;
 return{itens:L,descricao:L[0].d+(L.length>1?' (+'+(L.length-1)+' item'+(L.length>2?'s':'')+')':''),qtd:L[0].q,punit:L[0].p,iva:ITR,incl:ITI}}

<script>

function payBase(mid,d,k){const m=D.drivers.find(x=>x.id==mid);if(!m)return 0;if(k=='sal')return +m.salario||0;const ym=String(d||'').slice(0,7),L=(D.payroll||[]).filter(x=>x.motorista==mid&&String(x.data).slice(0,7)==ym),g=sum(L.filter(x=>PAYC.includes(x.tipo)),x=>x.valor);return k=='liq'?g-sum(L.filter(x=>x.tipo=='Desconto'&&x.cat=='INSS'),x=>x.valor):g}

 if(cs){const cur=pc.value;pc.innerHTML=cs.map(c=>`<option ${c==cur?'selected':''}>${c}</option>`).join('');cw.style.display=''}else{pc.innerHTML='';cw.style.display='none'}
 const pct=g('pay_u').value=='%';g('pay_bw').style.display=pct?'':'none';g('pay_vl').textContent=pct?'Percentagem (%)':'Valor (MT)';
 const v=+g('pay_v').value||0,pv=g('pay_pv');if(pct&&v>0){const b=payBase(g('pay_m').value,g('pay_d').value,g('pay_b').value);pv.textContent=b>0?`${v}% de ${MT2(b)} = ${MT2(b*v/100)}`:'A base escolhida está a zero para este motorista/mês.'}else pv.textContent=''}

 const P=D.payroll||[],ym=PY.ym,mes=P.filter(x=>String(x.data).slice(0,7)==ym);
 const aPagar=sum(D.drivers,m=>Math.max(0,pyBal(m.id))),pagoM=sum(mes.filter(x=>x.tipo=='Adiantamento'||x.tipo=='Pagamento'),x=>x.valor),custoM=sum(mes,x=>PAYC.includes(x.tipo)?x.valor:x.tipo=='Desconto'&&!pyLegal(x)?-x.valor:0);
 const ds=D.drivers.map(m=>({m,rec:sum(P.filter(x=>x.motorista==m.id),x=>PAYC.includes(x.tipo)?x.valor:x.tipo=='Desconto'?-x.valor:0),pg:sum(P.filter(x=>x.motorista==m.id&&(x.tipo=='Adiantamento'||x.tipo=='Pagamento')),x=>x.valor),b:pyBal(m.id)}));
 const pend=(pp=>pp.length?`<div class="card"><div class="ct"><span>⏳ Viagens concluídas por lançar</span><span class="pill s-warn">${pp.length}</span></div><div class="tw"><table><tr><th>Viagem</th><th>Motorista</th><th>Tipo</th><th style="text-align:right">Valor</th><th></th></tr>${pp.map(({t,k,r})=>`<tr><td>${esc(t.origem+' → '+t.destino+' ('+fdate(t.saida)+')')}</td><td>${esc(r.m.nome)}</td><td>${r.tipo}</td><td style="text-align:right;white-space:nowrap" title="${esc(r.desc)}">${MT2(r.valor)}</td><td><button class="btn btn-p sm" onclick="payAuto('${t.id}','${k}')">＋ Lançar</button></td></tr>`).join('')}</table></div><div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">Diárias = dias da viagem × diária do motorista (ou a da empresa). Comissão = % do frete ou valor fixo da ficha. Pode lançar agora ou no fim do mês — a data fica a da chegada.</div></div>`:'')(pyPending());
 const hist=P.filter(x=>(!PY.f||x.motorista==PY.f)).sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,150);
 const trips=D.trips.filter(t=>t.estado!='Cancelada').sort((a,b)=>String(b.saida).localeCompare(String(a.saida)));
 return`<div class="kpis">${kpi('Total a pagar',MT(aPagar),aPagar?'r':'g')}${kpi('Custo com motoristas ('+ym+')',MT(custoM),'i')}${kpi('Pago no mês',MT(pagoM),'g')}${kpi('Adiantamentos por abater',MT(sum(D.drivers,m=>Math.max(0,-pyBal(m.id)))),'r')}</div>
  ${pend}
 <div class="card"><div class="ct"><span>🧑‍✈️ Conta corrente dos motoristas</span><span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><input class="fc" type="month" style="width:auto" value="${ym}" onchange="PY.ym=this.value||PY.ym;render()"><button class="btn btn-p sm" onclick="payGenMonth()">＋ Gerar salários do mês</button></span></div>
 ${ds.length?`<div class="tw"><table><tr><th>Motorista</th><th>Salário base</th><th>Diária</th><th>Devido (total)</th><th>Pago</th><th>Saldo</th><th></th></tr>${ds.map(({m,rec,pg,b})=>`<tr><td>${esc(m.nome)}</td><td>${m.salario?MT(m.salario):'—'}</td><td>${MT(+m.diaria||+D.co.diaria||0)}</td><td>${MT(rec)}</td><td>${MT(pg)}</td><td><span class="pill s-${b>0?'warn':b<0?'bad':'ok'}">${b>0?MT(b)+' a pagar':b<0?MT(-b)+' a abater':'Regularizado'}</span></td><td style="white-space:nowrap"><button class="btn btn-p sm" onclick="payPre('${m.id}')">＋ Lançar</button> <button class="btn btn-s sm" onclick="payDoc('${m.id}')">🧾 Recibo</button> ${b>0?`<button class="btn btn-s sm" onclick="payPaySaldo('${m.id}')">💵 Pagar saldo</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">Registe motoristas primeiro.</div>'}
 <div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">Devido = salário + subsídios + diárias + comissões + bónus − descontos (INSS, IRPS, multas, faltas…). Saldo = devido − pagamentos e adiantamentos.</div></div>
 <div class="card"><div class="ct">＋ Novo lançamento</div>

 <div><label>Data</label><input class="fc" type="date" id="pay_d" value="${today()}" onchange="payUi()"></div>

function payView(){
 const t=document.createElement('div');t.innerHTML=payView0();const A=[...t.children],L=A.filter(e=>/Novo lançamento|Histórico de lançamentos/.test(e.textContent.slice(0,60))),R=A.filter(e=>!L.includes(e));
 const tabs=[['rec','📋 Folha & Resumo'],['lanc','🧾 Lançamentos']];
 const body=PY.tab=='lanc'?L.map(e=>e.outerHTML).join(''):PY.tab=='mot'?`<div class="card"><div class="ct"><span>👷 Trabalhadores (motoristas)</span><button class="btn btn-p" onclick="openM('drivers')">＋ Novo motorista</button></div>${tbl('drivers',D.drivers)}</div>`:R.map(e=>e.outerHTML).join('');
 return`<div class="card"><div class="ct"><span>💰 Salários &amp; RH</span><span style="display:flex;gap:.4rem"><button class="btn btn-s sm" onclick="go('drivers')">👷 Motoristas</button><button class="btn btn-s sm" onclick="go('co')">⚙️ Configurar</button></span></div><p style="color:var(--muted);font-size:.82rem;margin-bottom:.7rem">ℹ️ Este módulo apenas <b>regista</b> salários e pagamentos; "Pago" significa que o pagamento foi feito fora do sistema.</p><label style="display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;margin-bottom:.8rem"><input type="checkbox" ${D.co.pyInt?'checked':''} onchange="D.co.pyInt=this.checked;save();render()"><span><b>🔗 Integrar salários nas contas gerais</b><br><span style="color:var(--muted)">Ligado: o custo com salários entra no resultado dos Relatórios. Desligado: fica independente.</span></span></label><div style="display:flex;gap:.4rem;flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="btn ${PY.tab==k?'btn-p':'btn-s'}" onclick="PY.tab='${k}';render()">${l}</button>`).join('')}</div></div>${body}`}
function payPre(id){const e=$('#pay_m');if(e){e.value=id;e.scrollIntoView({behavior:'smooth',block:'center'})}}
function payTripVal(t,k){const m=D.drivers.find(x=>x.id==t.motorista);if(!m)return{err:'Esta viagem não tem motorista associado.'};
 if(k=='d'){const f=t.estado=='Concluída'&&t.chegada?t.chegada:today(),n=Math.max(1,Math.round((new Date(f)-new Date(t.saida))/864e5)+1),rate=+m.diaria||+D.co.diaria||0;if(!(rate>0))return{err:'Defina a diária na ficha do motorista ou em Empresa.'};return{m,tipo:'Diárias',valor:+(n*rate).toFixed(2),desc:`${n} dia(s) × ${rate} MT — ${t.origem} → ${t.destino}`}}
 const pc=+m.comissao||0,fx=+m.comissaoFixa||0,b=tripRec(t);if(pc>0)return{m,tipo:'Comissão',valor:+(b*pc/100).toFixed(2),desc:`${pc}% sobre o frete de ${MT(b)} — ${t.origem} → ${t.destino}`};
 if(fx>0)return{m,tipo:'Comissão',valor:fx,desc:`Comissão fixa — ${t.origem} → ${t.destino}`};return{err:'Defina a comissão (% ou valor fixo) na ficha do motorista.'}}
function payCalc(k){const t=D.trips.find(x=>x.id==$('#pay_vi').value);if(!t)return alert('Escolha primeiro a viagem.');const r=payTripVal(t,k);if(r.err)return alert(r.err);$('#pay_m').value=r.m.id;$('#pay_t').value=r.tipo;$('#pay_u').value='MT';$('#pay_v').value=r.valor;$('#pay_o').value=r.desc;payUi()}
function pyPending(){const P=D.payroll||[],o=[];D.trips.filter(t=>t.estado=='Concluída'&&t.motorista&&D.drivers.some(m=>m.id==t.motorista)).forEach(t=>{[['d','Diárias'],['c','Comissão']].forEach(([k,tp])=>{if(P.some(x=>x.viagem==t.id&&x.tipo==tp))return;const r=payTripVal(t,k);if(!r.err&&r.valor>0)o.push({t,k,r})})});return o}
async function payAuto(tid,k){const t=D.trips.find(x=>x.id==tid);if(!t)return;const r=payTripVal(t,k);if(r.err)return alert(r.err);if((D.payroll||[]).some(x=>x.viagem==tid&&x.tipo==r.tipo)&&!await ask('Já existe um lançamento de '+r.tipo+' para esta viagem. Lançar outro?'))return;const e={id:uid(),motorista:r.m.id,data:t.chegada&&t.chegada<=today()?t.chegada:today(),tipo:r.tipo,valor:r.valor,viagem:t.id,descricao:r.desc};D.payroll.push(e);audit('criou','payroll',e);save();render()}
function pyOldest(id){const P=(D.payroll||[]).filter(x=>x.motorista==id).sort((a,b)=>String(a.data).localeCompare(String(b.data)));let ab=sum(P.filter(x=>!PAYC.includes(x.tipo)),x=>x.valor);for(const x of P.filter(y=>PAYC.includes(y.tipo))){const r=+x.valor-ab;if(r>.005)return x.data;ab-=+x.valor}return null}
async function payAdd(){const m=$('#pay_m').value,t=$('#pay_t').value,d=$('#pay_d').value,pct=$('#pay_u').value=='%',n=+$('#pay_v').value,cat=PYCAT[t]?$('#pay_c').value:'';if(!m)return alert('Escolha o motorista.');if(!(n>0))return alert('Indique um valor maior que zero.');if(!d)return alert('Indique a data.');
 let v=n,bk='',bv=0,desc=$('#pay_o').value.trim();
 if(pct){bk=$('#pay_b').value;bv=payBase(m,d,bk);if(!(bv>0))return alert('A base escolhida ('+PYBASE.find(x=>x[0]==bk)[1].toLowerCase()+') está a zero para este motorista/mês. Defina o salário base na ficha ou lance primeiro os rendimentos.');v=+(bv*n/100).toFixed(2);if(!desc)desc=`${cat||t} ${String(n).replace('.',',')}% sobre ${MT(bv)}`}
 if(t=='Pagamento'&&v>pyBal(m)+.005&&!await ask('O pagamento ('+MT(v)+') é superior ao saldo a pagar ('+MT(Math.max(0,pyBal(m)))+'). Registar mesmo assim?'))return;
 const r={id:uid(),motorista:m,data:d,tipo:t,valor:v,viagem:$('#pay_vi').value||'',descricao:desc};if(cat)r.cat=cat;if(pct){r.pct=n;r.base=bk}D.payroll.push(r);audit('criou','payroll',r);save();render()}
async function payPaySaldo(id){const b=pyBal(id),m=D.drivers.find(x=>x.id==id);if(!(b>0))return;if(!await ask('Registar pagamento de '+MT2(b)+' a '+m.nome+' (liquida o saldo)?'))return;const r={id:uid(),motorista:id,data:today(),tipo:'Pagamento',valor:+b.toFixed(2),viagem:'',descricao:'Pagamento do saldo'};D.payroll.push(r);audit('criou','payroll',r);save();render();payDoc(id)}
async function payDel(id){const r=D.payroll.find(x=>x.id==id);if(!r)return;if(!await ask('Eliminar este lançamento ('+r.tipo+' · '+MT2(r.valor)+')? Ficará registado na auditoria.'))return;audit('eliminou','payroll',r);D.payroll=D.payroll.filter(x=>x.id!=id);save();render()}
function payMonthCalc(m){const co=D.co,sal=+m.salario||0,sub=+m.subsidio||0,pi=(m.inss===''||m.inss==null)?+co.inssPct||0:+m.inss,pr=(m.irps===''||m.irps==null)?+co.irpsPct||0:+m.irps,inss=+(sal*pi/100).toFixed(2),irps=+((sal+sub-inss)*pr/100).toFixed(2);return{sal,sub,pi,pr,inss,irps,liq:sal+sub-inss-irps}}
async function payGenMonth(){const ym=PY.ym,P=D.payroll,L=D.drivers.filter(m=>m.estado!='Inativo'&&+m.salario>0&&!P.some(x=>x.motorista==m.id&&x.tipo=='Salário'&&x.ref==ym));if(!L.length)return alert('Não há salários por gerar em '+ym+' (já lançados ou sem salário base nas fichas).');
 if(!await ask('Gerar o salário de '+ym+' para '+L.length+' motorista(s)?\n\n'+L.map(m=>{const c=payMonthCalc(m);return m.nome+': salário '+MT(c.sal)+(c.sub?' + subsídio '+MT(c.sub):'')+(c.inss?' − INSS '+MT(c.inss)+' ('+c.pi+'%)':'')+(c.irps?' − IRPS '+MT(c.irps)+' ('+c.pr+'%)':'')+' = líquido '+MT(c.liq)}).join('\n')+'\n\nPode ajustar ou acrescentar descontos e subsídios depois em Novo lançamento.'))return;
 const add=(m,tipo,valor,cat,extra)=>{const r={id:uid(),motorista:m.id,data:today(),tipo,valor,ref:ym,viagem:'',descricao:'',...extra};if(cat)r.cat=cat;P.push(r);audit('criou','payroll',r)};
 L.forEach(m=>{const c=payMonthCalc(m);add(m,'Salário',c.sal,'',{descricao:'Salário '+ym});if(c.sub)add(m,'Subsídio',c.sub,'Outro',{descricao:'Subsídio mensal '+ym});if(c.inss)add(m,'Desconto',c.inss,'INSS',{pct:c.pi,base:'sal',descricao:'INSS '+String(c.pi).replace('.',',')+'% sobre '+MT(c.sal)});if(c.irps)add(m,'Desconto',c.irps,'IRPS',{pct:c.pr,base:'liq',descricao:'IRPS '+String(c.pr).replace('.',',')+'% sobre '+MT(c.sal+c.sub-c.inss)})});save();render()}
function payDoc(id){const m=D.drivers.find(x=>x.id==id);if(!m)return;const ym=PY.ym,co=D.co,L=D.payroll.filter(x=>x.motorista==id&&String(x.data).slice(0,7)==ym).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
 const sec=(t,h)=>`<div class="sec"><div class="sh">${t}</div>${h}</div>`,kv=a=>`<table class="kv">${a.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`;
 const tb=(rows)=>rows.length?`<table class="it"><tr><th style="width:24mm">Data</th><th>Descrição</th><th class="r" style="width:36mm">Valor</th></tr>${rows.map(x=>`<tr><td>${fdate(x.data)}</td><td>${esc(x.tipo)}${x.cat?' ('+esc(x.cat)+')':''}${x.descricao?' — '+esc(x.descricao):''}</td><td class="r">${MT2(x.valor)}</td></tr>`).join('')}</table>`:'<p style="color:#666">Sem lançamentos.</p>';
 const R=L.filter(x=>PAYC.includes(x.tipo)),Dd=L.filter(x=>x.tipo=='Desconto'),Pg=L.filter(x=>x.tipo=='Adiantamento'||x.tipo=='Pagamento'),tr=sum(R,x=>x.valor),td=sum(Dd,x=>x.valor),tp=sum(Pg,x=>x.valor),tI=sum(Dd.filter(x=>x.cat=='INSS'),x=>x.valor),tR=sum(Dd.filter(x=>x.cat=='IRPS'),x=>x.valor),tO=td-tI-tR;
 const b=`<div class="subj"><span>ASSUNTO:</span> Recibo de vencimento — ${esc(m.nome)} — ${ym.split('-').reverse().join('/')}</div>`+sec('Motorista',kv([['Nome','<b>'+esc(m.nome)+'</b>'],['Carta / categoria',esc(m.carta||'—')+' · '+esc(m.categoria||'')],['Telefone',esc(m.telefone||'—')]]))+sec('Rendimentos (salário e subsídios)',tb(R))+sec('Descontos (INSS, IRPS e outros)',tb(Dd))+sec('Pagamentos e adiantamentos',tb(Pg))+sec('Resumo',`<div class="tot" style="margin-left:0;width:100%;max-width:300px"><div><span>Rendimentos</span><span>${MT2(tr)}</span></div>${tI?`<div><span>INSS</span><span>− ${MT2(tI)}</span></div>`:''}${tR?`<div><span>IRPS</span><span>− ${MT2(tR)}</span></div>`:''}${tO>.005?`<div><span>${tI||tR?'Outros descontos':'Descontos'}</span><span>− ${MT2(tO)}</span></div>`:''}<div><b>Líquido do mês</b><b>${MT2(tr-td)}</b></div><div><span>Pago no mês</span><span>${MT2(tp)}</span></div><div class="gt"><b>Saldo acumulado</b><b>${MT2(pyBal(id))}</b></div></div>`);
 showDoc(hdr('RECIBO DE VENCIMENTO','RV-'+ym,today())+b,sigH('Pela empresa: '+co.nome,'O motorista: '+m.nome)+`<p class="rod">${esc(co.rodape)}</p>`)}
