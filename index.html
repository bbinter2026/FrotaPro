.paper .tot .gt{border-bottom:none;border-top:2px solid #1a2a9c;margin-top:.2rem;padding-top:.4rem;font-size:1rem}
/* ===== CAMPOS NUMÉRICOS LEGÍVEIS ===== */
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.fc[type=number]{padding-left:.9rem;padding-right:.7rem;min-width:0}
.it .fc{padding:.55rem .6rem;border-radius:12px;font-size:.92rem;min-width:0}
.it input[type=number]{text-align:right}
.it td{padding:.35rem .4rem}
.logo{overflow:hidden;padding:0}.logo img{width:100%;height:100%;object-fit:contain}
#subnav{display:none;margin:.5rem 1rem 0;align-self:flex-start;max-width:calc(100% - 2rem)}#subnav button{padding:.35rem .85rem;font-size:.8rem}
.sup-fab{position:fixed;right:16px;bottom:16px;z-index:150;background:var(--btn);color:#fff;border:1.5px solid var(--border-hi);border-radius:999px;padding:.6rem 1rem;font-weight:700;cursor:pointer;box-shadow:0 0 16px var(--glow);position:fixed}.sup-fab i{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#000;border-radius:99px;font-size:.65rem;padding:1px 5px;font-style:normal}
.sup-panel{position:fixed;right:16px;bottom:68px;z-index:150;width:min(340px,94vw);height:min(460px,70vh);display:none;flex-direction:column;background:#0b1670;border:1.5px solid var(--border-hi);border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(2,8,60,.7)}.sup-panel.open{display:flex}
.sup-head{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:var(--btn)}.sup-head button{background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer}
.sup-tabs{display:flex;gap:4px;padding:.4rem}.sup-tabs button{flex:1;background:var(--bg-input);color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:.35rem;cursor:pointer;font-weight:600}.sup-tabs button.on{background:var(--amber);color:#000}
.sup-chips{display:flex;gap:6px;overflow-x:auto;padding:.4rem}.sup-chips button{flex:0 0 auto;white-space:nowrap;background:var(--bg-input);color:#fff;border:1px solid var(--border);border-radius:99px;padding:.3rem .7rem;font-size:.78rem;cursor:pointer}
.sup-msgs{flex:1;overflow:auto;padding:.7rem;display:flex;flex-direction:column;gap:.5rem}.sup-m{max-width:85%;padding:.5rem .75rem;border-radius:14px;font-size:.85rem;white-space:pre-wrap}.sup-m.b{background:var(--bg-input);align-self:flex-start}.sup-m.u{background:var(--amber);color:#000;align-self:flex-end}
.sup-in{display:flex;gap:6px;padding:.6rem;border-top:1px solid var(--border)}.sup-in input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:99px;color:#fff;padding:.5rem .8rem;font-size:16px}.sup-in button{background:var(--amber);border:0;border-radius:99px;padding:.4rem .9rem;font-weight:700;cursor:pointer}
.sup-wa{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:1rem;text-align:center}.sup-wa img{width:90px}.sup-wa .num{font-size:1.4rem;font-weight:800}.sup-wa a{background:#25d366;color:#000;font-weight:700;text-decoration:none;padding:.6rem 1.2rem;border-radius:99px}
@media print{.sup-fab,.sup-panel{display:none!important}}
#login.on{overflow-y:auto;align-items:flex-start}
.auth-shell{display:flex;gap:1.5rem;align-items:center;justify-content:center;width:100%;max-width:1150px;margin:auto}
.auth-showcase{flex:1 1 560px;background:linear-gradient(145deg,rgba(30,90,200,.45),rgba(24,18,130,.6));border:1.5px solid var(--border);border-radius:var(--r-lg);padding:1.6rem;box-shadow:var(--shadow);color:var(--text)}
#login .md.lg{flex:0 0 380px;width:380px}
.as-badge{display:inline-flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--amber);background:rgba(0,0,0,.25);border:1px solid var(--border);padding:.3rem .8rem;border-radius:99px}.as-badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.as-title{font-size:1.7rem;line-height:1.2;margin:.8rem 0 .4rem}.as-title span{display:block;color:var(--amber)}.as-sub{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem}
.as-card{display:flex;gap:.6rem;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:14px;padding:.6rem .7rem;animation:asin .5s both;animation-delay:calc(var(--i)*40ms)}.as-card b{font-size:.88rem}.as-card p{font-size:.76rem;color:var(--muted);margin-top:.15rem}.as-ico{font-size:1.4rem}
@keyframes asin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.as-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 .6rem}.as-chips span{font-size:.75rem;background:rgba(0,0,0,.25);border:1px solid var(--border);padding:.25rem .65rem;border-radius:99px}
.lic-hint{background:none;border:0;color:var(--amber);font-weight:600;cursor:pointer;text-align:left;font-size:.85rem}
@media(max-width:900px){.auth-shell{flex-direction:column}#login .md.lg{order:-1;flex:none;width:100%;max-width:420px}.auth-showcase{flex:none;width:100%}.as-title{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){.as-card{animation:none}}

<style id="auth-glow-style">
/* ===== Luz a circular no login + luz branca a piscar nas funcionalidades ===== */
@property --glow-a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes glowSpin{to{--glow-a:360deg}}
@keyframes glowBlink{0%,100%{opacity:.18}50%{opacity:.95}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 transparent,0 0 6px -2px var(--glow)}50%{box-shadow:0 0 0 1px var(--glow),0 0 14px -2px var(--glow)}}
:root{--glow-hi:#fff;--blink-c:#fff}
/* anel de luz circulante (cartão de login, botão Entrar e dica de suporte) */
#login .md.lg::before,#login .btn-p.go::before,#login .lic-hint::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--glow-a),transparent 0deg,transparent 245deg,var(--glow) 285deg,var(--amber) 335deg,var(--glow-hi) 354deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:glowSpin 4.5s linear infinite}
/* halo suave desfocado à volta do cartão de login */
#login .md.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:10px;pointer-events:none;z-index:1;opacity:.6;filter:blur(9px);
  background:conic-gradient(from var(--glow-a),transparent 0deg,transparent 245deg,var(--glow) 290deg,var(--amber) 345deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:glowSpin 4.5s linear infinite}
#login .btn-p.go,#login .lic-hint{position:relative}
#login .btn-p.go::before{padding:1.5px;animation-duration:5s}
#login .lic-hint{padding:.45rem .85rem;border-radius:12px}
#login .lic-hint::before{padding:1.5px;opacity:.7;animation-duration:6.5s}
/* funcionalidades: luz branca a piscar suavemente, desfasada de cartão para cartão */
.as-card{position:relative}
.as-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;
  background:var(--blink-c);opacity:.18;filter:drop-shadow(0 0 4px var(--blink-c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:glowBlink 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.45s)}
.as-card:hover::before,.as-card:focus-within::before{opacity:1;animation:none}
/* campos do login: pulsação suave da luz (pára ao escrever) */
#login .fc{animation:glowPulse 3.6s ease-in-out infinite}
#login .fc:focus{animation:none}
@media(prefers-reduced-motion:reduce){
  #login .md.lg::before,#login .md.lg::after,#login .btn-p.go::before,#login .lic-hint::before,.as-card::before,#login .fc{animation:none}
  #login .md.lg::before,#login .btn-p.go::before,#login .lic-hint::before{--glow-a:200deg}
  .as-card::before{opacity:.5}
}
@media print{#login .md.lg::before,#login .md.lg::after,.as-card::before{display:none}}

/* alertas clicáveis */
.al.clk,.cl.clk{cursor:pointer}
.al.clk{transition:.15s}
.al.clk:hover{border-color:var(--border-hi);background:var(--bg-hover);transform:translateX(2px)}
.al.clk:focus-visible{outline:2px solid var(--warn)}
.al .go,.cl .go{font-size:1.3rem;line-height:1;opacity:.75;flex:none;margin-left:.4rem}
.paper .cl.clk:hover{background:#eef3ff}
tr.hl td{animation:hlf 1s ease-in-out 3}
.card.hl{animation:hlc 1s ease-in-out 3}
@keyframes hlf{0%,100%{background-color:transparent}50%{background-color:rgba(255,210,77,.38)}}
@keyframes hlc{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 3px var(--warn)}}
@media print{.go,.alhint{display:none}}
/* ---- crédito do programador (BBS Internet Cafe) ---- */
.devby{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:2rem auto 4.5rem;padding:.4rem 1rem;font-size:.72rem;line-height:1.25;color:var(--muted);text-align:left}
.devby img,.as-dev img{height:44px;width:auto;display:block;flex:none;filter:drop-shadow(0 1px 4px rgba(2,6,50,.55))}
.devby span,.as-dev span{display:block}
.devby b,.as-dev b{display:block;color:var(--text);font-size:.85rem;letter-spacing:.4px}
.as-dev{display:flex;align-items:center;gap:.8rem;margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted)}
.as-dev img{height:52px}
#licgate .devby{margin:1.1rem auto 0;padding:.6rem 0 0;border-top:1px solid var(--border)}
@media print{.devby,.as-dev{display:none!important}}
/* ---- faixa panorâmica (estrada + camiões) ---- */
.roadband{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:0;pointer-events:none;color:#5ee6ff;opacity:.16;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent)}
.roadband svg{width:100%;height:100%;display:block}
main{position:relative;z-index:1}
@media(max-width:640px){.roadband{height:120px}}
@media(max-height:520px){.roadband{display:none}}
@media print{.roadband{display:none!important}}
</style>
<style id="extra-css">
/* ===== Login e licenças: sem scroll nem "puxar para baixo" ===== */
html:has(#login.on),body:has(#login.on),html:has(#licgate.on),body:has(#licgate.on){overflow:hidden!important;overscroll-behavior:none!important}
#login.on{overflow:hidden!important;align-items:center!important;overscroll-behavior:none}
#licgate{overflow:hidden;overscroll-behavior:none}
#licgate .md{overflow:hidden;max-height:none}
.lg-logo{display:block;margin:-.4rem auto .5rem;height:clamp(64px,15vh,128px);width:auto;border-radius:20px;filter:drop-shadow(0 4px 14px rgba(2,6,50,.55))}
#licgate .lg-logo{margin:0 auto;height:clamp(64px,17vh,120px)}
#licgate .mb{gap:.7rem}
@media(max-height:820px){.as-card p,.as-sub{display:none}.lg h2{font-size:1.6rem;margin-bottom:.8rem}#login .md.lg{padding:1.3rem 1.6rem 1.2rem}}
@media(max-height:640px){#licgate .devby,#licgate .lsup{display:none}.lg .row{margin-bottom:.8rem}}
@media(max-width:900px){#login .as-grid,#login .as-chips,#login .as-sub,#login .as-title{display:none}#login .auth-showcase{padding:.7rem 1rem}#login .auth-shell{gap:.8rem}.as-dev{margin-top:.5rem;padding-top:.5rem}.as-dev img{height:34px}}
@media(max-width:900px) and (max-height:680px){#login .auth-showcase{display:none}}
/* ===== Seletor de idioma (segmentado) ===== */
.langsw{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(6,10,70,.65);border:1.5px solid var(--border-hi);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.langsw .lgi{font-size:.9rem;padding:0 .35rem 0 .45rem;opacity:.9}
.langsw button{border:0;background:transparent;color:#d3e2ff;font:800 .72rem/1 system-ui,sans-serif;letter-spacing:.8px;padding:.38rem .6rem;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.langsw button:hover{color:#fff}
.langsw button.on{background:var(--btn);color:#fff;box-shadow:0 0 10px var(--glow)}
/* ===== Página fixa: sem scroll nem "puxar" do documento (só o conteúdo interno de main desliza) ===== */
@media screen{html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}main{overscroll-behavior:none;-webkit-overflow-scrolling:touch}}
/* ===== Seletor de idioma: aparece só uma vez (no cabeçalho; no ecrã de login usa o flutuante) ===== */
#langbtn2{display:none}
body:has(#login.on) #langbtn2,body:has(#licgate.on) #langbtn2{display:inline-flex}
body:has(#login.on) #langbtn,body:has(#licgate.on) #langbtn{display:none}
/* ===== Sem "puxar para baixo" em nenhuma aba, janela ou lista ===== */
main,.md,#doc,.mo,nav,#subnav,.tw,.sup-msgs,.sup-chips{overscroll-behavior:none}
.mf{flex-wrap:wrap}
/* ===== Painel compacto ===== */
.kpis{grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:.5rem;margin-bottom:.75rem}
.kpi.ic{display:flex;align-items:center;gap:.5rem;padding:.5rem .65rem .5rem .8rem;border-radius:14px;min-width:0}
.kpi.ic .ki{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-style:normal;background:rgba(255,255,255,.1);border:1px solid var(--border)}
.kpi.ic div{min-width:0}
.kpi.ic span{display:block;font-size:.64rem;letter-spacing:.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.ic b{font-size:1.05rem;margin-top:.05rem;line-height:1.15;overflow-wrap:anywhere}
.kpi.ic:after{width:3px}
header{padding:.4rem .75rem;min-height:52px;gap:.5rem}
header>div:last-child{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
#syncbtn{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.card{padding:1rem;margin-bottom:.9rem}}
</style>

 ov.innerHTML=`<div class="md" style="max-width:900px;height:92%;display:flex;flex-direction:column"><div class="mh"><span>🗺️ ${esc(t.origem)} → ${esc(t.destino)}</span><button class="btn btn-s sm" onclick="mapClose()">✕</button></div><div id="mapbox" style="flex:1;min-height:280px;position:relative;z-index:0;isolation:isolate"></div><div style="padding:.7rem 1.2rem;font-size:.8rem;color:var(--muted);line-height:1.5"><span style="color:#f59e0b">━━</span> Ida ${t.kmIda?(+t.kmIda).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))+' km':''}${t.fonteI=='manual'||t.fonteI=='estim'?' (distância estimada/manual; traçado indicativo)':''} ${t.geomV?'&nbsp; <span style="color:#b8c0ff">╍╍</span> Regresso '+(t.kmVolta?(+t.kmVolta).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))+' km':''):''}<br>Rota para automóvel (OSRM), traçado simplificado. Mapa © OpenStreetMap contributors.</div></div>`;
 ov.classList.add('on');
 loadLeaflet().then(()=>{
  const map=L.map('mapbox');MAPOBJ=map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  const ll=g=>g.map(p=>[p[1],p[0]]),all=[];
  if(t.geomI){L.polyline(ll(t.geomI),{color:'#38d5ff',weight:5,opacity:.9}).addTo(map);all.push(...ll(t.geomI))}
  if(t.geomV){L.polyline(ll(t.geomV),{color:'#9aa5ff',weight:4,opacity:.9,dashArray:'8 8'}).addTo(map);all.push(...ll(t.geomV))}
  [[t.coordO,'#10b981','Partida'],[t.coordD,'#ef4444','Destino']].forEach(([c,col,lb])=>{if(c){L.circleMarker([c.lat,c.lon],{radius:9,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).addTo(map).bindTooltip(lb+': '+c.nome);all.push([c.lat,c.lon])}});
  if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[30,30]});else map.setView([-18,35],5);
  setTimeout(()=>map.invalidateSize(),200)
 }).catch(e=>{$('#mapbox').innerHTML='<div class="empty">'+esc(e.message)+'</div>'})}

<script>
(function(){
const RULES=[
 [/＋|➕|Nova viagem|Novo /i,'new'],
 [/💾|^\s*OK\s*$|Entrar/,'save'],
 [/🗑|✖|Rejeitar|Repor/,'del'],
 [/✔|Aprovar/,'ok'],
 [/✏️|Registar regresso/,'edit'],
 [/🖨|Imprimir|PDF/,'print'],
 [/⬇|📥|CSV|Exportar|Exemplo/,'exp'],
 [/🗺/,'map'],[/📲/,'pay'],[/📎/,'exp'],
 [/🧾|factura/i,'inv'],
 [/📋|Cotar|cotação/i,'quote'],
 [/🔧|Manuten/,'fix'],
 [/⛽|Abastec/,'fuel'],
 [/💵|recebimento/i,'pay'],
 [/🧹|Limpar/,'clean'],
 [/🔔/,'bell']
];
function paint(root){
 (root||document).querySelectorAll('.btn:not([data-c])').forEach(b=>{
  if(b.id==='me'||/^\s*(✕|Cancelar|✕ Fechar)\s*$/.test(b.textContent)||b.textContent.trim()==='✕ Fechar')return;
  const t=b.textContent+' '+(b.title||'');
  if(b.classList.contains('btn-s')&&!/[＋➕🗑✖🖨⬇📥🗺🧾📋🔧⛽💵🧹🔔✏️]/.test(t))return;
  for(const [re,c] of RULES){if(re.test(t)){b.dataset.c=c;return}}
 });
}
let q=0;const mo=new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;paint()})});
mo.observe(document.body,{childList:true,subtree:true});
paint();
})();
</script>

<script>
/* ===== GESTÃO+ ===== */
const PL={by:'veiculo',pr:{km:'',veic:'',margem:20,port:0,aj:0,vazio:true}};
const planLeft=(pl,v)=>(+pl.ultimo||0)+(+pl.cada||0)-(+v.km||0);
const tripRec=t=>(+t.receita||0)+(t.regresso=='Com carga'?(+t.receitaReg||0):0);
function tripCost(t){const f=D.fuel.filter(x=>x.viagem==t.id),e=D.expenses.filter(x=>x.viagem==t.id),py=(D.payroll||[]).filter(x=>x.viagem==t.id&&PAYC.includes(x.tipo)),pv=sum(py,x=>x.valor);if(f.length||e.length)return{v:sum(f,x=>x.litros*x.preco)+sum(e,x=>x.valor)+pv,est:false};if(py.length){if(t.est){const aj=py.some(x=>x.tipo=='Diárias')?(+t.est.ajud||0):0;return{v:Math.max(0,(+t.est.custo||0)-aj)+pv,est:true}}return{v:pv,est:false}}return{v:t.est?+t.est.custo||0:0,est:!!t.est}}
const kpi=(l,v,c)=>`<div class="kpi ${c||''}"><span>${l}</span><b>${v}</b></div>`;
function plusView(){
 const open=D.invoices.filter(i=>tot(i)-pago(i)>.005),falta=sum(open,i=>tot(i)-pago(i)),venc=open.filter(i=>days(i.vencimento)<0),vv=sum(venc,i=>tot(i)-pago(i));
 const lb=D.co.lastBackup,dd=lb?-days(lb):null;
 return`<div class="kpis">${kpi('A receber',MT(falta),'i')}${kpi('Vencido',MT(vv),vv?'r':'g')}${kpi('Última cópia',lb?fdate(lb):'nunca',dd===null||dd>=7?'r':'g')}</div>
 <div class="card"><div class="ct"><span>💵 Contas a receber</span></div>${arView(open)}</div>
 <div class="card"><div class="ct"><span>📈 Rentabilidade</span><span style="display:flex;gap:.4rem">${[['veiculo','Camião'],['motorista','Motorista'],['cliente','Cliente']].map(([k,l])=>`<button class="btn ${PL.by==k?'btn-p':'btn-s'} sm" onclick="PL.by='${k}';render()">${l}</button>`).join('')}</span></div>${rentView()}</div>
 <div class="grid2"><div class="card"><div class="ct">🧮 Preço sugerido do frete</div>${priceView()}</div>
 <div class="card"><div class="ct">⛽ Consumo real vs previsto</div>${consView()}</div></div>
 <div class="card"><div class="ct">🔧 Manutenção por quilometragem e pneus</div>${planView()}</div>
 <div class="card" id="bk-card"><div class="ct">💾 Cópia de segurança</div><p style="color:var(--muted);font-size:.85rem;margin-bottom:.8rem">Os dados ficam só neste dispositivo. No telemóvel, o botão abre a partilha (Google Drive, WhatsApp, email); no computador descarrega o ficheiro.</p><button class="btn btn-s" onclick="backupNow()">⬇ Exportar cópia agora</button></div>`}
function arView(open){
 const B=[['A vencer',0],['1–30 dias',0],['31–60 dias',0],['+60 dias',0]];
 open.forEach(i=>{const d=-days(i.vencimento),k=d<=0?0:d<=30?1:d<=60?2:3;B[k][1]+=tot(i)-pago(i)});
 const rows=D.clients.map(c=>{const inv=open.filter(i=>i.cliente==c.id);const venc=inv.filter(i=>days(i.vencimento)<0);return{c,f:sum(inv,i=>tot(i)-pago(i)),v:sum(venc,i=>tot(i)-pago(i)),d:venc.length?Math.max(...venc.map(i=>-days(i.vencimento))):0}}).filter(x=>x.f>0).sort((a,b)=>b.d-a.d||b.f-a.f);
 return`<div class="kpis">${B.map((b,i)=>kpi(b[0],MT(b[1]),i==0?'i':i==1?'':'r')).join('')}</div>`+(rows.length?`<div class="tw"><table><tr><th>Cliente</th><th>Em falta</th><th>Vencido</th><th>Atraso máx.</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.c.nome)}</td><td>${MT(x.f)}</td><td>${x.v?'<span class="pill s-bad">'+MT(x.v)+'</span>':'—'}</td><td>${x.d?x.d+' dias':'—'}</td><td><button class="btn btn-s sm" onclick="waCobr('${x.c.id}')">📲 Cobrar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Sem facturas por receber. ✅</div>')}
function waCobr(id){const c=D.clients.find(x=>x.id==id);if(!c)return;let ph=String(c.telefone||'').replace(/\D/g,'');if(!ph)return alert('Este cliente não tem telefone registado.');if(ph.length==9&&ph[0]=='8')ph='258'+ph;
 const inv=D.invoices.filter(i=>i.cliente==id&&tot(i)-pago(i)>.005&&days(i.vencimento)<0);const L=inv.length?inv:D.invoices.filter(i=>i.cliente==id&&tot(i)-pago(i)>.005);
 const m=`Bom dia, ${c.nome}. Lembramos que a(s) seguinte(s) factura(s) da ${D.co.nome} se encontram por regularizar:\n`+L.map(i=>`• ${i.numero}: ${MT2(tot(i)-pago(i))} (venc. ${fdate(i.vencimento)})`).join('\n')+`\nTotal: ${MT2(sum(L,i=>tot(i)-pago(i)))}.\n`+(D.co.nib?`Pagamento: ${D.co.banco||''} NIB ${D.co.nib}${D.co.mpesa?' · M-Pesa/e-Mola '+D.co.mpesa:''}\n`:'')+'Obrigado.';
 window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(m),'_blank')}
function rentView(){
 const K={};D.trips.filter(t=>t.estado!='Cancelada').forEach(t=>{const id=t[PL.by]||'?',c=tripCost(t);const o=K[id]||(K[id]={n:0,r:0,c:0,e:0});o.n++;o.r+=tripRec(t);o.c+=c.v;if(c.est)o.e++});
 const col={veiculo:'vehicles',motorista:'drivers',cliente:'clients'}[PL.by];
 const R=Object.entries(K).map(([id,o])=>({nome:id=='?'?'—':ref(col,id),...o,l:o.r-o.c})).sort((a,b)=>b.l-a.l);
 return R.length?`<div class="tw"><table><tr><th>${{veiculo:'Camião',motorista:'Motorista',cliente:'Cliente'}[PL.by]}</th><th>Viagens</th><th>Receita</th><th>Custos</th><th>Lucro</th><th>Margem</th></tr>${R.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.n}</td><td>${MT(x.r)}</td><td>${MT(x.c)}${x.e?' <span class="pill s-warn" title="'+x.e+' viagem(ns) sem despesas reais: usa o custo estimado">est.</span>':''}</td><td><span style="color:var(--${x.l>=0?'ok':'danger'})">${MT(x.l)}</span></td><td>${x.r?pill2(x.l/x.r*100,10):'—'}</td></tr>`).join('')}</table></div><div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">Custos = abastecimentos, despesas, diárias, comissões e bónus reais associados à viagem; "est." indica que, sem registos reais, se usou o custo estimado.</div>`:'<div class="empty">Ainda sem viagens.</div>'}
function priceView(){const P=PL.pr,vs=D.vehicles;if(!P.veic&&vs[0])P.veic=vs[0].id;
 const inp=(k,l,t)=>`<div><label>${l}</label><input class="fc" type="number" min="0" step="any" value="${P[k]}" oninput="PL.pr.${k}=this.value;prCalc()"></div>`;
 setTimeout(prCalc,0);
 return`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin-bottom:.7rem"><div><label>Camião</label><select class="fc" onchange="PL.pr.veic=this.value;prCalc()">${vs.map(v=>`<option value="${v.id}" ${v.id==P.veic?'selected':''}>${esc(v.matricula)}</option>`).join('')}</select></div>${inp('km','Distância ida (km)')}${inp('port','Portagens (MT)')}${inp('aj','Ajudas (MT)')}${inp('margem','Margem (%)')}</div><label style="display:flex;gap:.5rem;text-transform:none;margin-bottom:.7rem;font-size:.85rem"><input type="checkbox" ${P.vazio?'checked':''} onchange="PL.pr.vazio=this.checked;prCalc()"> Regresso sem carga (conta o km de volta)</label><div id="pr_out"></div>`}
function prCalc(){const o=$('#pr_out');if(!o)return;const P=PL.pr,km=(+P.km||0)*(P.vazio?2:1),cons=consOf(P.veic),pr=precoComb(P.veic),m=Math.min(90,+P.margem||0);
 if(!km){o.innerHTML='<div class="empty">Indique a distância.</div>';return}
 const comb=km*cons/100*pr,dg=km*(+D.co.desg||0),c=comb+dg+(+P.port||0)+(+P.aj||0),preco=c/(1-m/100),iva=preco*(+D.co.iva||0)/100;
 o.innerHTML=`<div class="tw"><table><tr><td>⛽ Combustível (${Math.round(km*cons/100)} L)</td><td style="text-align:right">${MT(comb)}</td></tr><tr><td>Desgaste + portagens + ajudas</td><td style="text-align:right">${MT(dg+(+P.port||0)+(+P.aj||0))}</td></tr><tr><td><b>Custo estimado</b></td><td style="text-align:right"><b>${MT(c)}</b></td></tr><tr><td><b>Frete sugerido (margem ${m}%)</b></td><td style="text-align:right"><b style="color:var(--amber)">${MT(preco)}</b></td></tr><tr><td>Com IVA (${D.co.iva||0}%)</td><td style="text-align:right">${MT(preco+iva)}</td></tr></table></div>`}
function consView(){
 const R=D.vehicles.map(v=>{const f=D.fuel.filter(x=>x.veiculo==v.id&&+x.km>0).sort((a,b)=>a.km-b.km);if(f.length<2)return null;const span=f[f.length-1].km-f[0].km;if(span<=0)return null;const real=sum(f.slice(1),x=>x.litros)/span*100,ref=consOf(v.id);return{v,real,ref,d:(real-ref)/ref*100}}).filter(Boolean);
 return R.length?`<div class="tw"><table style="min-width:0"><tr><th>Camião</th><th>Real</th><th>Previsto</th><th>Desvio</th></tr>${R.map(x=>`<tr><td>${esc(x.v.matricula)}</td><td>${x.real.toFixed(1)}</td><td>${x.ref}</td><td><span class="pill s-${x.d>15?'bad':x.d>5?'warn':'ok'}">${x.d>0?'+':''}${x.d.toFixed(1)}%</span></td></tr>`).join('')}</table></div><div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">L/100 km calculados a partir dos abastecimentos. Desvio acima de 15% merece verificação (fugas, desvios, condução).</div>`:'<div class="empty">São precisos pelo menos 2 abastecimentos com odómetro por camião.</div>'}
function planView(){
 const vs=D.vehicles,items=['Óleo e filtros','Pneus','Travões','Correia/transmissão','Revisão geral','Outro'];
 const L=(D.plans||[]).map(pl=>{const v=vs.find(x=>x.id==pl.veiculo);return v?{pl,v,r:planLeft(pl,v)}:null}).filter(Boolean).sort((a,b)=>a.r-b.r);
 return`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:.9rem"><select class="fc" id="pl_v">${vs.map(v=>`<option value="${v.id}">${esc(v.matricula)} · ${(+v.km||0).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))} km</option>`).join('')}</select><select class="fc" id="pl_i">${items.map(i=>`<option>${i}</option>`).join('')}</select><input class="fc" id="pl_d" placeholder="Detalhe (ex.: pneus dianteiros)"><input class="fc" id="pl_c" type="number" min="1" placeholder="Cada (km)"><input class="fc" id="pl_u" type="number" min="0" placeholder="Último feito aos (km)"><button class="btn btn-p" onclick="planAdd()">＋ Adicionar plano</button></div>`+(L.length?`<div class="tw"><table><tr><th>Camião</th><th>Item</th><th>Cada</th><th>Próximo aos</th><th>Falta</th><th></th></tr>${L.map(({pl,v,r})=>`<tr data-k="plans:${pl.id}"><td>${esc(v.matricula)}</td><td>${esc(pl.item)}${pl.det?' <span style="color:var(--muted)">· '+esc(pl.det)+'</span>':''}</td><td>${(+pl.cada).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))} km</td><td>${((+pl.ultimo||0)+(+pl.cada)).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))} km</td><td><span class="pill s-${r<0?'bad':r<=1000?'warn':'ok'}">${r<0?'atrasado '+(-r).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))+' km':r.toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))+' km'}</span></td><td style="white-space:nowrap"><button class="btn btn-p sm" title="Marcar como feito ao km atual" onclick="planDone('${pl.id}')">✔ Feito</button> <button class="btn btn-d sm" onclick="planDel('${pl.id}')">🗑️</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Sem planos. Adicione acima: o app avisa nos Alertas 1000 km antes.</div>')}
function planAdd(){const v=$('#pl_v').value,cada=+$('#pl_c').value;if(!v||!(cada>0))return alert('Escolha o camião e indique o intervalo em km.');const ve=D.vehicles.find(x=>x.id==v);const u=$('#pl_u').value;D.plans.push({id:uid(),veiculo:v,item:$('#pl_i').value,det:$('#pl_d').value.trim(),cada,ultimo:u===''?(+ve.km||0):+u});save();render()}
async function planDone(id){const pl=D.plans.find(x=>x.id==id),v=pl&&D.vehicles.find(x=>x.id==pl.veiculo);if(!v)return;if(!await ask('Marcar "'+pl.item+'" como feito aos '+(+v.km||0).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'))+' km (km atual do camião)?'))return;pl.ultimo=+v.km||0;save();render()}
async function planDel(id){if(!await ask('Remover este plano?'))return;D.plans=D.plans.filter(x=>x.id!=id);save();render()}

 try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cópia FrotaPro'});render();return}}catch(e){if(e&&e.name=='AbortError')return}
 dl(txt,name,'application/json');render()}

function eqCur(c,r){if(c!='quotes'&&c!='invoices')return'';const t=tot(r),u=+D.co.usd,z=+D.co.zar;if(!u&&!z)return'';return`<p style="font-size:.8rem;margin-top:.6rem">Valor equivalente: ${[u&&curK()!='USD'?(t/u).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'),{minimumFractionDigits:2,maximumFractionDigits:2})+' USD (1 USD = '+u+' '+CS()+')':'',z&&curK()!='ZAR'?(t/z).toLocaleString((window.LANG=='en'?'en-GB':'pt-PT'),{minimumFractionDigits:2,maximumFractionDigits:2})+' ZAR (1 ZAR = '+z+' '+CS()+')':''].filter(Boolean).join(' · ')}</p>`}
/* partilha WhatsApp */
function shareDoc(){const pp=document.querySelector('#doc .paper');if(!pp)return;const t=pp.innerText.replace(/\n{3,}/g,'\n\n').slice(0,1500)+'\n\n(PDF disponível a pedido)';if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
/* fotos de talões */
const PH={cur:''};
function photoUI(r){PH.cur=r.foto||'';$('#mbody').insertAdjacentHTML('beforeend',`<div style="grid-column:1/-1"><label>📎 Foto do talão / recibo (opcional)</label><input class="fc" type="file" accept="image/*" capture="environment" onchange="photoPick(this)"><div id="ph_p" style="margin-top:.5rem"></div></div>`);photoShow()}

function fotoView(c,id){const r=D[c].find(x=>x.id==id);if(!r||!r.foto)return;const d=$('#dlg');d.innerHTML=`<div class="md" style="max-width:520px"><div class="mh"><span>📎 Talão</span><button class="btn btn-s sm" onclick="$('#dlg').classList.remove('on')">✕</button></div><div class="mb" style="grid-template-columns:1fr;text-align:center"><img src="${r.foto}" style="max-width:100%;border-radius:12px"></div></div>`;d.classList.add('on')}

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

<script>
/* ===== ITENS MÚLTIPLOS EM COTAÇÕES / FACTURAS ===== */
let IT=[],ITR=0,ITI=false;
function itemsInit(r){ITI=r.incl!==undefined?r.incl===true:(cur&&cur.id?false:D.co.ivaIncl=='sim');ITR=Array.isArray(r.itens)&&r.itens.length?+r.itens[0].i||0:(r.iva!=null&&r.iva!==''?+r.iva:+D.co.iva||0);IT=Array.isArray(r.itens)&&r.itens.length?r.itens.map(x=>({d:x.d||'',q:x.q,p:x.p})):[{d:r.descricao||'',q:r.qtd||1,p:r.punit??''}];itemsUI()}
function itemsUI(){const e=$('#it_box');if(!e)return;const imp=D.co.impostoNome||'IVA';
 e.innerHTML=`<div class="tw it"><table style="min-width:620px"><tr><th>Descrição</th><th style="width:90px">Qtd</th><th style="width:140px">Preço unit. (MT${ITI?', c/ imposto':''})</th><th style="width:130px;text-align:right">Total</th><th style="width:44px"></th></tr>${IT.map((x,n)=>`<tr><td><input class="fc" value="${esc(x.d)}" placeholder="Serviço / descrição" oninput="itSet(${n},'d',this.value)"></td><td><input class="fc" type="number" min="0" step="any" value="${esc(x.q)}" oninput="itSet(${n},'q',this.value)"></td><td><input class="fc" type="number" min="0" step="any" value="${esc(x.p)}" oninput="itSet(${n},'p',this.value)"></td><td id="it_t${n}" style="text-align:right;white-space:nowrap">${MT2((+x.q||0)*(+x.p||0))}</td><td><button type="button" class="btn btn-d sm" title="Remover item" onclick="itDel(${n})">🗑️</button></td></tr>`).join('')}</table></div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-top:.6rem"><div><button type="button" class="btn btn-p sm" onclick="itAdd()">＋ Adicionar item</button><div style="font-size:.75rem;color:var(--muted);margin-top:.5rem">${imp} de ${String(ITR).replace('.',',')}%, definido em Empresa → Definições.<label style="display:flex;gap:.4rem;align-items:center;text-transform:none;margin-top:.3rem;font-size:.78rem"><input type="checkbox" ${ITI?'checked':''} onchange="ITI=this.checked;itemsUI()"> Os preços unitários já incluem o imposto</label>${ITR!=(+D.co.iva||0)?' <button type="button" class="btn btn-s sm" onclick="ITR=+D.co.iva||0;itemsUI()">Usar taxa atual ('+(+D.co.iva||0)+'%)</button>':''}</div></div><div id="it_sum" style="min-width:240px;font-size:.88rem"></div></div>`;itSum()}
function itSet(n,k,v){IT[n][k]=k=='d'?v:(v===''?'':+v);const t=$('#it_t'+n);if(t)t.textContent=MT2((+IT[n].q||0)*(+IT[n].p||0));itSum()}
function itSum(){const e=$('#it_sum');if(!e)return;const imp=D.co.impostoNome||'IVA',g=IT.reduce((s,x)=>s+(+x.q||0)*(+x.p||0),0),b=ITI?g/(1+ITR/100):g,v=ITI?g-b:g*ITR/100,row=(a,c,st)=>`<div style="display:flex;justify-content:space-between;${st||''}"><span>${a}</span><span>${c}</span></div>`;
 e.innerHTML=row('Subtotal',MT2(b))+row(imp+' ('+String(ITR).replace('.',',')+'%)',MT2(v))+row('TOTAL',MT2(b+v),'font-weight:800;font-size:1rem;color:var(--amber);border-top:1px solid var(--border);padding-top:.3rem;margin-top:.2rem')}
function itAdd(){IT.push({d:'',q:1,p:''});itemsUI();const r=document.querySelectorAll('#it_box tr');const l=r[r.length-1];if(l)l.querySelector('input').focus()}
function itDel(n){if(IT.length<=1)return alert('O documento precisa de pelo menos um item.');IT.splice(n,1);itemsUI()}
function itemsCollect(){const L=IT.filter(x=>String(x.d).trim()).map(x=>({d:String(x.d).trim(),q:+x.q||0,p:+x.p||0,i:ITR}));if(!L.length)return null;
 return{itens:L,descricao:L[0].d+(L.length>1?' (+'+(L.length-1)+' item'+(L.length>2?'s':'')+')':''),qtd:L[0].q,punit:L[0].p,iva:ITR,incl:ITI}}
</script>

<script>
/* ===== PAGAMENTOS A MOTORISTAS ===== */
const PAYC=['Salário','Subsídio','Diárias','Comissão','Bónus'];
const PAYT=['Salário','Subsídio','Diárias','Comissão','Bónus','Desconto','Adiantamento','Pagamento'];
const PYCAT={'Desconto':['INSS','IRPS','Multa','Faltas','Outro'],'Subsídio':['Alimentação','Transporte','Risco','Alojamento','Outro']};
const pyLegal=x=>x.tipo=='Desconto'&&(x.cat=='INSS'||x.cat=='IRPS');
const PYBASE=[['sal','Salário base do motorista'],['bruto','Rendimentos do mês (salário, subsídios, etc.)'],['liq','Rendimentos do mês após INSS']];
function payBase(mid,d,k){const m=D.drivers.find(x=>x.id==mid);if(!m)return 0;if(k=='sal')return +m.salario||0;const ym=String(d||'').slice(0,7),L=(D.payroll||[]).filter(x=>x.motorista==mid&&String(x.data).slice(0,7)==ym),g=sum(L.filter(x=>PAYC.includes(x.tipo)),x=>x.valor);return k=='liq'?g-sum(L.filter(x=>x.tipo=='Desconto'&&x.cat=='INSS'),x=>x.valor):g}
function payUi(){const g=i=>document.querySelector('#'+i);if(!g('pay_t'))return;const t=g('pay_t').value,cs=PYCAT[t],cw=g('pay_cw'),pc=g('pay_c');
 if(cs){const cur=pc.value;pc.innerHTML=cs.map(c=>`<option ${c==cur?'selected':''}>${c}</option>`).join('');cw.style.display=''}else{pc.innerHTML='';cw.style.display='none'}
 const pct=g('pay_u').value=='%';g('pay_bw').style.display=pct?'':'none';g('pay_vl').textContent=pct?'Percentagem (%)':'Valor (MT)';
 const v=+g('pay_v').value||0,pv=g('pay_pv');if(pct&&v>0){const b=payBase(g('pay_m').value,g('pay_d').value,g('pay_b').value);pv.textContent=b>0?`${v}% de ${MT2(b)} = ${MT2(b*v/100)}`:'A base escolhida está a zero para este motorista/mês.'}else pv.textContent=''}
const PY={f:'',ym:today().slice(0,7),tab:'rec'};
const pyDelta=x=>PAYC.includes(x.tipo)?+x.valor:-(+x.valor);
const pyBal=id=>sum((D.payroll||[]).filter(x=>x.motorista==id),pyDelta);
const pyOpt=(a,sel)=>a.map(x=>`<option value="${x[0]}" ${x[0]==sel?'selected':''}>${esc(x[1])}</option>`).join('');
function payView0(){
 const P=D.payroll||[],ym=PY.ym,mes=P.filter(x=>String(x.data).slice(0,7)==ym);
 const aPagar=sum(D.drivers,m=>Math.max(0,pyBal(m.id))),pagoM=sum(mes.filter(x=>x.tipo=='Adiantamento'||x.tipo=='Pagamento'),x=>x.valor),custoM=sum(mes,x=>PAYC.includes(x.tipo)?x.valor:x.tipo=='Desconto'&&!pyLegal(x)?-x.valor:0);
 const ds=D.drivers.map(m=>({m,rec:sum(P.filter(x=>x.motorista==m.id),x=>PAYC.includes(x.tipo)?x.valor:x.tipo=='Desconto'?-x.valor:0),pg:sum(P.filter(x=>x.motorista==m.id&&(x.tipo=='Adiantamento'||x.tipo=='Pagamento')),x=>x.valor),b:pyBal(m.id)}));
 const pend=(pp=>pp.length?`<div class="card" id="py-pend"><div class="ct"><span>⏳ Viagens concluídas por lançar</span><span class="pill s-warn">${pp.length}</span></div><div class="tw"><table><tr><th>Viagem</th><th>Motorista</th><th>Tipo</th><th style="text-align:right">Valor</th><th></th></tr>${pp.map(({t,k,r})=>`<tr><td>${esc(t.origem+' → '+t.destino+' ('+fdate(t.saida)+')')}</td><td>${esc(r.m.nome)}</td><td>${r.tipo}</td><td style="text-align:right;white-space:nowrap" title="${esc(r.desc)}">${MT2(r.valor)}</td><td><button class="btn btn-p sm" onclick="payAuto('${t.id}','${k}')">＋ Lançar</button></td></tr>`).join('')}</table></div><div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">Diárias = dias da viagem × diária do motorista (ou a da empresa). Comissão = % do frete ou valor fixo da ficha. Pode lançar agora ou no fim do mês — a data fica a da chegada.</div></div>`:'')(pyPending());
 const hist=P.filter(x=>(!PY.f||x.motorista==PY.f)).sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,150);
 const trips=D.trips.filter(t=>t.estado!='Cancelada').sort((a,b)=>String(b.saida).localeCompare(String(a.saida)));
 return`<div class="kpis">${kpi('Total a pagar',MT(aPagar),aPagar?'r':'g')}${kpi('Custo com motoristas ('+ym+')',MT(custoM),'i')}${kpi('Pago no mês',MT(pagoM),'g')}${kpi('Adiantamentos por abater',MT(sum(D.drivers,m=>Math.max(0,-pyBal(m.id)))),'r')}</div>
  ${pend}
 <div class="card"><div class="ct"><span>🧑‍✈️ Conta corrente dos motoristas</span><span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><input class="fc" type="month" style="width:auto" value="${ym}" onchange="PY.ym=this.value||PY.ym;render()"><button class="btn btn-p sm" onclick="payGenMonth()">＋ Gerar salários do mês</button></span></div>
 ${ds.length?`<div class="tw"><table><tr><th>Motorista</th><th>Salário base</th><th>Diária</th><th>Devido (total)</th><th>Pago</th><th>Saldo</th><th></th></tr>${ds.map(({m,rec,pg,b})=>`<tr data-k="pyrow:${m.id}"><td>${esc(m.nome)}</td><td>${m.salario?MT(m.salario):'—'}</td><td>${MT(+m.diaria||+D.co.diaria||0)}</td><td>${MT(rec)}</td><td>${MT(pg)}</td><td><span class="pill s-${b>0?'warn':b<0?'bad':'ok'}">${b>0?MT(b)+' a pagar':b<0?MT(-b)+' a abater':'Regularizado'}</span></td><td style="white-space:nowrap"><button class="btn btn-p sm" onclick="payPre('${m.id}')">＋ Lançar</button> <button class="btn btn-s sm" onclick="payDoc('${m.id}')">🧾 Recibo</button> ${b>0?`<button class="btn btn-s sm" onclick="payPaySaldo('${m.id}')">💵 Pagar saldo</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">Registe motoristas primeiro.</div>'}
 <div style="font-size:.76rem;color:var(--muted);margin-top:.5rem">Devido = salário + subsídios + diárias + comissões + bónus − descontos (INSS, IRPS, multas, faltas…). Saldo = devido − pagamentos e adiantamentos.</div></div>
 <div class="card"><div class="ct">＋ Novo lançamento</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem">
 <div><label>Motorista</label><select class="fc" id="pay_m" onchange="payUi()">${pyOpt(D.drivers.map(m=>[m.id,m.nome]))}</select></div>
 <div><label>Tipo</label><select class="fc" id="pay_t" onchange="payUi()">${PAYT.map(t=>`<option>${t}</option>`).join('')}</select></div>
 <div><label>Data</label><input class="fc" type="date" id="pay_d" value="${today()}" onchange="payUi()"></div>
 <div id="pay_cw" style="display:none"><label>Categoria</label><select class="fc" id="pay_c"></select></div>
  <div><label>Valor em</label><select class="fc" id="pay_u" onchange="payUi()"><option value="MT">Valor fixo (MT)</option><option value="%">Percentagem (%)</option></select></div>
  <div id="pay_bw" style="display:none"><label>Percentagem sobre</label><select class="fc" id="pay_b" onchange="payUi()">${pyOpt(PYBASE)}</select></div>
  <div><label id="pay_vl">Valor (MT)</label><input class="fc" type="number" min="0" step="any" id="pay_v" oninput="payUi()"><div id="pay_pv" style="font-size:.75rem;color:var(--muted);margin-top:.25rem"></div></div>
 <div><label>Viagem (opcional)</label><select class="fc" id="pay_vi"><option value="">—</option>${trips.map(t=>`<option value="${t.id}">${esc(t.origem+' → '+t.destino+' ('+fdate(t.saida)+')')}</option>`).join('')}</select></div>
 <div style="grid-column:1/-1"><label>Descrição</label><input class="fc" id="pay_o" placeholder="Ex.: Salário de ${ym}, adiantamento, multa… (vazio = automático nas percentagens)"></div></div>
 <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem"><button class="btn btn-s" onclick="payCalc('d')">🧮 Calcular diárias da viagem</button><button class="btn btn-s" onclick="payCalc('c')">🧮 Calcular comissão da viagem</button><button class="btn btn-p" onclick="payAdd()">💾 Registar lançamento</button></div></div>
 <div class="card"><div class="ct"><span>📜 Histórico de lançamentos</span><select class="fc" style="width:auto" onchange="PY.f=this.value;render()"><option value="">Todos os motoristas</option>${pyOpt(D.drivers.map(m=>[m.id,m.nome]),PY.f)}</select></div>
 ${hist.length?`<div class="tw"><table><tr><th>Data</th><th>Motorista</th><th>Tipo</th><th>Descrição</th><th>Viagem</th><th style="text-align:right">Valor</th><th></th></tr>${hist.map(x=>{const pos=PAYC.includes(x.tipo);return`<tr><td>${fdate(x.data)}</td><td>${esc(ref('drivers',x.motorista))}</td><td><span class="pill s-${pos?'ok':x.tipo=='Desconto'?'bad':'info'}">${x.tipo}${x.cat?' · '+esc(x.cat):''}</span></td><td>${esc(x.descricao||'')}</td><td>${x.viagem?esc(ref('trips',x.viagem)):'—'}</td><td style="text-align:right;white-space:nowrap">${pos?'':'− '}${MT2(x.valor)}</td><td><button class="btn btn-d sm" onclick="payDel('${x.id}')">🗑️</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Sem lançamentos.</div>'}</div>`}
function payView(){
 const t=document.createElement('div');t.innerHTML=payView0();const A=[...t.children],L=A.filter(e=>/Novo lançamento|Histórico de lançamentos/.test(e.textContent.slice(0,60))),R=A.filter(e=>!L.includes(e));
 const tabs=[['rec','📋 Folha & Resumo'],['lanc','🧾 Lançamentos']];
 const body=PY.tab=='lanc'?L.map(e=>e.outerHTML).join(''):PY.tab=='mot'?`<div class="card"><div class="ct"><span>👷 Trabalhadores (motoristas)</span><button class="btn btn-p" onclick="openM('drivers')">＋ Novo motorista</button></div>${tbl('drivers',D.drivers)}</div>`:R.map(e=>e.outerHTML).join('');
 return`<div class="card"><div class="ct"><span>💰 Salários &amp; RH</span><span style="display:flex;gap:.4rem"><button class="btn btn-s sm" onclick="go('drivers')">👷 Motoristas</button><button class="btn btn-s sm" onclick="go('co')">⚙️ Configurar</button></span></div><p style="color:var(--muted);font-size:.82rem;margin-bottom:.7rem">ℹ️ Este módulo apenas <b>regista</b> salários e pagamentos; "Pago" significa que o pagamento foi feito fora do sistema.</p><label style="display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;margin-bottom:.8rem"><input type="checkbox" ${D.co.pyInt?'checked':''} onchange="D.co.pyInt=this.checked;save();render()"><span><b>🔗 Integrar salários nas contas gerais</b><br><span style="color:var(--muted)">Ligado: o custo com salários entra no resultado dos Relatórios. Desligado: fica independente.</span></span></label><div style="display:flex;gap:.4rem;flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="btn ${PY.tab==k?'btn-p':'btn-s'}" onclick="PY.tab='${k}';render()">${l}</button>`).join('')}</div></div>${body}`}
function payPre(id){const e=$('#pay_m');if(e){e.value=id;e.scrollIntoView({behavior:'smooth',block:'center'})}}
function payTripVal(t,k){const m=D.drivers.find(x=>x.id==t.motorista);if(!m)return{err:'Esta viagem não tem motorista associado.'};
 if(k=='d'){const f=t.estado=='Concluída'&&t.chegada?t.chegada:today(),n=Math.max(1,Math.round((new Date(f)-new Date(t.saida))/864e5)+1),rate=+m.diaria||+D.co.diaria||0;if(!(rate>0))return{err:'Defina a diária na ficha do motorista ou em Empresa.'};return{m,tipo:'Diárias',valor:+(n*rate).toFixed(2),desc:`${n} dia(s) × ${MT2(rate)} — ${t.origem} → ${t.destino}`}}
 const pc=+m.comissao||0,fx=+m.comissaoFixa||0,b=tripRec(t);if(pc>0)return{m,tipo:'Comissão',valor:+(b*pc/100).toFixed(2),desc:`${pc}% sobre o frete de ${MT(b)} — ${t.origem} → ${t.destino}`};
 if(fx>0)return{m,tipo:'Comissão',valor:fx,desc:`Comissão fixa — ${t.origem} → ${t.destino}`};return{err:'Defina a comissão (% ou valor fixo) na ficha do motorista.'}}
function payCalc(k){const t=D.trips.find(x=>x.id==$('#pay_vi').value);if(!t)return alert('Escolha primeiro a viagem.');const r=payTripVal(t,k);if(r.err)return alert(r.err);$('#pay_m').value=r.m.id;$('#pay_t').value=r.tipo;$('#pay_u').value='MT';$('#pay_v').value=r.valor;$('#pay_o').value=r.desc;payUi()}
function pyPending(){const P=D.payroll||[],o=[];D.trips.filter(t=>t.estado=='Concluída'&&t.motorista&&D.drivers.some(m=>m.id==t.motorista)).forEach(t=>{[['d','Diárias'],['c','Comissão']].forEach(([k,tp])=>{if(P.some(x=>x.viagem==t.id&&x.tipo==tp))return;const r=payTripVal(t,k);if(!r.err&&r.valor>0)o.push({t,k,r})})});return o}
async function payAuto(tid,k){const t=D.trips.find(x=>x.id==tid);if(!t)return;const r=payTripVal(t,k);if(r.err)return alert(r.err);if((D.payroll||[]).some(x=>x.viagem==tid&&x.tipo==r.tipo)&&!await ask('Já existe um lançamento de '+r.tipo+' para esta viagem. Lançar outro?'))return;const e={id:uid(),motorista:r.m.id,data:t.chegada&&t.chegada<=today()?t.chegada:today(),tipo:r.tipo,valor:r.valor,viagem:t.id,descricao:r.desc};D.payroll.push(e);audit('criou','payroll',e);save();render()}
function pyOldest(id){const P=(D.payroll||[]).filter(x=>x.motorista==id).sort((a,b)=>String(a.data).localeCompare(String(b.data)));let ab=sum(P.filter(x=>!PAYC.includes(x.tipo)),x=>x.valor);for(const x of P.filter(y=>PAYC.includes(y.tipo))){const r=+x.valor-ab;if(r>.005)return x.data;ab-=+x.valor}return null}
async function payAdd(){const m=$('#pay_m').value,t=$('#pay_t').value,d=$('#pay_d').value,pct=$('#pay_u').value=='%',n=+$('#pay_v').value,cat=PYCAT[t]?$('#pay_c').value:'';if(!m)return alert('Escolha o motorista.');if(!(n>0))return alert('Indique um valor maior que zero.');if(!d)return alert('Indique a data.');
 let v=n,bk='',bv=0,desc=$('#pay_o').value.trim();
 if(pct){bk=$('#pay_b').value;bv=payBase(m,d,bk);if(!(bv>0))return alert('A base escolhida ('+PYBASE.find(x=>x[0]==bk)[1].toLowerCase()+') está a zero para este motorista/mês. Defina o salário base na ficha ou lance primeiro os rendimentos.');v=+(bv*n/100).toFixed(2);if(!desc)desc=`${cat||t} ${String(n).replace('.',',')}% sobre ${MT(bv)}`}
 if(t=='Pagamento'&&v>pyBal(m)+.005&&!await ask('O pagamento ('+MT(v)+') é superior ao saldo a pagar ('+MT(Math.max(0,pyBal(m)))+'). Registar mesmo assim?'))return;
 const r={id:uid(),motorista:m,data:d,tipo:t,valor:v,viagem:$('#pay_vi').value||'',descricao:desc};if(cat)r.cat=cat;if(pct){r.pct=n;r.base=bk}D.payroll.push(r);audit('criou','payroll',r);save();render()}
async function payPaySaldo(id){const b=pyBal(id),m=D.drivers.find(x=>x.id==id);if(!(b>0))return;if(!await ask('Registar pagamento de '+MT2(b)+' a '+m.nome+' (liquida o saldo)?'))return;const r={id:uid(),motorista:id,data:today(),tipo:'Pagamento',valor:+b.toFixed(2),viagem:'',descricao:'Pagamento do saldo'};D.payroll.push(r);audit('criou','payroll',r);save();render();payDoc(id)}
async function payDel(id){const r=D.payroll.find(x=>x.id==id);if(!r)return;if(!await ask('Eliminar este lançamento ('+r.tipo+' · '+MT2(r.valor)+')? Ficará registado na auditoria.'))return;audit('eliminou','payroll',r);D.payroll=D.payroll.filter(x=>x.id!=id);save();render()}
function payMonthCalc(m){const co=D.co,sal=+m.salario||0,sub=+m.subsidio||0,pi=(m.inss===''||m.inss==null)?+co.inssPct||0:+m.inss,pr=(m.irps===''||m.irps==null)?+co.irpsPct||0:+m.irps,inss=+(sal*pi/100).toFixed(2),irps=+((sal+sub-inss)*pr/100).toFixed(2);return{sal,sub,pi,pr,inss,irps,liq:sal+sub-inss-irps}}
async function payGenMonth(){const ym=PY.ym,P=D.payroll,L=D.drivers.filter(m=>m.estado!='Inativo'&&+m.salario>0&&!P.some(x=>x.motorista==m.id&&x.tipo=='Salário'&&x.ref==ym));if(!L.length)return alert('Não há salários por gerar em '+ym+' (já lançados ou sem salário base nas fichas).');
 if(!await ask('Gerar o salário de '+ym+' para '+L.length+' motorista(s)?\n\n'+L.map(m=>{const c=payMonthCalc(m);return m.nome+': salário '+MT(c.sal)+(c.sub?' + subsídio '+MT(c.sub):'')+(c.inss?' − INSS '+MT(c.inss)+' ('+c.pi+'%)':'')+(c.irps?' − IRPS '+MT(c.irps)+' ('+c.pr+'%)':'')+' = líquido '+MT(c.liq)}).join('\n')+'\n\nPode ajustar ou acrescentar descontos e subsídios depois em Novo lançamento.'))return;
 const add=(m,tipo,valor,cat,extra)=>{const r={id:uid(),motorista:m.id,data:today(),tipo,valor,ref:ym,viagem:'',descricao:'',...extra};if(cat)r.cat=cat;P.push(r);audit('criou','payroll',r)};
 L.forEach(m=>{const c=payMonthCalc(m);add(m,'Salário',c.sal,'',{descricao:'Salário '+ym});if(c.sub)add(m,'Subsídio',c.sub,'Outro',{descricao:'Subsídio mensal '+ym});if(c.inss)add(m,'Desconto',c.inss,'INSS',{pct:c.pi,base:'sal',descricao:'INSS '+String(c.pi).replace('.',',')+'% sobre '+MT(c.sal)});if(c.irps)add(m,'Desconto',c.irps,'IRPS',{pct:c.pr,base:'liq',descricao:'IRPS '+String(c.pr).replace('.',',')+'% sobre '+MT(c.sal+c.sub-c.inss)})});save();render()}
function payDoc(id){const m=D.drivers.find(x=>x.id==id);if(!m)return;const ym=PY.ym,co=D.co,L=D.payroll.filter(x=>x.motorista==id&&String(x.data).slice(0,7)==ym).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
 const sec=(t,h)=>`<div class="sec"><div class="sh">${t}</div>${h}</div>`,kv=a=>`<table class="kv">${a.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`;
 const tb=(rows)=>rows.length?`<table class="it"><tr><th style="width:24mm">Data</th><th>Descrição</th><th class="r" style="width:36mm">Valor</th></tr>${rows.map(x=>`<tr><td>${fdate(x.data)}</td><td>${esc(x.tipo)}${x.cat?' ('+esc(x.cat)+')':''}${x.descricao?' — '+esc(x.descricao):''}</td><td class="r">${MT2(x.valor)}</td></tr>`).join('')}</table>`:'<p style="color:#666">Sem lançamentos.</p>';
 const R=L.filter(x=>PAYC.includes(x.tipo)),Dd=L.filter(x=>x.tipo=='Desconto'),Pg=L.filter(x=>x.tipo=='Adiantamento'||x.tipo=='Pagamento'),tr=sum(R,x=>x.valor),td=sum(Dd,x=>x.valor),tp=sum(Pg,x=>x.valor),tI=sum(Dd.filter(x=>x.cat=='INSS'),x=>x.valor),tR=sum(Dd.filter(x=>x.cat=='IRPS'),x=>x.valor),tO=td-tI-tR;
 const b=`<div class="subj"><span>ASSUNTO:</span> Recibo de vencimento — ${esc(m.nome)} — ${ym.split('-').reverse().join('/')}</div>`+sec('Motorista',kv([['Nome','<b>'+esc(m.nome)+'</b>'],['Carta / categoria',esc(m.carta||'—')+' · '+esc(m.categoria||'')],['Telefone',esc(m.telefone||'—')]]))+sec('Rendimentos (salário e subsídios)',tb(R))+sec('Descontos (INSS, IRPS e outros)',tb(Dd))+sec('Pagamentos e adiantamentos',tb(Pg))+sec('Resumo',`<div class="tot" style="margin-left:0;width:100%;max-width:300px"><div><span>Rendimentos</span><span>${MT2(tr)}</span></div>${tI?`<div><span>INSS</span><span>− ${MT2(tI)}</span></div>`:''}${tR?`<div><span>IRPS</span><span>− ${MT2(tR)}</span></div>`:''}${tO>.005?`<div><span>${tI||tR?'Outros descontos':'Descontos'}</span><span>− ${MT2(tO)}</span></div>`:''}<div><b>Líquido do mês</b><b>${MT2(tr-td)}</b></div><div><span>Pago no mês</span><span>${MT2(tp)}</span></div><div class="gt"><b>Saldo acumulado</b><b>${MT2(pyBal(id))}</b></div></div>`);
 showDoc(hdr('RECIBO DE VENCIMENTO','RV-'+ym,today())+b,sigH('Pela empresa: '+co.nome,'O motorista: '+m.nome)+`<p class="rod">${esc(co.rodape)}</p>`)}
</script>

 return{nome:me||w.nome||'',empresa:st.empresa||'',licenca:st.code||''}}
