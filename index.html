var SQLTXT="-- =====================================================================\n-- FROTA PRO · Controlo de Licenças (Painel do Programador)\n-- Cole tudo no Supabase > SQL Editor > New query > Run.\n-- Pode ser executado mais de uma vez sem problema.\n--\n-- ANTES DE EXECUTAR: troque COLOQUE_AQUI_A_SUA_SENHA (mais abaixo)\n-- pela sua palavra-passe MASTER. Enquanto ficar o texto original,\n-- o painel recusa-se a abrir (de propósito).\n--\n-- Como protege os dados:\n--  * As tabelas ficam FECHADAS ao acesso directo (anon/authenticated).\n--  * O app só fala com funções. A palavra-passe master é validada aqui\n--    no Postgres (guardada com hash bcrypt) e NÃO existe no HTML.\n--  * 8 tentativas erradas bloqueiam o painel durante 10 minutos.\n-- =====================================================================\n\ncreate extension if not exists pgcrypto with schema extensions;\n\n-- ---------- tabelas ----------\ncreate table if not exists public.frota_licencas (\n  id               uuid primary key default gen_random_uuid(),\n  codigo           text not null unique,\n  empresa          text not null,\n  contacto         text,\n  notas            text,\n  expira           date not null,\n  max_dispositivos int  not null default 3 check (max_dispositivos >= 0),\n  estado           text not null default 'ativa' check (estado in ('ativa','bloqueada')),\n  created_at       timestamptz not null default now(),\n  updated_at       timestamptz not null default now()\n);\n\ncreate table if not exists public.frota_licenca_dispositivos (\n  licenca_id uuid not null references public.frota_licencas(id) on delete cascade,\n  device_id  text not null,\n  info       jsonb not null default '{}'::jsonb,\n  first_seen timestamptz not null default now(),\n  last_seen  timestamptz not null default now(),\n  primary key (licenca_id, device_id)\n);\n\ncreate table if not exists public.frota_dev_config (\n  id            int primary key default 1 check (id = 1),\n  pass_hash     text not null,\n  falhas        int not null default 0,\n  bloqueado_ate timestamptz\n);\n\nalter table public.frota_licencas             enable row level security;\nalter table public.frota_licenca_dispositivos enable row level security;\nalter table public.frota_dev_config           enable row level security;\nrevoke all on table public.frota_licencas             from anon, authenticated;\nrevoke all on table public.frota_licenca_dispositivos from anon, authenticated;\nrevoke all on table public.frota_dev_config           from anon, authenticated;\n\n-- ---------- palavra-passe master (só cria se ainda não existir) ----------\n-- >>> TROQUE o texto entre aspas pela sua palavra-passe (mín. 8 caracteres) <<<\ninsert into public.frota_dev_config (id, pass_hash)\nselect 1, extensions.crypt('COLOQUE_AQUI_A_SUA_SENHA', extensions.gen_salt('bf'))\nwhere not exists (select 1 from public.frota_dev_config);\n\n-- Para mudar a palavra-passe mais tarde (também pode ser feito no painel):\n--   update public.frota_dev_config\n--      set pass_hash = extensions.crypt('NOVA_SENHA', extensions.gen_salt('bf')), falhas = 0, bloqueado_ate = null;\n\n-- ---------- validação interna da palavra-passe (não exposta) ----------\ncreate or replace function public.frota_dev_auth(p_pass text)\nreturns text\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare c public.frota_dev_config%rowtype;\nbegin\n  select * into c from public.frota_dev_config where id = 1;\n  if not found then return 'setup'; end if;\n  if c.bloqueado_ate is not null and c.bloqueado_ate > now() then return 'locked'; end if;\n  if p_pass is not null and length(p_pass) >= 8\n     and p_pass <> 'COLOQUE_AQUI_A_SUA_SENHA'\n     and c.pass_hash = crypt(p_pass, c.pass_hash) then\n    if c.falhas > 0 or c.bloqueado_ate is not null then\n      update public.frota_dev_config set falhas = 0, bloqueado_ate = null where id = 1;\n    end if;\n    return 'ok';\n  end if;\n  update public.frota_dev_config\n     set falhas        = case when falhas + 1 >= 8 then 0 else falhas + 1 end,\n         bloqueado_ate = case when falhas + 1 >= 8 then now() + interval '10 minutes' else null end\n   where id = 1;\n  return 'auth';\nend;\n$$;\n\n-- ---------- app do cliente: validar / registar aparelho ----------\ncreate or replace function public.frota_check_license(p_code text, p_device text, p_info jsonb default '{}'::jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare\n  l    public.frota_licencas%rowtype;\n  code text := upper(trim(coalesce(p_code, '')));\n  hoje date := (now() at time zone 'Africa/Maputo')::date;\n  n    int;\n  v_info jsonb := '{}'::jsonb;\nbegin\n  if code = '' or length(code) > 40 or p_device is null or length(p_device) < 8 or length(p_device) > 80 then\n    return jsonb_build_object('ok', false, 'reason', 'not_found');\n  end if;\n  select * into l from public.frota_licencas where codigo = code;\n  if not found then return jsonb_build_object('ok', false, 'reason', 'not_found'); end if;\n  if l.estado = 'bloqueada' then return jsonb_build_object('ok', false, 'reason', 'blocked'); end if;\n  if l.expira < hoje then\n    return jsonb_build_object('ok', false, 'reason', 'expired', 'exp', l.expira);\n  end if;\n\n  if p_info is not null and jsonb_typeof(p_info) = 'object' and length(p_info::text) < 600 then\n    v_info := p_info;\n  end if;\n\n  if exists (select 1 from public.frota_licenca_dispositivos where licenca_id = l.id and device_id = p_device) then\n    update public.frota_licenca_dispositivos\n       set last_seen = now(), info = case when v_info = '{}'::jsonb then public.frota_licenca_dispositivos.info else v_info end\n     where licenca_id = l.id and device_id = p_device;\n  else\n    select count(*) into n from public.frota_licenca_dispositivos where licenca_id = l.id;\n    if n >= l.max_dispositivos then\n      return jsonb_build_object('ok', false, 'reason', 'device');\n    end if;\n    insert into public.frota_licenca_dispositivos (licenca_id, device_id, info) values (l.id, p_device, v_info);\n  end if;\n\n  return jsonb_build_object('ok', true, 'empresa', l.empresa, 'exp', l.expira,\n                            'dias', l.expira - hoje, 'max', l.max_dispositivos);\nend;\n$$;\n\n-- ---------- painel do programador (todas devolvem {ok:true,data:..} ou {ok:false,error:..}) ----------\ncreate or replace function public.frota_dev_verify(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_list(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  select coalesce(jsonb_agg(to_jsonb(x) order by x.created_at desc), '[]'::jsonb) into r\n  from (\n    select l.id, l.codigo, l.empresa, l.contacto, l.notas, l.expira, l.max_dispositivos, l.estado, l.created_at,\n           (select count(*) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as n_disp,\n           (select max(d.last_seen) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as ultimo_acesso,\n           coalesce((select jsonb_agg(jsonb_build_object('device_id', d.device_id, 'info', d.info,\n                                                         'first_seen', d.first_seen, 'last_seen', d.last_seen)\n                                      order by d.last_seen desc)\n                       from public.frota_licenca_dispositivos d where d.licenca_id = l.id), '[]'::jsonb) as dispositivos\n      from public.frota_licencas l\n  ) x;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_add(p_pass text, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); new_id uuid;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    insert into public.frota_licencas (codigo, empresa, contacto, notas, expira, max_dispositivos)\n    values (upper(trim(p_data->>'codigo')),\n            trim(p_data->>'empresa'),\n            nullif(trim(coalesce(p_data->>'contacto', '')), ''),\n            nullif(trim(coalesce(p_data->>'notas', '')), ''),\n            (p_data->>'expira')::date,\n            coalesce((p_data->>'max_dispositivos')::int, 3))\n    returning id into new_id;\n  exception\n    when unique_violation then return jsonb_build_object('ok', false, 'error', 'dup');\n    when others then return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true, 'data', new_id);\nend;\n$$;\n\ncreate or replace function public.frota_dev_update(p_pass text, p_id uuid, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    update public.frota_licencas set\n      empresa          = case when p_data ? 'empresa'          then trim(p_data->>'empresa') else empresa end,\n      contacto         = case when p_data ? 'contacto'         then nullif(trim(coalesce(p_data->>'contacto', '')), '') else contacto end,\n      notas            = case when p_data ? 'notas'            then nullif(trim(coalesce(p_data->>'notas', '')), '') else notas end,\n      expira           = case when p_data ? 'expira'           then (p_data->>'expira')::date else expira end,\n      max_dispositivos = case when p_data ? 'max_dispositivos' then (p_data->>'max_dispositivos')::int else max_dispositivos end,\n      estado           = case when p_data ? 'estado'           then p_data->>'estado' else estado end,\n      updated_at       = now()\n    where id = p_id;\n    if not found then return jsonb_build_object('ok', false, 'error', 'notfound'); end if;\n  exception when others then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_delete(p_pass text, p_id uuid)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  delete from public.frota_licencas where id = p_id;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_remove_device(p_pass text, p_id uuid, p_device text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  delete from public.frota_licenca_dispositivos where licenca_id = p_id and device_id = p_device;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_set_pass(p_pass text, p_new text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  if p_new is null or length(p_new) < 8 or p_new = 'COLOQUE_AQUI_A_SUA_SENHA' then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end if;\n  update public.frota_dev_config set pass_hash = crypt(p_new, gen_salt('bf')), falhas = 0, bloqueado_ate = null where id = 1;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\n-- ---------- permissões ----------\nrevoke all on function public.frota_dev_auth(text) from public, anon, authenticated;\nrevoke all on function public.frota_check_license(text, text, jsonb) from public;\nrevoke all on function public.frota_dev_verify(text) from public;\nrevoke all on function public.frota_dev_list(text) from public;\nrevoke all on function public.frota_dev_add(text, jsonb) from public;\nrevoke all on function public.frota_dev_update(text, uuid, jsonb) from public;\nrevoke all on function public.frota_dev_delete(text, uuid) from public;\nrevoke all on function public.frota_dev_remove_device(text, uuid, text) from public;\nrevoke all on function public.frota_dev_set_pass(text, text) from public;\n\ngrant execute on function public.frota_check_license(text, text, jsonb) to anon, authenticated;\ngrant execute on function public.frota_dev_verify(text) to anon, authenticated;\ngrant execute on function public.frota_dev_list(text) to anon, authenticated;\ngrant execute on function public.frota_dev_add(text, jsonb) to anon, authenticated;\ngrant execute on function public.frota_dev_update(text, uuid, jsonb) to anon, authenticated;\ngrant execute on function public.frota_dev_delete(text, uuid) to anon, authenticated;\ngrant execute on function public.frota_dev_remove_device(text, uuid, text) to anon, authenticated;\ngrant execute on function public.frota_dev_set_pass(text, text) to anon, authenticated;\n\n-- actualiza a cache da API para ver as funções novas\nnotify pgrst, 'reload schema';\n\n-- =====================================================================\n-- FROTA PRO · Planos por licença + Chat de suporte\n-- Cole tudo no Supabase > SQL Editor > New query > Run.\n-- Execute DEPOIS do SQL das licenças (já executado). Pode ser executado\n-- mais de uma vez sem problema. NÃO altera a palavra-passe master.\n--\n--  1) Cada licença passa a ter a lista de módulos incluídos\n--     (coluna \"funcoes\": NULL = todos os módulos = plano Completo).\n--  2) Chat de suporte: o cliente escreve no botão 💬 Suporte (separador\n--     Admin) e a mensagem chega ao Painel de Licenças, onde responde.\n--     As tabelas ficam fechadas; só as funções abaixo lhes acedem.\n-- =====================================================================\n\n-- ---------- 1) módulos por licença ----------\nalter table public.frota_licencas add column if not exists funcoes jsonb;\n\ncreate or replace function public.frota_check_license(p_code text, p_device text, p_info jsonb default '{}'::jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare\n  l    public.frota_licencas%rowtype;\n  code text := upper(trim(coalesce(p_code, '')));\n  hoje date := (now() at time zone 'Africa/Maputo')::date;\n  n    int;\n  v_info jsonb := '{}'::jsonb;\nbegin\n  if code = '' or length(code) > 40 or p_device is null or length(p_device) < 8 or length(p_device) > 80 then\n    return jsonb_build_object('ok', false, 'reason', 'not_found');\n  end if;\n  select * into l from public.frota_licencas where codigo = code;\n  if not found then return jsonb_build_object('ok', false, 'reason', 'not_found'); end if;\n  if l.estado = 'bloqueada' then return jsonb_build_object('ok', false, 'reason', 'blocked'); end if;\n  if l.expira < hoje then\n    return jsonb_build_object('ok', false, 'reason', 'expired', 'exp', l.expira);\n  end if;\n\n  if p_info is not null and jsonb_typeof(p_info) = 'object' and length(p_info::text) < 600 then\n    v_info := p_info;\n  end if;\n\n  if exists (select 1 from public.frota_licenca_dispositivos where licenca_id = l.id and device_id = p_device) then\n    update public.frota_licenca_dispositivos\n       set last_seen = now(), info = case when v_info = '{}'::jsonb then public.frota_licenca_dispositivos.info else v_info end\n     where licenca_id = l.id and device_id = p_device;\n  else\n    select count(*) into n from public.frota_licenca_dispositivos where licenca_id = l.id;\n    if n >= l.max_dispositivos then\n      return jsonb_build_object('ok', false, 'reason', 'device');\n    end if;\n    insert into public.frota_licenca_dispositivos (licenca_id, device_id, info) values (l.id, p_device, v_info);\n  end if;\n\n  return jsonb_build_object('ok', true, 'empresa', l.empresa, 'exp', l.expira,\n                            'dias', l.expira - hoje, 'max', l.max_dispositivos,\n                            'features', l.funcoes);\nend;\n$$;\n\ncreate or replace function public.frota_dev_list(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  select coalesce(jsonb_agg(to_jsonb(x) order by x.created_at desc), '[]'::jsonb) into r\n  from (\n    select l.id, l.codigo, l.empresa, l.contacto, l.notas, l.expira, l.max_dispositivos, l.estado, l.created_at, l.funcoes,\n           (select count(*) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as n_disp,\n           (select max(d.last_seen) from public.frota_licenca_dispositivos d where d.licenca_id = l.id) as ultimo_acesso,\n           coalesce((select jsonb_agg(jsonb_build_object('device_id', d.device_id, 'info', d.info,\n                                                         'first_seen', d.first_seen, 'last_seen', d.last_seen)\n                                      order by d.last_seen desc)\n                       from public.frota_licenca_dispositivos d where d.licenca_id = l.id), '[]'::jsonb) as dispositivos\n      from public.frota_licencas l\n  ) x;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_add(p_pass text, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); new_id uuid;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    insert into public.frota_licencas (codigo, empresa, contacto, notas, expira, max_dispositivos, funcoes)\n    values (upper(trim(p_data->>'codigo')),\n            trim(p_data->>'empresa'),\n            nullif(trim(coalesce(p_data->>'contacto', '')), ''),\n            nullif(trim(coalesce(p_data->>'notas', '')), ''),\n            (p_data->>'expira')::date,\n            coalesce((p_data->>'max_dispositivos')::int, 3),\n            case when jsonb_typeof(p_data->'funcoes') = 'array' then p_data->'funcoes' else null end)\n    returning id into new_id;\n  exception\n    when unique_violation then return jsonb_build_object('ok', false, 'error', 'dup');\n    when others then return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true, 'data', new_id);\nend;\n$$;\n\ncreate or replace function public.frota_dev_update(p_pass text, p_id uuid, p_data jsonb)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  begin\n    update public.frota_licencas set\n      empresa          = case when p_data ? 'empresa'          then trim(p_data->>'empresa') else empresa end,\n      contacto         = case when p_data ? 'contacto'         then nullif(trim(coalesce(p_data->>'contacto', '')), '') else contacto end,\n      notas            = case when p_data ? 'notas'            then nullif(trim(coalesce(p_data->>'notas', '')), '') else notas end,\n      expira           = case when p_data ? 'expira'           then (p_data->>'expira')::date else expira end,\n      max_dispositivos = case when p_data ? 'max_dispositivos' then (p_data->>'max_dispositivos')::int else max_dispositivos end,\n      estado           = case when p_data ? 'estado'           then p_data->>'estado' else estado end,\n      funcoes          = case when p_data ? 'funcoes'\n                              then (case when jsonb_typeof(p_data->'funcoes') = 'array' then p_data->'funcoes' else null end)\n                              else funcoes end,\n      updated_at       = now()\n    where id = p_id;\n    if not found then return jsonb_build_object('ok', false, 'error', 'notfound'); end if;\n  exception when others then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\n-- ---------- 2) chat de suporte ----------\ncreate table if not exists public.frota_sup_msgs (\n  id      bigserial primary key,\n  cid     text not null,                                   -- id da conversa (gerado no aparelho do cliente)\n  de      text not null check (de in ('user', 'admin')),\n  nome    text,\n  empresa text,\n  licenca text,\n  texto   text not null,\n  lido    boolean not null default false,                  -- mensagem do cliente já lida pelo admin\n  ts      timestamptz not null default now()\n);\ncreate index if not exists frota_sup_msgs_cid_idx on public.frota_sup_msgs (cid, id);\ncreate index if not exists frota_sup_msgs_ts_idx  on public.frota_sup_msgs (ts);\n\nalter table public.frota_sup_msgs enable row level security;\nrevoke all on table public.frota_sup_msgs from anon, authenticated;\nrevoke all on sequence public.frota_sup_msgs_id_seq from anon, authenticated;\n\n-- cliente -> admin (limite: 500 caracteres, 10 mensagens/minuto por conversa)\ncreate or replace function public.frota_sup_send(p_cid text, p_nome text, p_empresa text, p_licenca text, p_texto text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare t text := left(trim(coalesce(p_texto, '')), 500); new_id bigint;\nbegin\n  if p_cid is null or length(p_cid) < 12 or length(p_cid) > 80 or t = '' then\n    return jsonb_build_object('ok', false, 'error', 'invalid');\n  end if;\n  if (select count(*) from public.frota_sup_msgs where cid = p_cid and de = 'user' and ts > now() - interval '1 minute') >= 10\n     or (select count(*) from public.frota_sup_msgs where de = 'user' and ts > now() - interval '1 minute') >= 150 then\n    return jsonb_build_object('ok', false, 'error', 'rate');\n  end if;\n  if random() < 0.02 then\n    delete from public.frota_sup_msgs where ts < now() - interval '120 days';   -- limpeza automática\n  end if;\n  insert into public.frota_sup_msgs (cid, de, nome, empresa, licenca, texto)\n  values (p_cid, 'user', left(trim(coalesce(p_nome, '')), 80), left(trim(coalesce(p_empresa, '')), 120),\n          left(trim(coalesce(p_licenca, '')), 60), t)\n  returning id into new_id;\n  return jsonb_build_object('ok', true, 'id', new_id);\nend;\n$$;\n\n-- admin -> cliente: o aparelho pergunta pelas respostas da sua conversa\ncreate or replace function public.frota_sup_poll(p_cid text, p_after bigint default 0)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\nbegin\n  if p_cid is null or length(p_cid) < 12 or length(p_cid) > 80 then return '[]'::jsonb; end if;\n  return coalesce((select jsonb_agg(jsonb_build_object('id', m.id, 'text', m.texto,\n                                                       'ts', (extract(epoch from m.ts) * 1000)::bigint) order by m.id)\n                     from public.frota_sup_msgs m\n                    where m.cid = p_cid and m.de = 'admin' and m.id > coalesce(p_after, 0)), '[]'::jsonb);\nend;\n$$;\n\n-- nº de mensagens de clientes por ler (só devolve um número; usado para avisar o admin)\ncreate or replace function public.frota_sup_unread()\nreturns int\nlanguage sql security definer\nset search_path = public, extensions\nas $$\n  select count(*)::int from public.frota_sup_msgs where de = 'user' and not lido;\n$$;\n\n-- ---------- painel do programador: conversas ----------\ncreate or replace function public.frota_dev_sup_threads(p_pass text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  select coalesce(jsonb_agg(to_jsonb(x) order by x.last_id desc), '[]'::jsonb) into r\n  from (\n    select m.cid,\n           max(m.id) as last_id,\n           (array_agg(m.nome    order by m.id desc) filter (where m.de = 'user' and coalesce(m.nome, '')    <> ''))[1] as nome,\n           (array_agg(m.empresa order by m.id desc) filter (where m.de = 'user' and coalesce(m.empresa, '') <> ''))[1] as empresa,\n           (array_agg(m.licenca order by m.id desc) filter (where m.de = 'user' and coalesce(m.licenca, '') <> ''))[1] as licenca,\n           (array_agg(m.texto   order by m.id desc))[1] as last_text,\n           (array_agg(m.de      order by m.id desc))[1] as last_from,\n           (extract(epoch from max(m.ts)) * 1000)::bigint as ts,\n           (count(*) filter (where m.de = 'user' and not m.lido))::int as unread\n      from public.frota_sup_msgs m\n     group by m.cid\n     order by max(m.id) desc\n     limit 100\n  ) x;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_sup_messages(p_pass text, p_cid text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); r jsonb;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  update public.frota_sup_msgs set lido = true where cid = p_cid and de = 'user' and not lido;\n  select coalesce(jsonb_agg(jsonb_build_object('id', m.id, 'de', m.de, 'text', m.texto,\n                                               'ts', (extract(epoch from m.ts) * 1000)::bigint) order by m.id), '[]'::jsonb) into r\n    from (select * from public.frota_sup_msgs where cid = p_cid order by id desc limit 300) m;\n  return jsonb_build_object('ok', true, 'data', r);\nend;\n$$;\n\ncreate or replace function public.frota_dev_sup_reply(p_pass text, p_cid text, p_texto text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass); t text := left(trim(coalesce(p_texto, '')), 500); u record;\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  if t = '' or p_cid is null then return jsonb_build_object('ok', false, 'error', 'invalid'); end if;\n  select nome, empresa, licenca into u from public.frota_sup_msgs where cid = p_cid and de = 'user' order by id desc limit 1;\n  if not found then return jsonb_build_object('ok', false, 'error', 'notfound'); end if;\n  insert into public.frota_sup_msgs (cid, de, nome, empresa, licenca, texto, lido)\n  values (p_cid, 'admin', u.nome, u.empresa, u.licenca, t, true);\n  update public.frota_sup_msgs set lido = true where cid = p_cid and de = 'user' and not lido;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\ncreate or replace function public.frota_dev_sup_delete(p_pass text, p_cid text)\nreturns jsonb\nlanguage plpgsql security definer\nset search_path = public, extensions\nas $$\ndeclare a text := public.frota_dev_auth(p_pass);\nbegin\n  if a <> 'ok' then return jsonb_build_object('ok', false, 'error', a); end if;\n  delete from public.frota_sup_msgs where cid = p_cid;\n  return jsonb_build_object('ok', true);\nend;\n$$;\n\n-- ---------- permissões ----------\nrevoke all on function public.frota_sup_send(text, text, text, text, text)  from public;\nrevoke all on function public.frota_sup_poll(text, bigint)                  from public;\nrevoke all on function public.frota_sup_unread()                            from public;\nrevoke all on function public.frota_dev_sup_threads(text)                   from public;\nrevoke all on function public.frota_dev_sup_messages(text, text)            from public;\nrevoke all on function public.frota_dev_sup_reply(text, text, text)         from public;\nrevoke all on function public.frota_dev_sup_delete(text, text)              from public;\n\ngrant execute on function public.frota_sup_send(text, text, text, text, text)  to anon, authenticated;\ngrant execute on function public.frota_sup_poll(text, bigint)                  to anon, authenticated;\ngrant execute on function public.frota_sup_unread()                            to anon, authenticated;\ngrant execute on function public.frota_dev_sup_threads(text)                   to anon, authenticated;\ngrant execute on function public.frota_dev_sup_messages(text, text)            to anon, authenticated;\ngrant execute on function public.frota_dev_sup_reply(text, text, text)         to anon, authenticated;\ngrant execute on function public.frota_dev_sup_delete(text, text)              to anon, authenticated;\n\n-- actualiza a cache da API para ver as funções novas\nnotify pgrst, 'reload schema';\n";

<script id="cambio-auto">
/* Câmbio automático: atualiza D.co.usd e D.co.zar (moeda da empresa por 1 USD / 1 ZAR) a cada 24h.
   Fontes gratuitas, sem chave: open.er-api.com → jsDelivr (fawazahmed0) → currency-api.pages.dev */
(function(){
var DAY=24*3600*1000,CHECK=30*60*1000,busy=false;
var L=function(p,e){return window.LANG=='en'?e:p};
var SRC=[
 {n:'open.er-api.com',u:'https://open.er-api.com/v6/latest/USD',f:function(j){if(!j||j.result!=='success'||!j.rates)throw 0;return j.rates}},
 {n:'fawazahmed0/currency-api (jsDelivr)',u:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',f:function(j){return up(j&&j.usd)}},
 {n:'currency-api.pages.dev',u:'https://latest.currency-api.pages.dev/v1/currencies/usd.json',f:function(j){return up(j&&j.usd)}}
];
function up(o){if(!o)throw 0;var r={USD:1};Object.keys(o).forEach(function(k){r[k.toUpperCase()]=+o[k]});return r}
function co(){try{return(typeof D!=='undefined'&&D&&D.co)?D.co:null}catch(e){return null}}
function base(){var c=co();return(c&&c.moeda)||'MZN'}
function round(n){return Math.round(n*10000)/10000}
function pick(rates){var b=base(),rb=+rates[b],ru=+rates.USD||1,rz=+rates.ZAR;
 if(!(rb>0))throw new Error('moeda '+b+' indisponível');
 var out={};
 out.usd=b=='USD'?1:round(rb/ru);
 if(rz>0)out.zar=b=='ZAR'?1:round(rb/rz);
 if(!(out.usd>0)||(out.zar!==undefined&&!(out.zar>0)))throw new Error('taxa inválida');
 return out}
function get(i){
 if(i>=SRC.length)return Promise.reject(new Error('sem ligação às fontes de câmbio'));
 var s=SRC[i],ctl=window.AbortController?new AbortController():null,t=ctl&&setTimeout(function(){ctl.abort()},12000);
 return fetch(s.u,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(j){clearTimeout(t);var v=pick(s.f(j));v.src=s.n;return v})
  .catch(function(){clearTimeout(t);return get(i+1)})}
function enabled(){var c=co();return !!c&&c.cambioAuto!=='nao'}
function stale(){var c=co();return !c||!(+c.cambioTs>0)||Date.now()-c.cambioTs>=DAY||c.cambioMoeda!==base()}
function fdt(ts){try{return new Date(ts).toLocaleString(window.LANG=='en'?'en-GB':'pt-PT',{dateStyle:'short',timeStyle:'short'})}catch(e){return''}}
function status(msg){var e=document.getElementById('fx-status');if(!e)return;
 var c=co();if(!c)return;var b=base(),h='';
 if(msg)h+='<b>'+msg+'</b><br>';
 if(+c.cambioTs>0){h+=L('Última atualização: ','Last update: ')+fdt(c.cambioTs)+' · '+(c.cambioSrc||'')+'<br>';
  h+='1 USD = '+(+c.usd||'—')+' '+b+(+c.zar?' · 1 ZAR = '+c.zar+' '+b:'');
  if(enabled())h+='<br>'+L('Próxima atualização automática: ','Next automatic update: ')+fdt(+c.cambioTs+DAY)}
 else h+=L('Ainda não foi atualizado automaticamente.','Not updated automatically yet.');
 e.innerHTML=h}
function fillInputs(){var c=co();if(!c)return;[['usd','c_usd'],['zar','c_zar']].forEach(function(x){var i=document.getElementById(x[1]);if(i&&document.activeElement!==i&&c[x[0]]!==undefined&&c[x[0]]!=='')i.value=c[x[0]]})}
function run(force){
 var c=co();if(!c||busy)return Promise.resolve(false);
 if(!force&&(!enabled()||!stale()))return Promise.resolve(false);
 if(navigator.onLine===false){status(L('Sem internet — tentarei mais tarde.','Offline — will retry later.'));return Promise.resolve(false)}
 busy=true;status(L('A atualizar câmbio…','Updating exchange rates…'));
 return get(0).then(function(v){
  c=co();if(!c)return false;
  c.usd=v.usd;if(v.zar!==undefined)c.zar=v.zar;
  c.cambioTs=Date.now();c.cambioSrc=v.src;c.cambioMoeda=base();
  try{save()}catch(e){}
  fillInputs();status(L('✅ Câmbio atualizado.','✅ Exchange rates updated.'));return true})
 .catch(function(e){status(L('⚠️ Não foi possível atualizar agora: ','⚠️ Could not update now: ')+(e&&e.message||'erro'));return false})
 .then(function(r){busy=false;return r})}
window.FXRUN=function(force){return run(!!force)};
window.FXUI=function(){return '<div style="grid-column:1/-1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);padding:.7rem .9rem;font-size:.82rem;color:var(--muted);display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap">'+
  '<span id="fx-status">'+L('A carregar…','Loading…')+'</span>'+
  '<button class="btn btn-s sm" type="button" onclick="FXRUN(true)">🔄 '+L('Atualizar agora','Update now')+'</button></div>'};
/* mostra o estado sempre que a página Empresa é desenhada */
new MutationObserver(function(){if(document.getElementById('fx-status')&&!document.getElementById('fx-status').dataset.on){document.getElementById('fx-status').dataset.on=1;status()}}).observe(document.body,{childList:true,subtree:true});
function tick(){run(false)}
setTimeout(tick,4000);setInterval(tick,CHECK);
window.addEventListener('online',tick);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
})();
</script>

<script id="pedidos-online">
/* ===== PEDIDOS ONLINE (orçamentos e serviços) — equivalente ao "Pedidos online" do BBS POS =====
   Cliente: abre ?p=TOKEN (link público aleatório, sem código da empresa) -> pede orçamento/serviço, acompanha e conversa.
   Gestor: aba "Pedidos online" -> recebe com alerta, conversa, aceita (cria cliente + cotação) ou recusa. SQL: frota_pedidos_online.sql */

/* Bloqueia o "puxar para baixo" / efeito elástico em todas as abas, janelas e listas */
(function(){var sy=0,sx=0;
function sc(el){while(el&&el!==document.body&&el!==document.documentElement){var st=getComputedStyle(el);if(/(auto|scroll)/.test(st.overflowY)&&el.scrollHeight>el.clientHeight+1)return el;el=el.parentElement}return null}
document.addEventListener('touchstart',function(e){var t=e.touches[0];if(t){sy=t.clientY;sx=t.clientX}},{passive:true});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)return;var t=e.touches[0],dy=t.clientY-sy,dx=t.clientX-sx;if(Math.abs(dx)>Math.abs(dy))return;
 if(e.target.closest&&e.target.closest('.leaflet-container'))return;
 var el=sc(e.target);if(!el){if(e.cancelable)e.preventDefault();return}
 var top=el.scrollTop<=0,bot=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
 if((dy>0&&top)||(dy<0&&bot)){if(e.cancelable)e.preventDefault()}},{passive:false});
})();
</script>
